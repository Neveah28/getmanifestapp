/* ===================================================
   BASE
   =================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Nunito', -apple-system, system-ui, sans-serif;
  font-weight: 500;
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
  transition: background 0.4s ease, color 0.3s ease;
}
body {
  padding-bottom: calc(90px + env(safe-area-inset-bottom));
}
/* Quand on est sur le player, pas de scroll */
body.player-active {
  overflow: hidden;
  height: 100vh;
}

.app {
  max-width: 500px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 22px 20px;
}

h1.h1 {
  font-size: 26px;
  font-weight: 400;
  color: var(--text-strong);
  letter-spacing: -0.3px;
  margin-bottom: 16px;
  font-family: 'Nunito', sans-serif;
}
h1.h1 .dot { color: var(--accent); font-weight: 600; }

.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.h3 {
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 700;
  margin: 24px 0 10px;
}
.sublabel { font-size: 12px; color: var(--text-dim); line-height: 1.5; font-weight: 500; }

/* ===================================================
   TABS
   =================================================== */
.tabs {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--tab-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--tab-border);
  display: flex;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  z-index: 100;
  justify-content: space-around;
}
.tab {
  background: none;
  border: none;
  color: var(--text-faint);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 6px 14px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex: 1;
  font-weight: 700;
  border-radius: 100px;
  transition: color 0.2s;
}
.tab-icon { font-size: 18px; font-weight: 400; }
.tab.active { color: var(--accent); }

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* ===================================================
   PLAYER - plein écran, pas de scroll
   =================================================== */
#page-player.active {
  display: flex;
  flex-direction: column;
}
.player-fullscreen {
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 90px - max(20px, env(safe-area-inset-top)) - 40px - env(safe-area-inset-bottom));
  padding-bottom: 10px;
}
.player-top {
  text-align: center;
  margin-bottom: 14px;
}
/* Mini header global sur toutes les pages (sauf Player qui a son gros logo) */
.mini-header {
  text-align: center;
  padding: 4px 0 18px;
}
.mini-logo {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 28px;
  line-height: 1.3;
  padding: 2px 0;
  background: linear-gradient(90deg, #f5b593 0%, #f0a0a8 50%, #e478a0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.3px;
  display: inline-block;
}
.mini-tagline {
  font-size: 8px;
  letter-spacing: 3px;
  font-weight: 700;
  color: #a89d8f;
  margin-top: -2px;
}
/* Hide mini header sur le player (y'a le gros logo) */
body.player-active .mini-header { display: none; }

/* Header global visible sur toutes les pages */
.app-header {
  text-align: center;
  padding: 10px 0 20px;
}
.brand-logo {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 44px;
  line-height: 1.3;
  padding: 4px 0;
  background: linear-gradient(90deg, #f5b593 0%, #f0a0a8 50%, #e478a0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
  display: inline-block;
}
.brand-tagline {
  font-size: 10px;
  letter-spacing: 4px;
  font-weight: 700;
  color: #a89d8f;
  margin-top: 2px;
}
.brand-mode {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
  margin-top: 10px;
}
.brand-mode-name {
  color: var(--accent);
}

.player-selector-wrap {
  margin-bottom: 12px;
}
.player-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  min-height: 0;
}

.selector-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 8px;
}
.group-selector {
  width: 100%;
  background: var(--card-bg);
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 16px 44px 16px 20px;
  color: var(--text-strong);
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 6px 24px var(--accent-glow);
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 20px center;
}

/* support button floating */
.support-btn-float {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
  padding: 10px 18px;
  border-radius: 100px;
  font-family: inherit;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 0.5px;
  width: 100%;
  margin-top: 10px;
}
.support-btn-float:active { opacity: 0.7; }

.now-playing {
  text-align: center;
  font-weight: 600;
  font-size: 20px;
  color: var(--text-strong);
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  line-height: 1.3;
}
.now-playing-state {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 700;
  margin-top: -12px;
}

.orb-container {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.orb {
  width: 180px; height: 180px;
  border-radius: 50%;
  background: var(--orb-grad);
  box-shadow: 0 15px 45px var(--accent-glow), inset 0 -10px 25px rgba(0,0,0,0.12);
  animation: orbPulse 2s ease-in-out infinite;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 44px;
  font-weight: 700;
  transition: transform 0.15s;
  border: none;
}
.orb:active { transform: scale(0.95); }
.orb.paused {
  animation-play-state: paused;
  opacity: 0.6;
}
@keyframes orbPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.orb-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--accent-glow);
  animation: orbPulse 2s ease-in-out infinite reverse;
  pointer-events: none;
  opacity: 0.4;
}

/* Session stats sous l'orbe */
.session-stats {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: var(--card-bg);
  border-radius: 100px;
  padding: 10px 22px;
  box-shadow: var(--card-shadow);
  margin-top: 4px;
}
.session-stat-item {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text);
}
.session-stat-item svg {
  color: var(--accent);
  flex-shrink: 0;
}
.session-stat-val {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-strong);
  letter-spacing: -0.3px;
  font-variant-numeric: tabular-nums;
}
.session-stat-label {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 700;
}
.session-divider {
  width: 1px;
  height: 24px;
  background: var(--line);
}

/* ===================================================
   LIST
   =================================================== */
/* Action cards (nouveau design des 2 boutons créer) */
.action-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 24px;
}
.action-card {
  background: var(--card-bg);
  border: none;
  border-radius: 18px;
  padding: 16px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  box-shadow: var(--card-shadow);
  transition: transform 0.1s, box-shadow 0.2s;
  font-family: inherit;
  color: inherit;
  position: relative;
  overflow: hidden;
}
.action-card:active {
  transform: scale(0.98);
}
.action-card.primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  color: var(--btn-text);
  box-shadow: 0 8px 24px var(--accent-glow);
}
.action-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.action-card-icon.secondary {
  background: var(--accent);
  color: var(--btn-text);
}
.action-card.primary .action-card-icon {
  background: rgba(255,255,255,0.25);
  color: var(--btn-text);
}
.action-card-text {
  flex: 1;
  min-width: 0;
}
.action-card-title {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.2px;
  margin-bottom: 2px;
}
.action-card-sub {
  font-size: 11px;
  font-weight: 600;
  opacity: 0.75;
  letter-spacing: 0.3px;
}
.action-card:not(.primary) .action-card-title {
  color: var(--text-strong);
}
.action-card:not(.primary) .action-card-sub {
  color: var(--text-dim);
  opacity: 1;
}

.group-section {
  margin-bottom: 24px;
}
.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 0 4px;
}
.group-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-strong);
}
.group-count {
  font-size: 11px;
  color: var(--text-faint);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.group-actions-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}

.aff-row {
  background: var(--card-bg);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--card-shadow);
}
.aff-title {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-strong);
  line-height: 1.3;
}
.aff-no-rec {
  color: var(--text-faint);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 3px;
  font-weight: 700;
}
.aff-rec-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  box-shadow: 0 0 8px var(--accent-glow);
}
.aff-rec-dot.empty { background: transparent; border: 1.5px solid var(--text-faint); box-shadow: none; }
.aff-btn {
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--accent);
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  transition: transform 0.1s;
}
.aff-btn:active { transform: scale(0.9); }
.aff-btn.danger { color: var(--danger); }

.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-dim);
}
.empty-state .big {
  font-size: 48px;
  opacity: 0.5;
  margin-bottom: 14px;
  color: var(--accent);
}

/* ===================================================
   SETTINGS
   =================================================== */
.setting-group {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 6px 18px;
  margin-bottom: 14px;
  box-shadow: var(--card-shadow);
}
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.setting-row:last-child { border-bottom: none; }
.setting-row.col { flex-direction: column; align-items: stretch; gap: 10px; }
.setting-label { font-size: 14px; font-weight: 600; color: var(--text-strong); }
.setting-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-weight: 500; line-height: 1.4; }
.setting-val { color: var(--accent); font-weight: 800; font-size: 18px; }

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  background: transparent;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  background: var(--line);
  border-radius: 4px;
}
input[type="range"]::-moz-range-track {
  height: 4px;
  background: var(--line);
  border-radius: 4px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px;
  background: var(--accent);
  border-radius: 50%;
  margin-top: -9px;
  cursor: pointer;
  box-shadow: 0 2px 8px var(--accent-glow);
}
input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px;
  background: var(--accent);
  border-radius: 50%;
  border: none;
  cursor: pointer;
  box-shadow: 0 2px 8px var(--accent-glow);
}

.input-text, .input-select {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--text-strong);
  font-family: inherit;
  font-weight: 500;
  font-size: 14px;
  margin: 0;
}
.input-text:focus, .input-select:focus { outline: none; border-color: var(--accent); }

.music-mode-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 6px;
}
.music-mode-row.two { grid-template-columns: 1fr 1fr; }
.music-mode-btn {
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text-dim);
  padding: 10px 6px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: all 0.2s;
}
.music-mode-btn.active {
  background: var(--accent);
  color: var(--btn-text);
  border-color: var(--accent);
}

/* THEME PICKER */
.theme-picker {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.theme-chip {
  position: relative;
  border-radius: 14px;
  padding: 14px 10px 10px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  text-align: center;
}
.theme-chip.active { border-color: var(--text-strong); }
.theme-chip-orb {
  width: 36px; height: 36px;
  border-radius: 50%;
  margin: 0 auto 8px;
}
.theme-chip-name {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: inherit;
}
/* Light chips (par défaut) */
.theme-chip.doux { background: linear-gradient(135deg, #fff5ef, #f5c8c3); color: #3d2a28; }
.theme-chip.doux .theme-chip-orb { background: linear-gradient(135deg, #f5b593, #e478a0); }
.theme-chip.boho { background: linear-gradient(135deg, #f5ede3, #d4b89a); color: #4a3523; }
.theme-chip.boho .theme-chip-orb { background: linear-gradient(135deg, #d4916e, #8b4a2d); }
.theme-chip.ocean { background: linear-gradient(135deg, #e3f2f7, #88c5d8); color: #0a2d3d; }
.theme-chip.ocean .theme-chip-orb { background: linear-gradient(135deg, #7dd3e8, #1e88ab); }
.theme-chip.mini { background: #f8f6f3; color: #1a1a1a; border-color: #e8e4df; }
.theme-chip.mini.active { border-color: #1a1a1a; }
.theme-chip.mini .theme-chip-orb { background: linear-gradient(135deg, #333, #1a1a1a); }
.theme-chip.lavande { background: linear-gradient(135deg, #eee6f8, #bda4de); color: #392a5c; }
.theme-chip.lavande .theme-chip-orb { background: linear-gradient(135deg, #d4b5f0, #7855c4); }
.theme-chip.sauge { background: linear-gradient(135deg, #f4f1e8, #c8cfb4); color: #3a4530; }
.theme-chip.sauge .theme-chip-orb { background: linear-gradient(135deg, #b8c998, #607848); }

/* Dark chips (quand l'app est en mode sombre) */
.theme-picker.dark-preview .theme-chip.doux { background: linear-gradient(135deg, #1a1410, #2d1f1a); color: #faeae0; }
.theme-picker.dark-preview .theme-chip.doux .theme-chip-orb { background: linear-gradient(135deg, #f5b593, #e478a0); }
.theme-picker.dark-preview .theme-chip.boho { background: linear-gradient(135deg, #1a1310, #3a2a1c); color: #f8ead3; }
.theme-picker.dark-preview .theme-chip.boho .theme-chip-orb { background: linear-gradient(135deg, #f5b593, #b86842); }
.theme-picker.dark-preview .theme-chip.ocean { background: linear-gradient(135deg, #031420, #0a3550); color: #e8f5fa; }
.theme-picker.dark-preview .theme-chip.ocean .theme-chip-orb { background: linear-gradient(135deg, #a8e8fa, #2a95c0); }
.theme-picker.dark-preview .theme-chip.mini { background: #0f0f0f; color: #ffffff; border-color: #333333; }
.theme-picker.dark-preview .theme-chip.mini.active { border-color: #ffffff; }
.theme-picker.dark-preview .theme-chip.mini .theme-chip-orb { background: linear-gradient(135deg, #e0e0e0, #ffffff); }
.theme-picker.dark-preview .theme-chip.lavande { background: linear-gradient(135deg, #10081e, #241440); color: #ebe0f8; }
.theme-picker.dark-preview .theme-chip.lavande .theme-chip-orb { background: linear-gradient(135deg, #e0cdf5, #7855c4); }
.theme-picker.dark-preview .theme-chip.sauge { background: linear-gradient(135deg, #0d140a, #1c2a16); color: #e2ead0; }
.theme-picker.dark-preview .theme-chip.sauge .theme-chip-orb { background: linear-gradient(135deg, #c4d9a4, #607848); }

/* ===================================================
   MODAL
   =================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
.modal {
  background: var(--bg-solid);
  border-radius: 24px 24px 0 0;
  padding: 20px 22px calc(20px + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 500px;
  max-height: 88vh;
  overflow-y: auto;
  animation: slideUp 0.3s;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 18px;
  text-align: center;
  color: var(--text-strong);
}
.modal-title .accent { color: var(--accent); }
.modal-handle {
  width: 40px; height: 4px;
  background: var(--line);
  border-radius: 2px;
  margin: -8px auto 14px;
}

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: var(--btn-text);
  border: none;
  padding: 14px;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  margin-top: 14px;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.btn-secondary {
  width: 100%;
  background: transparent;
  color: var(--text-strong);
  border: 1.5px solid var(--line);
  padding: 12px;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  margin-top: 8px;
}
.btn-secondary.danger { color: var(--danger); border-color: var(--danger); }

/* ===================================================
   RECORD
   =================================================== */
.rec-btn {
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 3px solid var(--line);
  background: var(--input-bg);
  color: var(--danger);
  font-size: 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
  transition: all 0.2s;
}
.rec-btn.recording {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
  animation: recPulse 1s infinite;
}
@keyframes recPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201, 61, 90, 0.5); }
  50% { box-shadow: 0 0 0 15px rgba(201, 61, 90, 0); }
}
.rec-timer {
  text-align: center;
  font-size: 32px;
  color: var(--accent);
  font-weight: 800;
  margin: 10px 0;
}
.rec-wrapper { text-align: center; padding: 16px 0; }
.playback-btn {
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text-strong);
  border-radius: 100px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  margin: 10px 4px 0;
}

/* ===================================================
   TOAST
   =================================================== */
.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text-strong);
  color: var(--card-bg);
  padding: 12px 22px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  z-index: 300;
  animation: toastIn 0.3s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

.hidden { display: none !important; }

/* ===================================================
   PLAYER FAB (floating action button bas droite)
   =================================================== */
.player-fab {
  position: fixed;
  right: 20px;
  bottom: calc(100px + env(safe-area-inset-bottom));
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 1px solid var(--line);
  color: var(--accent);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15), 0 0 0 1px var(--accent-glow);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 90;
  transition: all 0.25s ease;
}
.player-fab:active {
  transform: scale(0.92);
  background: var(--accent);
  color: var(--btn-text);
}
.player-fab svg {
  transition: transform 0.4s ease;
}
.player-fab:active svg {
  transform: rotate(45deg);
}

/* ===================================================
   PLAY COUNT BADGE sur affirmation
   =================================================== */
.aff-play-count {
  display: inline-block;
  background: var(--line);
  color: var(--text-dim);
  padding: 2px 7px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  margin-left: 4px;
  vertical-align: middle;
}

/* ===================================================
   STATS PAGE
   =================================================== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 10px;
}
.stats-card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 16px 14px;
  box-shadow: var(--card-shadow);
  text-align: center;
}
.stats-card.primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  color: var(--btn-text);
  box-shadow: 0 8px 24px var(--accent-glow);
}
.stats-card-icon {
  font-size: 22px;
  margin-bottom: 6px;
}
.stats-card-val {
  font-size: 28px;
  font-weight: 800;
  color: var(--text-strong);
  line-height: 1;
}
.stats-card.primary .stats-card-val { color: var(--btn-text); }
.stats-card-label {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
  margin-top: 6px;
}
.stats-card.primary .stats-card-label { color: var(--btn-text); opacity: 0.85; }

/* Graphique 7 jours */
.stats-chart {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  background: var(--card-bg);
  border-radius: 16px;
  padding: 20px 14px 14px;
  box-shadow: var(--card-shadow);
  height: 180px;
}
.chart-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.chart-bar-wrap {
  flex: 1;
  display: flex;
  align-items: flex-end;
  width: 100%;
  padding: 0 2px;
}
.chart-bar {
  width: 100%;
  background: var(--accent);
  border-radius: 6px 6px 0 0;
  min-height: 2px;
  transition: height 0.4s;
}
.chart-bar.today {
  background: linear-gradient(180deg, var(--accent-light), var(--accent));
  box-shadow: 0 0 12px var(--accent-glow);
}
.chart-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  margin-top: 8px;
}
.chart-label.today { color: var(--accent); }
.chart-count {
  font-size: 10px;
  color: var(--text-faint);
  font-weight: 600;
  margin-top: 2px;
  min-height: 12px;
}

/* Top rows */
.top-row {
  background: var(--card-bg);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
  box-shadow: var(--card-shadow);
}
.top-rank {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--btn-text);
  font-weight: 800;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.top-content {
  flex: 1;
  min-width: 0;
}
.top-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-strong);
}
.top-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}
.top-count {
  font-weight: 800;
  color: var(--accent);
  font-size: 15px;
}

/* ===================================================
   CHALLENGE
   =================================================== */
.challenge-aff-card {
  background: var(--card-bg);
  border-radius: 18px;
  padding: 18px 20px;
  margin-bottom: 20px;
  box-shadow: var(--card-shadow);
}
.challenge-aff-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.challenge-aff-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-strong);
  line-height: 1.3;
}

.challenge-progress-wrap {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  color: var(--btn-text);
  border-radius: 24px;
  padding: 26px 24px;
  margin-bottom: 16px;
  box-shadow: 0 10px 30px var(--accent-glow);
}
.challenge-progress-stats {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}
.challenge-count-main {
  font-size: 48px;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1;
}
.challenge-count-sub {
  font-size: 18px;
  font-weight: 700;
  opacity: 0.7;
}
.challenge-progress-bar {
  height: 10px;
  background: rgba(255,255,255,0.25);
  border-radius: 100px;
  overflow: hidden;
  margin-bottom: 10px;
}
.challenge-progress-fill {
  height: 100%;
  background: #fff;
  border-radius: 100px;
  box-shadow: 0 0 12px rgba(255,255,255,0.5);
  transition: width 0.4s;
}
.challenge-progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  opacity: 0.85;
}
.challenge-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Toggle Dark mode */
.dark-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.dark-toggle-labels {
  display: flex;
  gap: 4px;
}
.dark-emoji { font-size: 14px; }
.toggle-switch {
  background: var(--line);
  border: none;
  width: 44px;
  height: 24px;
  border-radius: 100px;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
  padding: 0;
}
.toggle-switch.active { background: var(--accent); }
.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.3s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle-switch.active .toggle-knob { transform: translateX(20px); }
.dark-toggle-text {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.dark-toggle-text strong {
  color: var(--accent);
  font-weight: 800;
  margin-left: 4px;
}

/* Barre vitesse live */
.live-speed {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 14px 18px;
  box-shadow: var(--card-shadow);
  margin-top: 4px;
}
.live-speed-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.live-speed-label > span:first-child {

  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);

  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
}

  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
  color: var(--text-faint);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 700;
}
.challenge-divider::before, .challenge-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

   ICÔNES SVG DES ONGLETS (style minimaliste moderne)
   =================================================== */
.tab-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  transition: all 0.25s ease;
}
.tab-icon svg {
  width: 100%;
  height: 100%;
  transition: transform 0.25s ease;
}
.tab.active .tab-icon {
  color: var(--accent);
}
.tab.active .tab-icon svg {
  transform: scale(1.12);
  filter: drop-shadow(0 2px 6px var(--accent-glow));
}

/* ===================================================
   ONBOARDING
   =================================================== */
.onboarding-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-grad);
  background-attachment: fixed;
  z-index: 500;
  display: flex;
  flex-direction: column;
  padding: max(30px, env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom));
  animation: fadeIn 0.4s;
}
.ob-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.ob-step-indicator {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
}
.ob-skip-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: inherit;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  text-decoration: underline;
}
.ob-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 28px;
  padding: 20px 0;
}
.ob-visual {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: var(--orb-grad);
  box-shadow: 0 15px 50px var(--accent-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  color: #fff;
  animation: orbPulse 2s ease-in-out infinite;
}
.ob-title {
  font-size: 30px;
  font-weight: 800;
  color: var(--text-strong);
  letter-spacing: -0.5px;
  max-width: 400px;
  line-height: 1.15;
}
.ob-text {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  max-width: 360px;
  line-height: 1.5;
}
.ob-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}
.ob-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--line);
  transition: all 0.3s;
}
.ob-dot.active {
  background: var(--accent);
  width: 28px;
  border-radius: 100px;
}
.ob-next-btn {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  background: var(--accent);
  color: var(--btn-text);
  border: none;
  padding: 16px;
  border-radius: 100px;
  font-family: inherit;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 6px 24px var(--accent-glow);
  letter-spacing: 0.3px;
}
.ob-next-btn:active { transform: scale(0.98); }

/* Example badge sur affirmations exemples */
.example-badge {
  display: inline-block;
  background: var(--accent);
  color: var(--btn-text);
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-left: 6px;
  vertical-align: middle;
}
.aff-example-hint {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 3px;
  font-weight: 700;
}

function t(key, vars) {
  const lang = state.settings.language || 'fr';
  let str = (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.fr[key] || key;
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.replace('{' + k + '}', vars[k]); });
  }
  return str;
}

function detectBrowserLang() {
  const l = (navigator.language || 'fr').toLowerCase();
  if (l.startsWith('fr')) return 'fr';
  return 'en';
}

let state = loadState();

function defaultState() {
  const lang = detectBrowserLang();
  const defaultPlaylistName = lang === 'en' ? 'My affirmations' : 'Mes affirmations';
  return {
    groups: [{ id: 'g_default', name: defaultPlaylistName }],
    affirmations: [],
    onboardingDone: false,
    settings: {
      affVolume: 1.0,
      musicVolume: 0.3,
      pauseBetween: 3,
      playbackRate: 1.0,
      musicMode: 'none',
      musicPlaylistUrl: '',
      pauseMode: 'silence', // deprecated, kept for backward compat
      selectedGroupId: 'all',
      theme: 'doux',
      language: null,
      kofiUrl: 'https://ko-fi.com/getmanifestapp',
      darkMode: true,
    },
    challenge: {
      affirmationId: null,
      count: 0,
      target: 10000,
      startedAt: null,
      playing: false,
    },
    stats: {
      totalPlays: 0,
      sessionsCount: 0,
      totalSeconds: 0,
      totalLoops: 0,
      byDay: {}, // { 'YYYY-MM-DD': { plays, loops, seconds } }
      byAffirmation: {}, // { affId: { plays, lastPlayed } }
      byPlaylist: {}, // { playlistId: { plays } }
      bestDay: { date: null, plays: 0 },
      streak: 0,
      lastActiveDay: null,
    }
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const p = JSON.parse(raw);
    const d = defaultState();
    return {
      groups: p.groups || d.groups,
      affirmations: p.affirmations !== undefined ? p.affirmations : d.affirmations,
      settings: Object.assign(d.settings, p.settings || {}),
      stats: Object.assign(d.stats, p.stats || {}),
      challenge: Object.assign(d.challenge, p.challenge || {}),
      onboardingDone: p.onboardingDone || false,
    };
  } catch(e) { return defaultState(); }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { toast(t('toast_storage_full')); }
}

function applyTheme() {
  let theme = state.settings.theme || 'doux';
  // Migration : ancien thème 'tech' → 'ocean'
  if (theme === 'tech') { theme = 'ocean'; state.settings.theme = 'ocean'; saveState(); }
  const dark = state.settings.darkMode ? '-dark' : '';
  document.documentElement.setAttribute('data-theme', theme + dark);
}

function uid() { return 'id_' + Math.random().toString(36).slice(2, 10); }
function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let currentTab = 'player';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.body.classList.toggle('player-active', tab === 'player');
  // scroll to top quand on change d'onglet
  window.scrollTo(0, 0);
  render();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

function render() {
  if (currentTab === 'player') renderPlayer();
  else if (currentTab === 'list') renderList();
  else if (currentTab === 'challenge') renderChallenge();
  else if (currentTab === 'stats') renderStats();
  else if (currentTab === 'settings') renderSettings();
}

function formatSessionTime(secs) {
  secs = Math.max(0, Math.floor(secs));
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function getAvailableAffs() {
  const s = state.settings;
  return state.affirmations.filter(a => {
    if (!a.recording) return false;
    if (s.selectedGroupId === 'all') return true;
    return a.groupId === s.selectedGroupId;
  });
}

function togglePlay() {
  if (playerState.playing) stopPlayback();
  else startPlayback();
}

function startPlayback() {
  const affs = getAvailableAffs();
  if (affs.length === 0) { toast(t('toast_no_recordings')); return; }
  playerState.queue = affs;
  if (playerState.currentIdx >= affs.length) playerState.currentIdx = 0;
  playerState.playing = true;
  playerState.repeatPending = false;
  playerState.sessionStart = Date.now();
  state.stats.sessionsCount++;
  saveState();
  startMusic();
  playNext();
  renderPlayer();
  // live timer
  if (playerState.sessionTimerInterval) clearInterval(playerState.sessionTimerInterval);
  playerState.sessionTimerInterval = setInterval(() => {
    const el = document.getElementById('session-timer');
    if (el && playerState.sessionStart) {
      el.textContent = formatSessionTime(Math.floor((Date.now() - playerState.sessionStart)/1000));
    }
  }, 1000);
}

function stopPlayback() {
  playerState.playing = false;
  const audio = document.getElementById('aff-audio');
  audio.pause();
  audio.currentTime = 0;
  if (playerState.pauseTimeout) { clearTimeout(playerState.pauseTimeout); playerState.pauseTimeout = null; }
  if (playerState.sessionTimerInterval) { clearInterval(playerState.sessionTimerInterval); playerState.sessionTimerInterval = null; }
  playerState.sessionStart = null;
  stopMusic();
  renderPlayer();
}

function playNext() {
  if (!playerState.playing) return;
  const audio = document.getElementById('aff-audio');
  const aff = playerState.queue[playerState.currentIdx];
  if (!aff) return;

  audio.src = aff.recording;
  audio.volume = state.settings.affVolume;
  audio.playbackRate = state.settings.playbackRate;
  audio.play().catch(e => { toast(t('toast_play_error')); stopPlayback(); });

  const npEl = document.getElementById('now-playing');
  if (npEl) npEl.textContent = aff.title;
  const stEl = document.getElementById('np-state');
  if (stEl) stEl.textContent = t('playing');

  audio.onended = () => {
    if (!playerState.playing) return;

    playerState.totalPlayed++;

    // Track play stats pour l'affirmation qu'on vient de terminer
    trackPlay(aff);

    playerState.currentIdx++;
    if (playerState.currentIdx >= playerState.queue.length) {
      playerState.currentIdx = 0;
      playerState.loopCount++;
      trackLoop();
    }

    saveState();
    const lc = document.getElementById('loop-counter');
    if (lc) lc.textContent = playerState.loopCount;
    const tc = document.getElementById('total-counter');
    if (tc) tc.textContent = playerState.totalPlayed;

    const stEl2 = document.getElementById('np-state');
    if (stEl2) stEl2.textContent = t('pause_wait', { s: state.settings.pauseBetween });
    playerState.pauseTimeout = setTimeout(() => {
      if (!playerState.playing) return;
      playNext();
    }, state.settings.pauseBetween * 1000);
  };
}

let droneCtx = null;
let droneNodes = [];

function startMusic() {
  const mode = state.settings.musicMode;
  if (mode === 'drone') startDrone();
  else if (mode === 'playlist' && state.settings.musicPlaylistUrl) {
    window.open(state.settings.musicPlaylistUrl, '_blank');
  }
}
function stopMusic() { stopDrone(); }

function startDrone() {
  stopDrone();
  try {
    droneCtx = new (window.AudioContext || window.webkitAudioContext)();
    const vol = state.settings.musicVolume;
    [110, 164.81, 220].forEach(f => {
      const osc = droneCtx.createOscillator();
      const gain = droneCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.value = vol * 0.08;
      osc.connect(gain);
      gain.connect(droneCtx.destination);
      osc.start();
      droneNodes.push({ osc, gain });
    });
  } catch(e) {}
}

function stopDrone() {
  droneNodes.forEach(({osc, gain}) => {
    try {
      gain.gain.setValueAtTime(gain.gain.value, droneCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, droneCtx.currentTime + 0.3);
      osc.stop(droneCtx.currentTime + 0.4);
    } catch(e){}
  });
  droneNodes = [];
  if (droneCtx) setTimeout(() => { try { droneCtx.close(); } catch(e){} droneCtx = null; }, 500);
}

function updateDroneVolume() {
  const vol = state.settings.musicVolume;
  droneNodes.forEach(({gain}) => { try { gain.gain.value = vol * 0.08; } catch(e){} });
}

  if (!ts) return '';
  const d = new Date(ts);
  const lang = state.settings.language || 'fr';
  const months = {
    fr: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'],
    en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  };
  const ms = months[lang] || months.fr;
  return `${d.getDate()} ${ms[d.getMonth()]} ${d.getFullYear()}`;
}

function trackPlay(aff) {
  if (!aff) return;
  const key = todayKey();
  const s = state.stats;

  // byDay
  if (!s.byDay[key]) s.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
  s.byDay[key].plays++;
  s.byDay[key].seconds += Math.round(aff.duration || 0);

  // byAffirmation
  if (!s.byAffirmation[aff.id]) s.byAffirmation[aff.id] = { plays: 0, lastPlayed: 0 };
  s.byAffirmation[aff.id].plays++;
  s.byAffirmation[aff.id].lastPlayed = Date.now();

  // byPlaylist
  if (aff.groupId) {
    if (!s.byPlaylist[aff.groupId]) s.byPlaylist[aff.groupId] = { plays: 0 };
    s.byPlaylist[aff.groupId].plays++;
  }

  // globals
  s.totalPlays++;
  s.totalSeconds += Math.round(aff.duration || 0);

  // best day
  if (s.byDay[key].plays > s.bestDay.plays) {
    s.bestDay = { date: key, plays: s.byDay[key].plays };
  }

  // streak
  updateStreak();

  saveState();
}

function trackLoop() {
  const key = todayKey();
  if (!state.stats.byDay[key]) state.stats.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
  state.stats.byDay[key].loops++;
  state.stats.totalLoops++;
  saveState();
}

function updateStreak() {
  const s = state.stats;
  const today = todayKey();
  if (s.lastActiveDay === today) return; // déjà compté aujourd'hui

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  if (s.lastActiveDay === yKey) {
    s.streak++;
  } else if (!s.lastActiveDay) {
    s.streak = 1;
  } else {
    s.streak = 1; // reset
  }
  s.lastActiveDay = today;
}

function timeAgo(ts) {
  if (!ts) return t('stats_never_played');
  const now = Date.now();
  const diff = Math.floor((now - ts) / 1000);
  if (diff < 60) return t('stats_just_now');
  if (diff < 3600) return t('stats_mins_ago', { n: Math.floor(diff/60) });
  if (diff < 86400) return t('stats_hours_ago', { n: Math.floor(diff/3600) });
  const days = Math.floor(diff/86400);
  if (days === 0) return t('stats_today_short');
  return t('stats_days_ago', { n: days });
}

// Enregistrement intégré dans l'onglet 10K
let chRecorder = { mediaRecorder: null, chunks: [], startTime: 0, interval: null, recording: null, duration: 0 };

function setupChallengeRecorder() {
  const recBtn = document.getElementById('ch-rec-btn');
  const timer = document.getElementById('ch-rec-timer');
  const hint = document.getElementById('ch-rec-hint');
  const playback = document.getElementById('ch-rec-playback');
  const createBtn = document.getElementById('ch-create');
  const titleInput = document.getElementById('ch-new-title');

  if (!recBtn) return;

  const updateCreateBtn = () => {
    const hasTitle = titleInput.value.trim().length > 0;
    const hasRec = !!chRecorder.recording;
    if (hasTitle && hasRec) {
      createBtn.disabled = false;
      createBtn.style.opacity = '1';
    } else {
      createBtn.disabled = true;
      createBtn.style.opacity = '0.5';
    }
  };

  titleInput.addEventListener('input', updateCreateBtn);

  recBtn.addEventListener('click', async () => {
    if (chRecorder.mediaRecorder && chRecorder.mediaRecorder.state === 'recording') {
      chRecorder.mediaRecorder.stop();
      recBtn.classList.remove('recording');
      recBtn.textContent = '●';
      clearInterval(chRecorder.interval);
    } else {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chRecorder.chunks = [];
        chRecorder.mediaRecorder = new MediaRecorder(stream);
        chRecorder.mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chRecorder.chunks.push(e.data); };
        chRecorder.mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chRecorder.chunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = () => {
            chRecorder.recording = reader.result;
            chRecorder.duration = (Date.now() - chRecorder.startTime) / 1000;
            timer.textContent = formatDur(chRecorder.duration);
            hint.textContent = t('rec_exists');
            playback.style.display = 'block';
            updateCreateBtn();
          };
          reader.readAsDataURL(blob);
        };
        chRecorder.mediaRecorder.start();
        chRecorder.startTime = Date.now();
        recBtn.classList.add('recording');
        recBtn.textContent = '■';
        chRecorder.interval = setInterval(() => {
          timer.textContent = formatDur((Date.now() - chRecorder.startTime) / 1000);
        }, 100);
      } catch(e) { toast(t('toast_mic_error')); }
    }
  });

  document.getElementById('ch-rec-play')?.addEventListener('click', () => {
    const a = document.getElementById('aff-audio');
    a.src = chRecorder.recording;
    a.volume = state.settings.affVolume;
    a.playbackRate = state.settings.playbackRate;
    a.play();
  });

  document.getElementById('ch-rec-redo')?.addEventListener('click', () => {
    chRecorder.recording = null;
    chRecorder.duration = 0;
    timer.textContent = formatDur(0);
    hint.textContent = t('ch_rec_hint');
    playback.style.display = 'none';
    updateCreateBtn();
  });

  createBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    if (!title || !chRecorder.recording) return;

    // Trouver un groupe par défaut (le premier)
    let groupId = state.groups[0]?.id;
    if (!groupId) {
      // Créer un groupe si aucun
      const newG = { id: uid(), name: state.settings.language === 'en' ? 'My affirmations' : 'Mes affirmations' };
      state.groups.push(newG);
      groupId = newG.id;
    }

    const newAff = {
      id: uid(),
      title,
      groupId,
      recording: chRecorder.recording,
      duration: chRecorder.duration,
    };
    state.affirmations.push(newAff);

    // Reset du recorder
    chRecorder = { mediaRecorder: null, chunks: [], startTime: 0, interval: null, recording: null, duration: 0 };

    // Set comme affirmation du challenge
    state.challenge.affirmationId = newAff.id;
    state.challenge.count = 0;
    state.challenge.startedAt = Date.now();
    saveState();

    toast(t('toast_created'));
    render();
  });
}

function toggleChallenge() {
  if (state.challenge.playing) {
    stopChallenge();
  } else {
    startChallenge();
  }
}

function startChallenge() {
  const aff = state.affirmations.find(a => a.id === state.challenge.affirmationId && a.recording);
  if (!aff) { toast(t('toast_no_recordings')); return; }
  state.challenge.playing = true;
  if (!state.challenge.startedAt) state.challenge.startedAt = Date.now();
  saveState();
  startMusic();
  playChallenge();
  render();
  toast(t('challenge_started'));
}

function stopChallenge() {
  state.challenge.playing = false;
  if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
  if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
  stopMusic();
  saveState();
  render();
}

function playChallenge() {
  if (!state.challenge.playing) return;
  const aff = state.affirmations.find(a => a.id === state.challenge.affirmationId && a.recording);
  if (!aff) { stopChallenge(); return; }

  const audio = document.getElementById('aff-audio');
  audio.src = aff.recording;
  audio.volume = state.settings.affVolume;
  audio.playbackRate = state.settings.playbackRate;
  audio.play().catch(() => { toast(t('toast_play_error')); stopChallenge(); });
  challengeAudio = audio;

  audio.onended = () => {
    if (!state.challenge.playing) return;

    state.challenge.count++;
    trackPlay(aff);
    saveState();

    // Update UI
    const el = document.querySelector('.challenge-count-main');
    if (el) el.textContent = state.challenge.count.toLocaleString();
    const fill = document.querySelector('.challenge-progress-fill');
    if (fill) fill.style.width = Math.min(100, (state.challenge.count / state.challenge.target) * 100) + '%';
    const pctEl = document.querySelector('.challenge-progress-info span:first-child');
    if (pctEl) pctEl.textContent = ((state.challenge.count / state.challenge.target) * 100).toFixed(1) + '%';
    const remEl = document.querySelector('.challenge-progress-info span:last-child');
    if (remEl) remEl.textContent = Math.max(0, state.challenge.target - state.challenge.count).toLocaleString() + ' ' + t('challenge_remaining');

    if (state.challenge.count >= state.challenge.target) {
      stopChallenge();
      toast(t('challenge_done'));
      return;
    }

    challengeTimeout = setTimeout(() => {
      if (!state.challenge.playing) return;
      playChallenge();
    }, state.settings.pauseBetween * 1000);
  };
}

function renderStats() {
  const s = state.stats;
  const today = todayKey();
  const todayStats = s.byDay[today] || { plays: 0, loops: 0, seconds: 0 };

  // 7 derniers jours
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const ds = s.byDay[k] || { plays: 0 };
    last7.push({ day: ['D','L','M','M','J','V','S'][d.getDay()], count: ds.plays, isToday: k === today });
  }
  const maxDay = Math.max(1, ...last7.map(d => d.count));

  // Semaine total
  const weekTotal = last7.reduce((sum, d) => sum + d.count, 0);

  // Top affirmations
  const topAffs = Object.entries(s.byAffirmation || {})
    .map(([id, data]) => {
      const aff = state.affirmations.find(a => a.id === id);
      return aff ? { title: aff.title, plays: data.plays, lastPlayed: data.lastPlayed } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.plays - a.plays)
    .slice(0, 5);

  // Top playlists

function openAffModal(existing) {
  const isEdit = !!existing;
  const aff = existing || { id: uid(), title: '', groupId: state.groups[0].id, recording: null, duration: 0 };

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">${isEdit ? t('edit_aff') : t('new_aff')} <span class="accent">${t('word_affirmation')}</span></div>

      <div class="h3">${t('title')}</div>
      <input type="text" class="input-text" id="aff-title" placeholder="${t('aff_placeholder')}" value="${escapeHtml(aff.title)}" />

      <div class="h3">${t('group')}</div>
      <select class="input-select" id="aff-group">
        ${state.groups.map(g => `<option value="${g.id}" ${g.id===aff.groupId?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}
      </select>

      <div class="h3">${t('voice_recording')}</div>
      <div class="rec-wrapper">
        <div class="rec-timer" id="rec-timer">${formatDur(aff.duration)}</div>
        <button class="rec-btn" id="rec-btn">●</button>
        <p class="sublabel" style="margin-top:12px">${aff.recording ? t('rec_exists') : t('rec_tap')}</p>
        ${aff.recording ? `
          <div style="margin-top:4px">
            <button class="playback-btn" id="rec-play">${t('listen')}</button>
            <button class="playback-btn" id="rec-delete" style="color:var(--danger)">${t('erase')}</button>
          </div>
        ` : ''}
      </div>

      <button class="btn-primary" id="aff-save">${isEdit ? t('save') : t('create')}</button>
      ${isEdit ? `<button class="btn-secondary danger" id="aff-delete">${t('delete')}</button>` : ''}
      <button class="btn-secondary" id="aff-cancel">${t('cancel')}</button>
    </div>
  `;
  document.body.appendChild(overlay);

  let currentRecording = aff.recording;
  let currentDuration = aff.duration;
  let mediaRecorder = null;
  let recChunks = [];
  let recStartTime = 0;
  let recTimerInterval = null;

  const recBtn = document.getElementById('rec-btn');
  const recTimer = document.getElementById('rec-timer');

  recBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recBtn.classList.remove('recording');
      recBtn.textContent = '●';
      clearInterval(recTimerInterval);
    } else {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(recChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = () => {
            currentRecording = reader.result;
            currentDuration = (Date.now() - recStartTime) / 1000;
            recTimer.textContent = formatDur(currentDuration);
            toast(t('toast_recorded'));
            refreshRecButtons();
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        recStartTime = Date.now();
        recBtn.classList.add('recording');
        recBtn.textContent = '■';
        recTimerInterval = setInterval(() => {
          recTimer.textContent = formatDur((Date.now() - recStartTime) / 1000);
        }, 100);
      } catch(e) { toast(t('toast_mic_error')); }
    }
  });

  function refreshRecButtons() {
    const wrap = document.querySelector('.rec-wrapper');
    document.getElementById('rec-play')?.remove();
    document.getElementById('rec-delete')?.remove();
    const container = document.querySelector('.rec-wrapper > div');
    if (container) container.remove();

    if (currentRecording) {
      const div = document.createElement('div');
      div.style.marginTop = '4px';
      const playBtn = document.createElement('button');
      playBtn.className = 'playback-btn';
      playBtn.id = 'rec-play';
      playBtn.textContent = t('listen');
      div.appendChild(playBtn);
      const delBtn = document.createElement('button');
      delBtn.className = 'playback-btn';
      delBtn.id = 'rec-delete';
      delBtn.style.color = 'var(--danger)';
      delBtn.textContent = t('erase');
      div.appendChild(delBtn);
      wrap.appendChild(div);

      playBtn.addEventListener('click', () => {
        const a = document.getElementById('aff-audio');
        a.src = currentRecording; a.volume = state.settings.affVolume; a.playbackRate = state.settings.playbackRate; a.play();
      });
      delBtn.addEventListener('click', () => {
        if (confirm(t('confirm_erase_rec'))) {
          currentRecording = null;
          currentDuration = 0;
          recTimer.textContent = formatDur(0);
          refreshRecButtons();
        }
      });
    }
  }

  document.getElementById('rec-play')?.addEventListener('click', () => {
    const a = document.getElementById('aff-audio');
    a.src = currentRecording; a.volume = state.settings.affVolume; a.playbackRate = state.settings.playbackRate; a.play();
  });
  document.getElementById('rec-delete')?.addEventListener('click', () => {
    if (confirm(t('confirm_erase_rec'))) {
      currentRecording = null;
      currentDuration = 0;
      recTimer.textContent = formatDur(0);
      refreshRecButtons();
    }
  });

  document.getElementById('aff-save').addEventListener('click', () => {
    const title = document.getElementById('aff-title').value.trim();
    const groupId = document.getElementById('aff-group').value;
    if (!title) { toast(t('toast_give_title')); return; }
    aff.title = title;
    aff.groupId = groupId;
    aff.recording = currentRecording;
    aff.duration = currentDuration;
    if (!isEdit) state.affirmations.push(aff);
    saveState();
    overlay.remove();
    toast(isEdit ? t('toast_modified') : t('toast_created'));
    render();
  });

  if (isEdit) {
    document.getElementById('aff-delete').addEventListener('click', () => {
      if (confirm(t('confirm_delete_aff'))) {
        state.affirmations = state.affirmations.filter(a => a.id !== aff.id);
        saveState();
        overlay.remove();
        toast(t('toast_deleted'));
        render();
      }
    });
  }

  document.getElementById('aff-cancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

function formatDur(sec) {
  sec = Math.max(0, Math.round(sec));
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}

function exportData(withAudio) {
  const data = {
    groups: state.groups,
    affirmations: withAudio ? state.affirmations : state.affirmations.map(a => ({...a, recording: null})),
    settings: state.settings,
    stats: state.stats,
    version: 1,
    exportDate: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${t('backup_name')}${new Date().toISOString().slice(0,10)}${withAudio?'-full':''}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toast_exported'));
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm(t('confirm_import'))) return;
      if (data.groups) state.groups = data.groups;
      if (data.affirmations) state.affirmations = data.affirmations;
      if (data.settings) state.settings = Object.assign(defaultState().settings, data.settings);
      if (data.stats) state.stats = data.stats;
      saveState();
      applyTheme();
      applyLangTabs();
      toast(t('toast_imported'));
      render();
    } catch(err) { toast(t('toast_invalid_file')); }
  };
  reader.readAsText(file);
}

let toastTimeout;
function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (toastTimeout) clearTimeout(toastTimeout);
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimeout = setTimeout(() => el.remove(), 2500);
}

const ONBOARDING_STEPS = [
  { icon: '♥', titleKey: 'ob1_title', textKey: 'ob1_text' },
  { icon: '◈', titleKey: 'ob2_title', textKey: 'ob2_text' },
  { icon: '◉', titleKey: 'ob3_title', textKey: 'ob3_text' },
  { icon: '◇', titleKey: 'ob4_title', textKey: 'ob4_text' },
  { icon: '✦', titleKey: 'ob5_title', textKey: 'ob5_text' },
];

let obStep = 0;

function startOnboarding() {
  obStep = 0;
  renderOnboarding();
}

function renderOnboarding() {
  // remove existing
  document.getElementById('onboarding')?.remove();

  const step = ONBOARDING_STEPS[obStep];
  const isLast = obStep === ONBOARDING_STEPS.length - 1;

  const el = document.createElement('div');
  el.id = 'onboarding';
  el.className = 'onboarding-overlay';
  el.innerHTML = `
    <div class="ob-top">
      <div class="ob-step-indicator">${t('ob_step')} ${obStep+1} ${t('ob_of')} ${ONBOARDING_STEPS.length}</div>

    </div>
    <div class="ob-content">
      <div class="ob-visual">${step.icon}</div>
      <div class="ob-title">${t(step.titleKey)}</div>
      <div class="ob-text">${t(step.textKey)}</div>
    </div>
    <div class="ob-dots">
      ${ONBOARDING_STEPS.map((_, i) => `<div class="ob-dot ${i===obStep?'active':''}"></div>`).join('')}
    </div>
    <button class="ob-next-btn" id="ob-next">${isLast ? t('ob_start') : t('ob_next')} →</button>
  `;
  document.body.appendChild(el);

  document.getElementById('ob-skip').addEventListener('click', endOnboarding);
  document.getElementById('ob-next').addEventListener('click', () => {
    if (isLast) {
      endOnboarding();
      // ouvre direct l'onglet affirmations à la fin
      switchTab('list');
    } else {
      obStep++;
      renderOnboarding();
    }
  });
}

function endOnboarding() {
  state.onboardingDone = true;
  saveState();
  document.getElementById('onboarding')?.remove();
}

// BOOT
if (!state.settings.language) {
  state.settings.language = detectBrowserLang();
  saveState();
}
applyTheme();
applyLangTabs();
document.body.classList.add('player-active'); // player est l'onglet par défaut
render();
if (!state.onboardingDone) {
  startOnboarding();
}

function applyLangTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    const key = tab.dataset.tab;
    const label = tab.querySelector('.tab-label');
    if (label) {
      if (key === 'player') label.textContent = t('tab_player');
      else if (key === 'list') label.textContent = t('tab_list');
      else if (key === 'challenge') label.textContent = t('tab_challenge');
      else if (key === 'stats') label.textContent = t('tab_stats');
      else if (key === 'settings') label.textContent = t('tab_settings');
    }
  });
}
</script>
</body>
</html>
