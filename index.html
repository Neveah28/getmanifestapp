function exportData(withAudio) {
  const data = {
    groups: state.groups,
    affirmations: withAudio ? state.affirmations : state.affirmations.map(a => ({...a, recording: null})),
    settings: state.settings,
    stats: state.stats,
    version: 1,
    exportDate: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${t('backup_name')}${new Date().toISOString().slice(0,10)}${withAudio?'-full':''}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toast_exported'));
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm(t('confirm_import'))) return;
      if (data.groups) state.groups = data.groups;
      if (data.affirmations) state.affirmations = data.affirmations;
      if (data.settings) state.settings = Object.assign(defaultState().settings, data.settings);
      if (data.stats) state.stats = data.stats;
      saveState();
      applyTheme();
      applyLangTabs();
      toast(t('toast_imported'));
      render();
    } catch(err) { toast(t('toast_invalid_file')); }
  };
  reader.readAsText(file);
}

let toastTimeout;
function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (toastTimeout) clearTimeout(toastTimeout);
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimeout = setTimeout(() => el.remove(), 2500);
}

// ============================================================
// ONBOARDING
// ============================================================
const ONBOARDING_STEPS = [
  { icon: '♥', titleKey: 'ob1_title', textKey: 'ob1_text' },
  { icon: '◈', titleKey: 'ob2_title', textKey: 'ob2_text' },
  { icon: '◉', titleKey: 'ob3_title', textKey: 'ob3_text' },
  { icon: '◇', titleKey: 'ob4_title', textKey: 'ob4_text' },
  { icon: '✦', titleKey: 'ob5_title', textKey: 'ob5_text' },
];

let obStep = 0;

function startOnboarding() {
  obStep = 0;
  renderOnboarding();
}

function renderOnboarding() {
  const step = ONBOARDING_STEPS[obStep];
  const isLast = obStep === ONBOARDING_STEPS.length - 1;

  let el = document.getElementById('onboarding');
  const firstBuild = !el;

  if (firstBuild) {
    el = document.createElement('div');
    el.id = 'onboarding';
    el.className = 'onboarding-overlay';
    el.innerHTML = `
      <div class="ob-top">
        <div class="ob-step-indicator" id="ob-indicator"></div>
        <button class="ob-skip-btn" id="ob-skip">${t('ob_skip')}</button>
      </div>
      <div class="ob-content">
        <div class="ob-visual" id="ob-visual"></div>
        <div class="ob-title" id="ob-title"></div>
        <div class="ob-text" id="ob-text"></div>
      </div>
      <div class="ob-dots" id="ob-dots"></div>
      <button class="ob-next-btn" id="ob-next"></button>
    `;
    document.body.appendChild(el);

    document.getElementById('ob-skip').addEventListener('click', endOnboarding);
    document.getElementById('ob-next').addEventListener('click', () => {
      const isNowLast = obStep === ONBOARDING_STEPS.length - 1;
      if (isNowLast) {
        endOnboarding();
        switchTab('list');
      } else {
        obStep++;
        renderOnboarding();
      }
    });
  }

  // Update contents with fade transition
  const visualEl = document.getElementById('ob-visual');
  const titleEl = document.getElementById('ob-title');
  const textEl = document.getElementById('ob-text');
  const indicatorEl = document.getElementById('ob-indicator');
  const dotsEl = document.getElementById('ob-dots');
  const nextBtn = document.getElementById('ob-next');

  const applyContent = () => {
    visualEl.textContent = step.icon;
    titleEl.textContent = t(step.titleKey);
    textEl.textContent = t(step.textKey);
    indicatorEl.textContent = `${t('ob_step')} ${obStep+1} ${t('ob_of')} ${ONBOARDING_STEPS.length}`;
    dotsEl.innerHTML = ONBOARDING_STEPS.map((_, i) => `<div class="ob-dot ${i===obStep?'active':''}"></div>`).join('');
    nextBtn.textContent = (isLast ? t('ob_start') : t('ob_next')) + ' →';
  };

  if (firstBuild) {
    applyContent();
  } else {
    // Fade out puis fade in
    const content = el.querySelector('.ob-content');
    content.classList.add('ob-fading');
    setTimeout(() => {
      applyContent();
      content.classList.remove('ob-fading');
    }, 180);
  }
}

function endOnboarding() {
  state.onboardingDone = true;
  saveState();
  document.getElementById('onboarding')?.remove();
}

// BOOT
if (!state.settings.language) {
  state.settings.language = detectBrowserLang();
  saveState();
}
applyTheme();
applyLangTabs();
document.body.classList.add('player-active'); // player est l'onglet par défaut
render();
if (!state.onboardingDone) {
  startOnboarding();
}

function applyLangTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    const key = tab.dataset.tab;
    const label = tab.querySelector('.tab-label');
    if (label) {
      if (key === 'player') label.textContent = t('tab_player');
      else if (key === 'list') label.textContent = t('tab_list');
      else if (key === 'challenge') label.textContent = t('tab_challenge');
      else if (key === 'stats') label.textContent = t('tab_stats');
      else if (key === 'settings') label.textContent = t('tab_settings');
    }
  });
}
