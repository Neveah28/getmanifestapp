    saveState();
    if (playerState.playing) stopPlayback(false);
    playerState.lastSessionCount = 0;
    playerState.totalPlayed = 0;
    render();
  });
  document.getElementById('player-settings-btn').addEventListener('click', openPlayerSheet);
  document.getElementById('pause-btn')?.addEventListener('click', pausePlayback);
  document.getElementById('resume-btn')?.addEventListener('click', resumePlayback);
  document.getElementById('end-btn')?.addEventListener('click', endPlaybackSession);

  // Mode Nuit toggle
  document.getElementById('night-toggle')?.addEventListener('click', () => {
    state.settings.nightMode = !state.settings.nightMode;
    saveState();
    // Si on désactive pendant la lecture, retire aussi le timer
    if (!state.settings.nightMode) {
      clearNightTimer();
    } else if (playerState.playing) {
      // Si on active pendant la lecture, démarre le timer
      startNightTimer();
    }
    // Applique immédiatement l'effet audio
    applyNightMode(state.settings.nightMode);
    applyTheme();  // toggle la classe night-mode sur le body
    renderPlayer();
  });

  // Timer de nuit (chips 15/30/45/60)
  document.querySelectorAll('[data-night-timer]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mins = parseInt(btn.dataset.nightTimer, 10);
      state.settings.nightTimer = mins;
      saveState();
      // Si lecture en cours, relance le timer avec la nouvelle durée
      if (playerState.playing && state.settings.nightMode) {
        startNightTimer();
      }
      renderPlayer();
      toast(t('night_timer_set', { n: mins/60 }));
    });
  });
  document.getElementById('live-speed')?.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    state.settings.playbackRate = v;
    saveState();
    document.getElementById('live-speed-val').textContent = v.toFixed(2) + 'x';
    document.getElementById('aff-audio').playbackRate = v;
  });
}

function getAvailableAffs() {
  const s = state.settings;
  return state.affirmations.filter(a => {
    if (!a.recording) return false;
    if (s.selectedGroupId === 'all') return true;
    return a.groupId === s.selectedGroupId;
  });
}

function togglePlay() {
  if (playerState.playing) {
    pausePlayback();
  } else if (playerState.sessionStart) {
    resumePlayback();
  } else {
    startPlayback();
  }
}

function startPlayback() {
  const affs = getAvailableAffs();
  if (affs.length === 0) { toast(t('toast_no_recordings')); return; }
  playerState.queue = affs;
  if (playerState.currentIdx >= affs.length) playerState.currentIdx = 0;
  playerState.playing = true;
  playerState.paused = false;
  playerState.repeatPending = false;
  if (!playerState.sessionStart) {
    playerState.sessionStart = Date.now();
    playerState.totalPlayed = 0;
  }
  state.stats.sessionsCount++;
  saveState();
  startMusic();
  playNext();
  // Si mode nuit activé, démarre le timer d'auto-stop
  if (state.settings.nightMode) startNightTimer();
  renderPlayer();
}

function pausePlayback() {
  playerState.playing = false;
  playerState.paused = true;
  const audio = document.getElementById('aff-audio');
  audio.pause();
  if (playerState.pauseTimeout) { clearTimeout(playerState.pauseTimeout); playerState.pauseTimeout = null; }
  clearNightTimer();
  stopMusic();
  renderPlayer();
}

function resumePlayback() {
  playerState.playing = true;
  playerState.paused = false;
  startMusic();
  playNext();
  if (state.settings.nightMode) startNightTimer();
  renderPlayer();
}

function endPlaybackSession() {
  // Garde le compteur de la session comme "dernière session"
  playerState.lastSessionCount = playerState.totalPlayed || 0;
  playerState.totalPlayed = 0;
  playerState.playing = false;
  playerState.paused = false;
  playerState.sessionStart = null;
  playerState.currentIdx = 0;
  const audio = document.getElementById('aff-audio');
  audio.pause();
  audio.currentTime = 0;
  if (playerState.pauseTimeout) { clearTimeout(playerState.pauseTimeout); playerState.pauseTimeout = null; }
  clearNightTimer();
  stopMusic();
  renderPlayer();
}

// Alias pour compat avec changement de playlist
function stopPlayback(fully = true) {
  if (fully) {
    endPlaybackSession();
  } else {
    pausePlayback();
  }
}

// ============================================================
// NIGHT MODE : chaîne audio dreamy (low pass + 2 échos qui s'estompent)
// ============================================================
let playerAudioCtx = null;
let playerSource = null;
let playerLowpass = null;
let playerDryGain = null;
let playerDelay1 = null;
let playerDelay1Gain = null;
let playerDelay2 = null;
let playerDelay2Gain = null;
let playerFadeGain = null;
let nightTimerHandle = null;
let nightFadeHandle = null;

function ensurePlayerChain() {
  if (playerAudioCtx) return true;
  try {
    const audio = document.getElementById('aff-audio');
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    playerAudioCtx = new Ctx();
    playerSource = playerAudioCtx.createMediaElementSource(audio);

    // Gain master pour fade-out du timer de nuit
    playerFadeGain = playerAudioCtx.createGain();
    playerFadeGain.gain.value = 1;

    // Low pass : bypass par défaut (20kHz)
    playerLowpass = playerAudioCtx.createBiquadFilter();
    playerLowpass.type = 'lowpass';
    playerLowpass.frequency.value = 20000;
    playerLowpass.Q.value = 0.7;

    // Voix principale (dry)
    playerDryGain = playerAudioCtx.createGain();
    playerDryGain.gain.value = 1;

    // Écho 1 : court (250ms), avec feedback léger pour cascade douce
    playerDelay1 = playerAudioCtx.createDelay(2.0);
    playerDelay1.delayTime.value = 0.25;
    playerDelay1Gain = playerAudioCtx.createGain();
    playerDelay1Gain.gain.value = 0;
    // Low pass sur l'écho pour qu'il sonne chaleureux (pas crispy)
    const delay1Filter = playerAudioCtx.createBiquadFilter();
    delay1Filter.type = 'lowpass';
    delay1Filter.frequency.value = 2500;
    // Feedback : l'écho se nourrit lui-même pour cascader doucement
    const delay1Feedback = playerAudioCtx.createGain();
    delay1Feedback.gain.value = 0.35;

    // Écho 2 : plus long (550ms), très diffus
    playerDelay2 = playerAudioCtx.createDelay(2.0);
    playerDelay2.delayTime.value = 0.55;
    playerDelay2Gain = playerAudioCtx.createGain();
    playerDelay2Gain.gain.value = 0;
    const delay2Filter = playerAudioCtx.createBiquadFilter();
    delay2Filter.type = 'lowpass';
    delay2Filter.frequency.value = 2000;

    // Routing dry
    playerSource.connect(playerLowpass);
    playerLowpass.connect(playerDryGain);
    playerDryGain.connect(playerFadeGain);

    // Routing echo 1 avec feedback cascadant
    playerLowpass.connect(playerDelay1);
    playerDelay1.connect(delay1Filter);
    delay1Filter.connect(playerDelay1Gain);
    delay1Filter.connect(delay1Feedback);
    delay1Feedback.connect(playerDelay1); // boucle feedback
    playerDelay1Gain.connect(playerFadeGain);

    // Routing echo 2 (sans feedback, un seul tap diffus)
    playerLowpass.connect(playerDelay2);
    playerDelay2.connect(delay2Filter);
    delay2Filter.connect(playerDelay2Gain);
    playerDelay2Gain.connect(playerFadeGain);

    playerFadeGain.connect(playerAudioCtx.destination);
    return true;
  } catch(e) {
    console.warn('Night chain init failed', e);
    return false;
  }
}

function applyNightMode(enable) {
  if (!ensurePlayerChain()) return;
  const now = playerAudioCtx.currentTime;
  if (enable) {
    // Voix douce et chaleureuse + échos subtils qui s'étalent
    playerLowpass.frequency.linearRampToValueAtTime(3200, now + 0.5);
    playerDryGain.gain.linearRampToValueAtTime(0.75, now + 0.5);
    playerDelay1Gain.gain.linearRampToValueAtTime(0.22, now + 0.5);  // beaucoup moins fort
    playerDelay2Gain.gain.linearRampToValueAtTime(0.1, now + 0.5);   // juste une touche
  } else {
    playerLowpass.frequency.linearRampToValueAtTime(20000, now + 0.3);
    playerDryGain.gain.linearRampToValueAtTime(1, now + 0.3);
    playerDelay1Gain.gain.linearRampToValueAtTime(0, now + 0.3);
    playerDelay2Gain.gain.linearRampToValueAtTime(0, now + 0.3);
  }
}

function startNightTimer(ctx = 'player') {
  clearNightTimer();
  const minutes = cfgFor(ctx).nightTimer || 30;
  nightTimerHandle = setTimeout(() => {
    // Fade out progressif sur 15 sec, puis stop
    if (playerAudioCtx && playerFadeGain) {
      const now = playerAudioCtx.currentTime;
      playerFadeGain.gain.linearRampToValueAtTime(0, now + 15);
    }
    // Fade aussi la musique de fond (générative ou fichier)
    if (musicMasterGain && musicCtx) {
      const now = musicCtx.currentTime;
      musicMasterGain.gain.linearRampToValueAtTime(0, now + 15);
    }
    fadeOutMusicFile(15);
    nightFadeHandle = setTimeout(() => {
      // Stoppe le bon contexte selon qui a lancé le timer
      if (ctx === 'challenge') {
        if (state.challenge.playing) stopChallenge();
      } else {
        if (playerState.playing) stopPlayback(false);
      }
      // Restaure le gain pour la session suivante
      if (playerFadeGain && playerAudioCtx) {
        playerFadeGain.gain.value = 1;
      }
    }, 15500);
  }, minutes * 60 * 1000);
}

function clearNightTimer() {
  if (nightTimerHandle) { clearTimeout(nightTimerHandle); nightTimerHandle = null; }
  if (nightFadeHandle) { clearTimeout(nightFadeHandle); nightFadeHandle = null; }
  // Restaure le gain si on avait commencé le fade
  if (playerFadeGain && playerAudioCtx) {
    try {
      playerFadeGain.gain.cancelScheduledValues(playerAudioCtx.currentTime);
      playerFadeGain.gain.value = 1;
    } catch(e){}
  }
}

function playNext() {
  if (!playerState.playing) return;
  const audio = document.getElementById('aff-audio');
  const aff = playerState.queue[playerState.currentIdx];
  if (!aff) return;

  const npEl = document.getElementById('now-playing');
  if (npEl) npEl.textContent = aff.title;
  const stEl = document.getElementById('np-state');
  if (stEl) stEl.textContent = t('playing');

  // Mode silencieux : bip au lieu de la voix (côté Player)
  // Le bip reste court mais on attend la durée RÉELLE de l'aff (ajustée par la vitesse)
  // pour que le rythme corresponde à ce qu'on aurait eu avec la voix.
  if (state.settings.silentMode) {
    // Double bip SEULEMENT si plusieurs affs dans la queue ET nouvelle aff
    const isChange = (playerState.currentRepeat || 0) === 0 && (playerState.queue?.length || 0) > 1;
    playBeep(isChange, state.settings.affVolume);
    const affDuration = (aff.duration || 3) * 1000; // ms (fallback 3s)
    const rate = state.settings.playbackRate || 1;
    const waitMs = Math.max(400, affDuration / rate);
    setTimeout(() => {
      if (!playerState.playing) return;
      handlePlayNextEnd(aff);
    }, waitMs);
    return;
  }

  audio.src = aff.recording;
  audio.volume = state.settings.affVolume;
  audio.playbackRate = state.settings.playbackRate;
  // Appliquer le mode nuit si activé
  applyNightMode(state.settings.nightMode === true);
  audio.play().catch(e => { toast(t('toast_play_error')); stopPlayback(); });

  audio.onended = () => {
    if (!playerState.playing) return;
    handlePlayNextEnd(aff);
  };
}

// Extrait la logique de fin de lecture pour la partager entre audio et bip
function handlePlayNextEnd(aff) {
  if (!playerState.playing) return;

  playerState.totalPlayed++;

  // Track play stats pour l'affirmation qu'on vient de terminer
  trackPlay(aff);

  // Gestion des répétitions : chaque aff peut être répétée N fois de suite
  const repeatTarget = aff.repeatCount || 1;
  if (!playerState.currentRepeat) playerState.currentRepeat = 0;
  playerState.currentRepeat++;
  if (playerState.currentRepeat < repeatTarget) {
    // Rejouer la même aff (ne pas avancer l'index)
  } else {
    playerState.currentRepeat = 0;  // Reset pour la prochaine aff
    playerState.currentIdx++;
    if (playerState.currentIdx >= playerState.queue.length) {
      playerState.currentIdx = 0;
      playerState.loopCount++;
      trackLoop();
    }
  }

  saveState();
  const lc = document.getElementById('loop-counter');
  if (lc) lc.textContent = playerState.loopCount;
  const tc = document.getElementById('total-counter');
  if (tc) tc.textContent = playerState.totalPlayed;

  const stEl2 = document.getElementById('np-state');
  if (stEl2) stEl2.textContent = t('pause_wait', { s: state.settings.pauseBetween });
  playerState.pauseTimeout = setTimeout(() => {
    if (!playerState.playing) return;
    playNext();
  }, state.settings.pauseBetween * 1000);
}

// ============================================================
// AMBIANCES SONORES génératives
// ============================================================
let musicCtx = null;
let musicNodes = [];
let musicMasterGain = null;
let musicLFOs = [];

const AMBIANCES = {
  healing: { name: '🌸 Healing Touch', color: '#f0a0a8', file: 'audio/healing-touch.mp3' },
  clouds: { name: '☁️ From the Clouds', color: '#d4e5f0', file: 'audio/from-the-clouds.mp3' },
};

// Audio element pour les ambiances fichier (healing, clouds...)
let musicFileAudio = null;
let musicFileFadeInterval = null;

// activeAudioCtx = 'player' ou 'challenge' : indique quel contexte a lancé la musique en cours
let activeAudioCtx = 'player';

// Helper : récupère les paramètres audio du contexte (player ou challenge)
function cfgFor(ctx) {
  const s = state.settings;
  if (ctx === 'challenge') {
    return {
      affVolume: s.chAffVolume ?? s.affVolume,
      musicVolume: s.chMusicVolume ?? s.musicVolume,
      playbackRate: s.chPlaybackRate ?? s.playbackRate,
      pauseBetween: s.chPauseBetween ?? s.pauseBetween,
      musicMode: s.chMusicMode ?? s.musicMode,
      ambianceId: s.chAmbianceId ?? s.ambianceId,
      silentMode: s.chSilentMode ?? false,
      nightMode: s.chNightMode ?? false,
      nightTimer: s.chNightTimer ?? 60,
    };
  }
  return {
    affVolume: s.affVolume,
    musicVolume: s.musicVolume,
    playbackRate: s.playbackRate,
    pauseBetween: s.pauseBetween,
    musicMode: s.musicMode,
    ambianceId: s.ambianceId,
    silentMode: s.silentMode ?? false,
    nightMode: s.nightMode ?? false,
    nightTimer: s.nightTimer ?? 60,
  };
}

function startMusic(ctx = 'player') {
  activeAudioCtx = ctx;
  const c = cfgFor(ctx);
  if (c.musicMode === 'none') return;
  startAmbiance(c.ambianceId || 'healing', c.musicVolume);
}

function stopMusic() { stopAmbiance(); }

function startAmbiance(id, musicVol) {
  stopAmbiance();
  const amb = AMBIANCES[id] || AMBIANCES.healing;
  if (!amb || !amb.file) return;
  try {
    musicFileAudio = new Audio(amb.file);
    musicFileAudio.loop = true;
    const vol = (musicVol !== undefined) ? musicVol : state.settings.musicVolume;
    musicFileAudio.volume = vol * 0.5;
    musicFileAudio.play().catch(e => console.warn('music file play error', e));
  } catch(e) { console.warn('ambiance error', e); }
}

// === BIP (mode silencieux) ===
// Génère un bip court. Si isChange=true, double bip (indique changement d'aff)
// AudioContext global pour les bips : évite les pops/clicks qu'on avait en recréant/fermant
let beepCtx = null;
function playBeep(isChange, affVol) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!beepCtx) beepCtx = new Ctx();
    if (beepCtx.state === 'suspended') beepCtx.resume();
    const ctx = beepCtx;
    const baseVol = (affVol !== undefined) ? affVol : state.settings.affVolume;
    const vol = Math.max(0.001, baseVol * 0.25); // Jamais 0 brut
    const now = ctx.currentTime + 0.005; // Petit buffer pour éviter le clic au départ
    const makeBeep = (startAt, freq = 880) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startAt);
      // Enveloppe douce pour éliminer les clics : attack 25ms, sustain, release 50ms
      g.gain.setValueAtTime(0.0001, startAt);
      g.gain.exponentialRampToValueAtTime(vol, startAt + 0.025);
      g.gain.setValueAtTime(vol, startAt + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.19);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + 0.21);
      // Nettoyage automatique quand l'oscillateur termine
      osc.onended = () => { try { osc.disconnect(); g.disconnect(); } catch(e){} };
    };
    if (isChange) {
      makeBeep(now, 880);
      makeBeep(now + 0.24, 1100);
    } else {
      makeBeep(now, 880);
    }
    // Ne JAMAIS fermer beepCtx — ça causait les pops
  } catch(e) { console.warn('beep error', e); }
}

// Toast de félicitations à chaque palier (10K, 20K, 30K, 40K, 50K)
function celebrateMilestoneIfReached(oldCount, newCount) {
  const milestones = [10000, 20000, 30000, 40000, 50000];
  for (const m of milestones) {
    if (oldCount < m && newCount >= m) {
      toast(`👏 Bravo ! ${m.toLocaleString('fr-FR')} affirmations ✨`);
      break;  // Un seul milestone par incrément
    }
  }
}

// Enregistre la complétion d'un challenge dans les stats
function recordChallengeCompletion() {
  if (!state.stats.completedChallenges) state.stats.completedChallenges = [];
  // Snapshot des titres des affs pour garder l'info même si elles sont supprimées plus tard
  const affIds = [...(state.challenge.affirmationIds || [])];
  const affTitles = affIds.map(id => {
    const a = state.affirmations.find(x => x.id === id);
    return a ? a.title : '(supprimée)';
  });
  state.stats.completedChallenges.push({
    target: state.challenge.target,
    startedAt: state.challenge.startedAt,
    completedAt: Date.now(),
    affirmationIds: affIds,
    affirmationTitles: affTitles,  // Snapshot pour conservation à long terme
  });
  saveState();
}

function stopAmbiance() {
  // Stop le fichier audio s'il tourne
  if (musicFileAudio) {
    try { musicFileAudio.pause(); } catch(e){}
    musicFileAudio = null;
  }
  if (musicFileFadeInterval) {
    clearInterval(musicFileFadeInterval);
    musicFileFadeInterval = null;
  }

  // Stop la chaîne Web Audio générative
  musicLFOs.forEach(lfo => { try { lfo.stop(); } catch(e){} });
  musicLFOs = [];
  musicNodes.forEach(n => {
    try {
      if (n.gain) {
        n.gain.gain.setValueAtTime(n.gain.gain.value, musicCtx.currentTime);
        n.gain.gain.linearRampToValueAtTime(0, musicCtx.currentTime + 0.4);
      }
      if (n.osc) n.osc.stop(musicCtx.currentTime + 0.5);
      if (n.source) try { n.source.stop(musicCtx.currentTime + 0.5); } catch(e){}
    } catch(e){}
  });
  musicNodes = [];
  if (musicCtx) {
    const ctx = musicCtx;
    musicCtx = null;
    setTimeout(() => { try { ctx.close(); } catch(e){} }, 700);
  }
}

function updateMusicVolume() {
  // Prend le volume du contexte actif (player ou challenge)
  const vol = cfgFor(activeAudioCtx).musicVolume;
  if (musicMasterGain && musicCtx) {
    try { musicMasterGain.gain.value = vol * 0.4; } catch(e){}
  }
  if (musicFileAudio) {
    try { musicFileAudio.volume = vol * 0.5; } catch(e){}
  }
}

// Fade out progressif du fichier audio (pour le timer du mode nuit)
function fadeOutMusicFile(seconds) {
  if (!musicFileAudio) return;
  const startVol = musicFileAudio.volume;
  const steps = 60;
  const stepMs = (seconds * 1000) / steps;
  let i = 0;
  if (musicFileFadeInterval) clearInterval(musicFileFadeInterval);
  musicFileFadeInterval = setInterval(() => {
    i++;
    if (!musicFileAudio) { clearInterval(musicFileFadeInterval); return; }
    const t = i / steps;
    musicFileAudio.volume = Math.max(0, startVol * (1 - t));
    if (i >= steps) clearInterval(musicFileFadeInterval);
  }, stepMs);
}

// Alias pour compat
function updateDroneVolume() { updateMusicVolume(); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Met à jour l'ETA du challenge en live (sans re-render complet)
function updateChallengeEtaLive() {
  // Nouveau sélecteur en priorité (orb), fallback sur l'ancien
  const el = document.getElementById('ch-eta-top') || document.querySelector('.challenge-eta');
  if (!el) return;
  const c = state.challenge;
  const cfg = cfgFor('challenge');
  const selectedAffs = (c.affirmationIds || [])
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  const remaining = Math.max(0, c.target - c.count);
  el.innerHTML = estimateChallengeTime(selectedAffs, remaining, cfg.playbackRate, cfg.pauseBetween);
}

// Anime le titre de l'aff courante : fade out → changement → fade in avec glow
// Appelé quand une NOUVELLE aff démarre dans le Challenge
function animateCurrentAff(title) {
  const el = document.getElementById('orb-current-aff');
  if (!el) return;
  // Si c'est le même texte, on ne fait rien (évite les flashes inutiles)
  if (el.textContent.trim() === title.trim()) return;
  el.classList.remove('fade-in');
  el.classList.add('fade-out');
  setTimeout(() => {
    el.textContent = title;
    el.classList.remove('fade-out');
    // Force reflow pour relancer l'animation
    void el.offsetWidth;
    el.classList.add('fade-in');
    setTimeout(() => el.classList.remove('fade-in'), 1200);
  }, 350);
}

// Met à jour les éléments de l'orbe (compteur, pct, remaining, ring)
// Appelé après chaque tick (lecture ou ajout manuel) pour éviter un re-render complet
function updateChallengeOrbUI() {
  const c = state.challenge;
  const RING_R = 110;
  const RING_C = 2 * Math.PI * RING_R;
  const pct = Math.min(100, (c.count / c.target) * 100);
  const remaining = Math.max(0, c.target - c.count);

  const countEl = document.querySelector('.orb-count');
  if (countEl) countEl.textContent = c.count.toLocaleString('fr-FR');

  const pctEl = document.querySelector('.orb-pct');
  if (pctEl) pctEl.textContent = pct.toFixed(1) + '%';

  const remEl = document.querySelector('.orb-remaining');
  if (remEl) {
    remEl.innerHTML = `<strong>${remaining.toLocaleString('fr-FR')}</strong> ${t('challenge_remaining')}`;
  }

  const progEl = document.querySelector('.orb-progress');
  if (progEl) {
    const offset = RING_C * (1 - pct / 100);
    progEl.setAttribute('stroke-dashoffset', offset.toFixed(2));
  }
}

// Estime le temps restant du challenge basé sur la durée moyenne des affs,
// la vitesse de lecture et le temps de pause entre chaque
function estimateChallengeTime(selectedAffs, remaining, rate, pauseBetween) {
  if (remaining <= 0) return '🎉 Objectif atteint !';
  // Récupérer les durées valides
  const durations = selectedAffs.map(a => a.duration || 0).filter(d => d > 0);
  if (durations.length === 0) return '<em>Enregistre tes affs pour voir l\'estimation</em>';
  const avgDuration = durations.reduce((a, b) => a + b, 0) / durations.length;
  // Temps pour UN cycle d'affirmation (lecture + pause)
  const secPerAff = (avgDuration / (rate || 1)) + (pauseBetween || 0);
  const totalSec = secPerAff * remaining;

  // Formater en jours/heures/minutes
  let label;
  if (totalSec < 60) {
    label = `${Math.round(totalSec)}s`;
  } else if (totalSec < 3600) {
    label = `${Math.round(totalSec / 60)} min`;
  } else if (totalSec < 86400) {
    const h = Math.floor(totalSec / 3600);
    const m = Math.round((totalSec % 3600) / 60);
    label = m > 0 ? `${h}h ${m}min` : `${h}h`;
  } else {
    const d = Math.floor(totalSec / 86400);
    const h = Math.round((totalSec % 86400) / 3600);
    label = h > 0 ? `${d}j ${h}h` : `${d}j`;
  }
  return `⏱️ Encore ~<strong>${label}</strong> de lecture à ${rate.toFixed(2)}x`;
}

function formatChallengeDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const lang = state.settings.language || 'fr';
  const months = {
    fr: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'],
    en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  };
  const ms = months[lang] || months.fr;
  return `${d.getDate()} ${ms[d.getMonth()]} ${d.getFullYear()}`;
}

function trackPlay(aff) {
  if (!aff) return;
  const key = todayKey();
  const s = state.stats;

  // byDay
  if (!s.byDay[key]) s.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
  s.byDay[key].plays++;
  s.byDay[key].seconds += Math.round(aff.duration || 0);

  // byAffirmation
  if (!s.byAffirmation[aff.id]) s.byAffirmation[aff.id] = { plays: 0, lastPlayed: 0 };
  s.byAffirmation[aff.id].plays++;
  s.byAffirmation[aff.id].lastPlayed = Date.now();

  // byPlaylist
  if (aff.groupId) {
    if (!s.byPlaylist[aff.groupId]) s.byPlaylist[aff.groupId] = { plays: 0 };
    s.byPlaylist[aff.groupId].plays++;
  }

  // globals
  s.totalPlays++;
  s.totalSeconds += Math.round(aff.duration || 0);

  // best day
  if (s.byDay[key].plays > s.bestDay.plays) {
    s.bestDay = { date: key, plays: s.byDay[key].plays };
  }

  // streak
  updateStreak();

  saveState();
}

function trackLoop() {
  const key = todayKey();
  if (!state.stats.byDay[key]) state.stats.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
  state.stats.byDay[key].loops++;
  state.stats.totalLoops++;
  saveState();
}

function updateStreak() {
  const s = state.stats;
  const today = todayKey();
  if (s.lastActiveDay === today) return; // déjà compté aujourd'hui

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  if (s.lastActiveDay === yKey) {
    s.streak++;
  } else if (!s.lastActiveDay) {
    s.streak = 1;
  } else {
    s.streak = 1; // reset
  }
  s.lastActiveDay = today;
}

function timeAgo(ts) {
  if (!ts) return t('stats_never_played');
  const now = Date.now();
  const diff = Math.floor((now - ts) / 1000);
  if (diff < 60) return t('stats_just_now');
  if (diff < 3600) return t('stats_mins_ago', { n: Math.floor(diff/60) });
  if (diff < 86400) return t('stats_hours_ago', { n: Math.floor(diff/3600) });
  const days = Math.floor(diff/86400);
  if (days === 0) return t('stats_today_short');
  return t('stats_days_ago', { n: days });
}

  const audio = document.getElementById('aff-audio');
  audio.src = aff.recording;
  audio.volume = state.settings.affVolume;
  audio.playbackRate = state.settings.playbackRate;

function renderChallenge() {
  const c = state.challenge;
  const s = state.settings;
  const chCfg = cfgFor('challenge');  // Paramètres du Challenge (indépendants du Player)
  const selectedAffs = (c.affirmationIds || [])
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  // Mode édition : clic crayon → affiche la liste même si on a déjà une sélection
  const editing = window.editingChallengeSelection === true;
  const hasSelection = selectedAffs.length > 0 && !editing;
  const pct = Math.min(100, (c.count / c.target) * 100);
  const remaining = Math.max(0, c.target - c.count);
  const available = state.affirmations.filter(a => a.recording);
  const TARGET_CHOICES = [10000, 20000, 30000, 40000, 50000];
  // IDs déjà sélectionnés (pour pré-cocher en mode édition)
  const preCheckedIds = new Set(c.affirmationIds || []);

  const pageEl = document.getElementById('page-challenge');
  pageEl.classList.toggle('ch-selected', hasSelection);
  pageEl.innerHTML = `
    ${hasSelection ? '' : `<p class="sublabel" style="margin-bottom:14px; max-width: 440px">${t('challenge_desc')}</p>`}

    <!-- SÉLECTION DES AFFIRMATIONS (seulement en mode édition ou pas de sélection) -->
    ${!hasSelection ? `
      <div class="challenge-aff-card">
        ${available.length > 0 ? `
          <div class="h3" style="margin-top:0">${t('challenge_select_prompt')}</div>
          <div class="aff-check-list">
            ${available.map(a => `
              <label class="aff-check-item">
                <input type="checkbox" class="aff-check" value="${a.id}" ${preCheckedIds.has(a.id) ? 'checked' : ''} />
                <span class="aff-check-name">${escapeHtml(a.title)}</span>
              </label>
            `).join('')}
          </div>
          <div class="sublabel" style="margin-top:8px; font-size: 11px">${t('challenge_max_affs')}</div>
          <button class="btn-primary" id="ch-confirm-affs" disabled style="margin-top:12px; opacity: 0.5">${editing ? 'Modifier' : t('ch_use_this')}</button>
          <div class="challenge-divider"><span>${t('challenge_or')}</span></div>
        ` : ''}

        <div class="h3" style="margin-top: ${available.length > 0 ? '16px' : '0'}">${t('challenge_record_new')}</div>
        <input type="text" class="input-text" id="ch-new-title" placeholder="${t('ch_title_placeholder')}" style="margin-bottom: 12px" />
        <div class="rec-wrapper" style="padding: 10px 0">
          <div class="rec-timer" id="ch-rec-timer">${formatDur(0)}</div>
          <button class="rec-btn" id="ch-rec-btn">●</button>
          <p class="sublabel" style="margin-top: 10px" id="ch-rec-hint">${t('ch_rec_hint')}</p>
          <div id="ch-rec-playback" style="display:none; margin-top:10px">
            <button class="playback-btn" id="ch-rec-play">${t('listen')}</button>
            <button class="playback-btn" id="ch-rec-redo" style="color: var(--danger)">${t('ch_redo')}</button>
          </div>
        </div>
        <button class="btn-primary" id="ch-create" disabled style="margin-top: 10px; opacity: 0.5">${t('ch_use_this')}</button>
      </div>
    ` : ''}

    ${hasSelection ? (() => {
      // === Design orbe (lune) avec progression circulaire ===
      const RING_R = 110;
      const RING_C = 2 * Math.PI * RING_R;
      const ringOffset = RING_C * (1 - Math.min(100, pct) / 100);
      const playIconSvg = c.playing
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg>';
      // L'aff courante dans la rotation
      const curIdx = (c.currentIdx || 0) % selectedAffs.length;
      const currentAff = selectedAffs[curIdx] || selectedAffs[0];
      return `
        <div class="challenge-orb-wrap">
          <!-- HAUT : aff en cours (glow fade à chaque changement) -->
          <div class="ch-top">
            <div class="orb-current-aff ${c.playing ? 'glowing' : ''}" id="orb-current-aff">
              ${escapeHtml(currentAff ? currentAff.title : '')}
            </div>
          </div>

          <!-- CENTRE : orbe (centrée verticalement par flex) -->
          <div class="ch-middle">
            <button type="button" class="challenge-orb ${c.playing ? 'playing' : ''}" id="ch-toggle"
                    aria-label="${c.playing ? t('challenge_pause') : (c.count === 0 ? t('challenge_start') : t('challenge_resume'))}">
              <svg class="orb-ring" viewBox="0 0 240 240">
                <defs>
                  <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="var(--accent)" />
                    <stop offset="100%" stop-color="var(--accent-light, var(--accent))" />
                  </linearGradient>
                </defs>
                <circle class="orb-track" cx="120" cy="120" r="${RING_R}" fill="none" />
                <circle class="orb-progress" cx="120" cy="120" r="${RING_R}" fill="none"
                        stroke="url(#orbGrad)"
                        stroke-dasharray="${RING_C.toFixed(2)}"
                        stroke-dashoffset="${ringOffset.toFixed(2)}"
                        transform="rotate(-90 120 120)" />
              </svg>
              <div class="orb-content">
                <div class="orb-count">${c.count.toLocaleString('fr-FR')}</div>
                <div class="orb-target">/ ${c.target.toLocaleString('fr-FR')}</div>
                <div class="orb-play-icon">${playIconSvg}</div>
                <div class="orb-pct">${pct.toFixed(1)}%</div>
              </div>
            </button>
          </div>

          <!-- BAS : meta line + ETA/slider (quand play) + ajout manuel -->
          <div class="ch-bottom">
            <div class="orb-meta-line">
              <strong>${remaining.toLocaleString('fr-FR')}</strong> ${t('challenge_remaining')}${c.startedAt ? ` · <em>${t('challenge_started_on', { d: formatChallengeDate(c.startedAt) })}</em>` : ''}
              <button class="ch-edit-affs-mini" id="ch-change-aff" aria-label="Modifier la sélection" title="Modifier">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
              </button>
            </div>

            ${c.playing ? `
              <div class="challenge-eta-top" id="ch-eta-top">
                ${estimateChallengeTime(selectedAffs, remaining, chCfg.playbackRate, chCfg.pauseBetween)}
              </div>
              <div class="live-speed" style="width:100%; max-width: 320px">
                <div class="live-speed-label">
                  <span>${t('play_speed')}</span>
                  <span class="live-speed-val" id="ch-live-speed-val">${chCfg.playbackRate.toFixed(2)}x</span>
                </div>
                <input type="range" id="ch-live-speed" min="0.5" max="3" step="0.05" value="${chCfg.playbackRate}" />
              </div>
            ` : ''}

            <div class="manual-add-wrap" style="width:100%; max-width: 360px">
              <div class="manual-add-label">✋ ${t('challenge_manual_add')}</div>
              <div class="manual-add-row">
                <button class="manual-add-btn" data-add="1">+1</button>
                <button class="manual-add-btn" data-add="10">+10</button>
                <button class="manual-add-btn" data-add="50">+50</button>
                <button class="manual-add-btn" data-add="100">+100</button>
                <input type="number" id="ch-manual-input" placeholder="n" min="1" max="10000" />
                <button class="manual-add-go" id="ch-manual-go">+</button>
              </div>
            </div>
          </div>
        </div>
      `;
    })() : ''}

    ${hasSelection ? `
      <button class="ch-settings-mini" id="ch-settings-btn" aria-label="${t('challenge_sheet_title')}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    ` : ''}
  `;

  // ====== HANDLERS ======

  // Sélection multiple des affirmations (max 4)
  const checkboxes = document.querySelectorAll('.aff-check');
  const confirmBtn = document.getElementById('ch-confirm-affs');
  const updateConfirmBtn = () => {
    const checked = Array.from(checkboxes).filter(c => c.checked);
    if (!confirmBtn) return;
    if (checked.length > 0 && checked.length <= 4) {
      confirmBtn.disabled = false;
      confirmBtn.style.opacity = '1';
    } else {
      confirmBtn.disabled = true;
      confirmBtn.style.opacity = '0.5';
    }
  };
  checkboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      const checkedCount = Array.from(checkboxes).filter(c => c.checked).length;
      // Bloque à 4 max
      if (checkedCount > 4) {
        cb.checked = false;
        toast(t('challenge_max_affs'));
      }
      updateConfirmBtn();
    });
  });

  // Au chargement : si on est en mode édition et des cases sont déjà pré-cochées,
  // activer le bouton confirmer immédiatement
  updateConfirmBtn();

  // Confirmer la sélection multiple
  // On NE reset PAS le count (préserve la progression). Pour reset : bouton "Reset le challenge"
  confirmBtn?.addEventListener('click', () => {
    const picked = Array.from(checkboxes).filter(c => c.checked).map(c => c.value);
    if (picked.length === 0) return;
    const wasEmpty = (state.challenge.affirmationIds || []).length === 0;
    state.challenge.affirmationIds = picked;
    state.challenge.currentIdx = 0;
    // Only set startedAt if the challenge has never been started
    if (wasEmpty || !state.challenge.startedAt) {
      state.challenge.startedAt = Date.now();
    }
    // Sortir du mode édition
    window.editingChallengeSelection = false;
    saveState();
    toast('Sélection enregistrée ✓');
    render();
  });

  // Clic sur crayon ✏️ : passe en mode édition SANS vider la sélection (les cases restent cochées)
  document.getElementById('ch-change-aff')?.addEventListener('click', () => {
    // Stop playback si en cours (le user va modifier la queue)
    if (state.challenge.playing) {
      state.challenge.playing = false;
      if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
      if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
      stopMusic();
    }
    window.editingChallengeSelection = true;
    render();
  });

  document.getElementById('ch-toggle')?.addEventListener('click', toggleChallenge);
  document.getElementById('ch-settings-btn')?.addEventListener('click', openChallengeSheet);
  // Reset du compteur : utilise un toast de confirmation (confirm() natif ne marche pas en PWA)
  let resetPending = false;
  document.getElementById('ch-reset')?.addEventListener('click', (ev) => {
    if (!resetPending) {
      resetPending = true;
      ev.target.textContent = '⚠️ Confirmer reset ?';
      toast('Tape à nouveau pour confirmer');
      setTimeout(() => {
        resetPending = false;
        const btn = document.getElementById('ch-reset');
        if (btn) btn.textContent = t('challenge_reset');
      }, 3000);
      return;
    }
    // Confirmé : reset
    if (state.challenge.playing) {
      state.challenge.playing = false;
      if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
      if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
      stopMusic();
    }
    state.challenge.count = 0;
    state.challenge.currentIdx = 0;
    saveState();
    toast('Compteur reset à 0 ✓');
    render();
  });

  // Ajout manuel (compteur à main) : compte dans le challenge + stats globales
  const addToCount = (n) => {
    if (!n || n < 1) return;
    const oldCount = state.challenge.count;
    state.challenge.count = Math.min(state.challenge.target, state.challenge.count + n);
    const newCount = state.challenge.count;

    // === Track dans les stats globales ===
    const key = todayKey();
    if (!state.stats.byDay[key]) state.stats.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
    state.stats.byDay[key].plays += n;
    state.stats.totalPlays += n;
    if (state.stats.byDay[key].plays > (state.stats.bestDay?.plays || 0)) {
      state.stats.bestDay = { date: key, plays: state.stats.byDay[key].plays };
    }
    updateStreak();

    // Répartir équitablement sur les affs sélectionnées pour les stats détaillées
    const selectedIds = state.challenge.affirmationIds || [];
    if (selectedIds.length > 0) {
      const perAff = Math.floor(n / selectedIds.length);
      const remainder = n - perAff * selectedIds.length;
      selectedIds.forEach((id, idx) => {
        const add = perAff + (idx === 0 ? remainder : 0);
        if (add === 0) return;
        if (!state.stats.byAffirmation[id]) state.stats.byAffirmation[id] = { plays: 0, lastPlayed: 0 };
        state.stats.byAffirmation[id].plays += add;
        state.stats.byAffirmation[id].lastPlayed = Date.now();
        const aff = state.affirmations.find(a => a.id === id);
        if (aff && aff.groupId) {
          if (!state.stats.byPlaylist[aff.groupId]) state.stats.byPlaylist[aff.groupId] = { plays: 0 };
          state.stats.byPlaylist[aff.groupId].plays += add;
        }
      });
    }

    saveState();
    toast(t('challenge_added', { n: n }));
    // Toasts "Bravo" à chaque palier atteint (10K, 20K, 30K...)
    celebrateMilestoneIfReached(oldCount, newCount);
    if (state.challenge.count >= state.challenge.target) {
      recordChallengeCompletion();
      stopChallenge();
      toast(t('challenge_done'));
    }
    render();
  };
  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => addToCount(parseInt(btn.dataset.add, 10)));
  });
  document.getElementById('ch-manual-go')?.addEventListener('click', () => {
    const input = document.getElementById('ch-manual-input');
    const n = parseInt(input.value, 10);
    if (isNaN(n) || n < 1) return;
    input.value = '';
    addToCount(n);
  });

  // Live speed slider pendant lecture (modifie uniquement la vitesse CHALLENGE)
  document.getElementById('ch-live-speed')?.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    state.settings.chPlaybackRate = v;
    saveState();
    document.getElementById('ch-live-speed-val').textContent = v.toFixed(2) + 'x';
    document.getElementById('aff-audio').playbackRate = v;
    updateChallengeEtaLive();  // Recalcule l'ETA en temps réel
  });

  // Enregistrement direct dans l'onglet 10K
  if (!aff) {
    setupChallengeRecorder();
  }
}

// Enregistrement intégré dans l'onglet 10K
let chRecorder = { mediaRecorder: null, chunks: [], startTime: 0, interval: null, recording: null, duration: 0 };

// ============================================================
// AUDIO RECORDING - avec filtres bruits + embellissement voix
// ============================================================
// Choisit le meilleur format audio supporté par le device, haute qualité
function getBestRecorderOptions() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus',
  ];
  for (const type of candidates) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
      return { mimeType: type, audioBitsPerSecond: 128000 };
    }
  }
  return { audioBitsPerSecond: 128000 };
}

async function getProcessedMicStream() {
  // Approche minimale : on fait confiance aux filtres natifs du navigateur
  // (annulation echo + bruit + auto-gain). PAS de traitement supplémentaire.
  // Résultat : voix naturelle, propre, sans artefacts.
  const rawStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
      sampleRate: 48000,
      channelCount: 1,
    }
  });

  const cleanup = () => rawStream.getTracks().forEach(t => t.stop());
  return { stream: rawStream, cleanup, analyser: null };
}

// Fonction de test micro avec visualisation du niveau
async function testMic(canvas) {
  const rawStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioContextClass();
  const source = ctx.createMediaStreamSource(rawStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);

  const canvasCtx = canvas.getContext('2d');
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  let running = true;

  function draw() {
    if (!running) return;
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);
    const w = canvas.width;
    const h = canvas.height;
    canvasCtx.clearRect(0, 0, w, h);

    const bars = 24;
    const barW = w / bars - 3;
    for (let i = 0; i < bars; i++) {
      const idx = Math.floor((i / bars) * bufferLength * 0.6);
      const v = dataArray[idx] / 255;
      const barH = v * h * 0.95;
      // dégradé rose gold
      const t = i / bars;
      const r = Math.round(0xf5 + (0xe4 - 0xf5) * t);
      const g = Math.round(0xb5 + (0x78 - 0xb5) * t);
      const b = Math.round(0x93 + (0xa0 - 0x93) * t);
      canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
      canvasCtx.fillRect(i * (w / bars) + 1.5, h - barH, barW, barH);
    }
  }
  draw();

  return () => {
    running = false;
    try { source.disconnect(); } catch(e){}
    try { ctx.close(); } catch(e){}
    rawStream.getTracks().forEach(t => t.stop());
  };
}

function setupChallengeRecorder() {
  const recBtn = document.getElementById('ch-rec-btn');
  const timer = document.getElementById('ch-rec-timer');
  const hint = document.getElementById('ch-rec-hint');
  const playback = document.getElementById('ch-rec-playback');
  const createBtn = document.getElementById('ch-create');
  const titleInput = document.getElementById('ch-new-title');

  if (!recBtn) return;

  const updateCreateBtn = () => {
    const hasTitle = titleInput.value.trim().length > 0;
    const hasRec = !!chRecorder.recording;
    if (hasTitle && hasRec) {
      createBtn.disabled = false;
      createBtn.style.opacity = '1';
    } else {
      createBtn.disabled = true;
      createBtn.style.opacity = '0.5';
    }
  };

  titleInput.addEventListener('input', updateCreateBtn);

  recBtn.addEventListener('click', async () => {
    if (chRecorder.mediaRecorder && chRecorder.mediaRecorder.state === 'recording') {
      chRecorder.mediaRecorder.stop();
      recBtn.classList.remove('recording');
      recBtn.textContent = '●';
      clearInterval(chRecorder.interval);
    } else {
      try {
        const { stream, cleanup } = await getProcessedMicStream();
        chRecorder.chunks = [];
        chRecorder.mediaRecorder = new MediaRecorder(stream, getBestRecorderOptions());
        chRecorder._cleanup = cleanup;
        chRecorder.mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chRecorder.chunks.push(e.data); };
        chRecorder.mediaRecorder.onstop = () => {
          cleanup();
          const blob = new Blob(chRecorder.chunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = () => {
            chRecorder.recording = reader.result;
            chRecorder.duration = (Date.now() - chRecorder.startTime) / 1000;
            timer.textContent = formatDur(chRecorder.duration);
            hint.textContent = t('rec_exists');
            playback.style.display = 'block';
            updateCreateBtn();
          };
          reader.readAsDataURL(blob);
        };
        chRecorder.mediaRecorder.start();
        chRecorder.startTime = Date.now();
        recBtn.classList.add('recording');
        recBtn.textContent = '■';
        chRecorder.interval = setInterval(() => {
          timer.textContent = formatDur((Date.now() - chRecorder.startTime) / 1000);
        }, 100);
      } catch(e) { toast(t('toast_mic_error')); }
    }
  });

  document.getElementById('ch-rec-play')?.addEventListener('click', () => {
    // Preview via un audio dédié à vitesse 1x (évite d'entendre à x3 si le challenge est à x3)
    const preview = new Audio(chRecorder.recording);
    preview.volume = state.settings.affVolume;
    preview.playbackRate = 1.0;
    preview.play().catch(() => toast(t('toast_play_error')));
  });

  document.getElementById('ch-rec-redo')?.addEventListener('click', () => {
    chRecorder.recording = null;
    chRecorder.duration = 0;
    timer.textContent = formatDur(0);
    hint.textContent = t('ch_rec_hint');
    playback.style.display = 'none';
    updateCreateBtn();
  });

  createBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    if (!title || !chRecorder.recording) return;

    // Trouver un groupe par défaut (le premier)
    let groupId = state.groups[0]?.id;
    if (!groupId) {
      // Créer un groupe si aucun
      const newG = { id: uid(), name: state.settings.language === 'en' ? 'My affirmations' : 'Mes affirmations' };
      state.groups.push(newG);
      groupId = newG.id;
    }

    const newAff = {
      id: uid(),
      title,
      groupId,
      recording: chRecorder.recording,
      duration: chRecorder.duration,
    };
    state.affirmations.push(newAff);

    // Reset du recorder
    chRecorder = { mediaRecorder: null, chunks: [], startTime: 0, interval: null, recording: null, duration: 0 };

    // Set comme affirmation du challenge
    state.challenge.affirmationId = newAff.id;
    state.challenge.count = 0;
    state.challenge.startedAt = Date.now();
    saveState();

    toast(t('toast_created'));
    render();
  });
}

function toggleChallenge() {
  if (state.challenge.playing) {
    stopChallenge();
  } else {
    startChallenge();
  }
}

function startChallenge() {
  const ids = state.challenge.affirmationIds || [];
  const validAffs = ids
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  if (validAffs.length === 0) { toast(t('toast_no_recordings')); return; }
  state.challenge.playing = true;
  if (!state.challenge.startedAt) state.challenge.startedAt = Date.now();
  if (typeof state.challenge.currentIdx !== 'number' || state.challenge.currentIdx >= validAffs.length) {
    state.challenge.currentIdx = 0;
  }
  saveState();
  startMusic('challenge');
  playChallenge();
  render();
  toast(t('challenge_started'));
}

function stopChallenge() {
  state.challenge.playing = false;
  if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
  if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
  clearNightTimer();
  stopMusic();
  saveState();
  render();
}

function playChallenge() {
  if (!state.challenge.playing) return;
  // Récupère la liste des affirmations valides dans l'ordre de la sélection
  const ids = state.challenge.affirmationIds || [];
  const validAffs = ids
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  if (validAffs.length === 0) { stopChallenge(); return; }

  // L'affirmation courante selon currentIdx
  const idx = state.challenge.currentIdx % validAffs.length;
  const aff = validAffs[idx];

  // Animation glow fade quand on commence une NOUVELLE aff (pas une répétition)
  // On s'appuie sur currentRepeat === 0 : chaque passage par 0 marque une nouvelle aff
  if ((state.challenge.currentRepeat || 0) === 0) {
    animateCurrentAff(aff.title);
  }

  const cfg = cfgFor('challenge');

  // Mode silencieux : bip au lieu de la voix
  // Le bip reste court mais on attend la durée RÉELLE de l'aff (ajustée par la vitesse)
  if (cfg.silentMode) {
    // Double bip SEULEMENT s'il y a plusieurs affs ET qu'on passe à une nouvelle
    const isChange = (state.challenge.currentRepeat || 0) === 0 && validAffs.length > 1;
    playBeep(isChange, cfg.affVolume);
    challengeAudio = null;
    const affDuration = (aff.duration || 3) * 1000;
    const rate = cfg.playbackRate || 1;
    const waitMs = Math.max(400, affDuration / rate);
    challengeTimeout = setTimeout(() => {
      if (!state.challenge.playing) return;
      handleChallengeEnd(aff, validAffs);
    }, waitMs);
    return;
  }

  const audio = document.getElementById('aff-audio');
  audio.src = aff.recording;
  audio.volume = cfg.affVolume;
  audio.playbackRate = cfg.playbackRate;
  // Pas de mode nuit sur le Challenge (voix normale, pas d'EQ)
  applyNightMode(false);
  audio.play().catch(() => { toast(t('toast_play_error')); stopChallenge(); });
  challengeAudio = audio;

  audio.onended = () => {
    if (!state.challenge.playing) return;
    handleChallengeEnd(aff, validAffs);
  };
}

// Extrait la logique fin lecture challenge pour partager entre audio + bip
function handleChallengeEnd(aff, validAffs) {
  if (!state.challenge.playing) return;

  const cfg = cfgFor('challenge');
  const oldCount = state.challenge.count;
  state.challenge.count++;
  const newCount = state.challenge.count;

  // Gestion des répétitions : chaque aff peut être répétée N fois de suite
  const repeatTarget = aff.repeatCount || 1;
  if (!state.challenge.currentRepeat) state.challenge.currentRepeat = 0;
  state.challenge.currentRepeat++;
  if (state.challenge.currentRepeat < repeatTarget) {
    // Rejouer la même aff
  } else {
    state.challenge.currentRepeat = 0;
    state.challenge.currentIdx = (state.challenge.currentIdx + 1) % validAffs.length;
  }
  trackPlay(aff);
  saveState();

  // Toasts "Bravo" à chaque palier atteint
  celebrateMilestoneIfReached(oldCount, newCount);

  // Update UI (nouveau orb)
  updateChallengeOrbUI();
  updateChallengeEtaLive();

  if (state.challenge.count >= state.challenge.target) {
    recordChallengeCompletion();
    stopChallenge();
    toast(t('challenge_done'));
    return;
  }

  challengeTimeout = setTimeout(() => {
    if (!state.challenge.playing) return;
    playChallenge();
  }, cfg.pauseBetween * 1000);
}

function openAffModal(existing, defaultGroupId) {
  const isEdit = !!existing;
  const initialGroup = defaultGroupId || (existing && existing.groupId) || state.groups[0].id;
  const aff = existing || { id: uid(), title: '', groupId: initialGroup, recording: null, duration: 0 };

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.innerHTML = `

      <div class="h3">${t('voice_recording')}</div>

        </div>
      </div>

      <div class="h3">Répétitions à la suite</div>
      <div class="sublabel" style="margin-bottom:10px; font-size:12px">Combien de fois cette aff est lue avant de passer à la suivante</div>
      <div class="repeat-chips">
        ${[1, 3, 5, 10, 20, 50].map(n => `
          <button class="repeat-chip ${(aff.repeatCount||1)===n?'active':''}" data-repeat="${n}">${n}×</button>
        `).join('')}
      </div>

      <button class="btn-primary" id="aff-save" style="margin-top:18px">${isEdit ? t('save') : t('create')}</button>
      ${isEdit ? `<button class="btn-secondary danger" id="aff-delete">${t('delete')}</button>` : ''}
      <button class="btn-secondary" id="aff-cancel">${t('cancel')}</button>
    </div>
  `;
  document.body.appendChild(overlay);

  let currentRecording = aff.recording;
  let currentDuration = aff.duration;
  let mediaRecorder = null;
  let recChunks = [];
  let recStartTime = 0;
  let recTimerInterval = null;

  const recBtn = document.getElementById('rec-btn');
  const recTimer = document.getElementById('rec-timer');

  recBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recBtn.classList.remove('recording');
      recBtn.textContent = '●';
      clearInterval(recTimerInterval);
    } else {
      try {
        const { stream, cleanup } = await getProcessedMicStream();
        recChunks = [];
        mediaRecorder = new MediaRecorder(stream, getBestRecorderOptions());
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          cleanup();
          const blob = new Blob(recChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = () => {
            currentRecording = reader.result;
            currentDuration = (Date.now() - recStartTime) / 1000;
            recTimer.textContent = formatDur(currentDuration);
            toast(t('toast_recorded'));
            refreshRecButtons();
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        recStartTime = Date.now();
        recBtn.classList.add('recording');
        recBtn.textContent = '■';
        recTimerInterval = setInterval(() => {
          recTimer.textContent = formatDur((Date.now() - recStartTime) / 1000);
        }, 100);
      } catch(e) { toast(t('toast_mic_error')); }
    }
  });

    // Preview playback via un audio element dédié (évite la chaîne Mode Nuit du player principal)
  // Vitesse TOUJOURS 1x pour entendre ta vraie voix, peu importe la vitesse du Player/Challenge
  let previewAudio = null;
  function playPreview() {
    if (!currentRecording) return;
    if (previewAudio) { try { previewAudio.pause(); } catch(e){} }
    previewAudio = new Audio(currentRecording);
    previewAudio.volume = state.settings.affVolume;
    previewAudio.playbackRate = 1.0;  // Toujours à vitesse normale pour la preview
    previewAudio.play().catch(() => toast(t('toast_play_error')));
  }

  function refreshRecButtons() {
    const wrap = document.getElementById('rec-playback-wrap');
    const hint = document.getElementById('rec-hint');
    if (!wrap) return;
    if (currentRecording) {
      wrap.style.display = 'flex';
      if (hint) hint.textContent = t('rec_exists');
    } else {
      wrap.style.display = 'none';
      if (hint) hint.textContent = t('rec_tap');
    }
  }

  document.getElementById('rec-play')?.addEventListener('click', playPreview);
  document.getElementById('rec-delete')?.addEventListener('click', () => {
    if (confirm(t('confirm_erase_rec'))) {
      currentRecording = null;
      currentDuration = 0;
      recTimer.textContent = formatDur(0);
      refreshRecButtons();
    }
  });

  // Fonction appelée après chaque nouvel enregistrement (handlers déjà attachés plus haut)
  // On s'assure que les handlers sont bien là sur rec-play / rec-delete en les ré-attachant
  function reattachPlaybackHandlers() {
    const playBtn = document.getElementById('rec-play');
    const delBtn = document.getElementById('rec-delete');
    if (playBtn) {
      playBtn.onclick = playPreview;
    }
    if (delBtn) {
      delBtn.onclick = () => {
        if (confirm(t('confirm_erase_rec'))) {
          currentRecording = null;
          currentDuration = 0;
          recTimer.textContent = formatDur(0);
          refreshRecButtons();
        }
      };
    }
  }
  reattachPlaybackHandlers();

  // Chips de répétition : met à jour la valeur locale (sauvegardée au Save)
  let selectedRepeatCount = aff.repeatCount || 1;
  overlay.querySelectorAll('[data-repeat]').forEach(b => {
    b.addEventListener('click', () => {
      selectedRepeatCount = parseInt(b.dataset.repeat, 10);
      overlay.querySelectorAll('[data-repeat]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  document.getElementById('aff-save').addEventListener('click', () => {
    const title = document.getElementById('aff-title').value.trim();
    const groupId = document.getElementById('aff-group').value;
    if (!title) { toast(t('toast_give_title')); return; }
    aff.title = title;
    aff.groupId = groupId;
    aff.recording = currentRecording;
    aff.duration = currentDuration;
    aff.repeatCount = selectedRepeatCount;
    if (!isEdit) state.affirmations.push(aff);
    saveState();
    overlay.remove();
    toast(isEdit ? t('toast_modified') : t('toast_created'));
    render();
  });

  if (isEdit) {
    document.getElementById('aff-delete').addEventListener('click', () => {
      if (confirm(t('confirm_delete_aff'))) {
        state.affirmations = state.affirmations.filter(a => a.id !== aff.id);
        saveState();
        overlay.remove();
        toast(t('toast_deleted'));
        render();
      }
    });
  }

  document.getElementById('aff-cancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

function formatDur(sec) {
  sec = Math.max(0, Math.round(sec));
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}

          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <div class="kofi-text">
          <div class="kofi-title">${t('support_title')}</div>
          <div class="kofi-sub">${t('support_tagline')}</div>
        </div>
        <div class="kofi-arrow">→</div>
      </div>
    </button>

    <div class="h3">${t('data')}</div>
    <div class="setting-group">
      <div class="setting-row">
        <div>
          <div class="setting-label">${t('export_light')}</div>
          <div class="setting-sub">${t('export_light_sub')}</div>
        </div>
        <button class="btn-secondary" id="export" style="width:auto; padding:8px 16px; margin:0">📥</button>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">${t('export_full')}</div>
          <div class="setting-sub">${t('export_full_sub')}</div>
        </div>
        <button class="btn-secondary" id="export-full" style="width:auto; padding:8px 16px; margin:0">📥</button>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">${t('import_data')}</div>
          <div class="setting-sub">${t('import_data_sub')}</div>
        </div>
        <button class="btn-secondary" id="import" style="width:auto; padding:8px 16px; margin:0">📤</button>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label" style="color:var(--danger)">${t('erase_all')}</div>
          <div class="setting-sub">${t('erase_all_sub')}</div>
        </div>
        <button class="btn-secondary danger" id="reset" style="width:auto; padding:8px 16px; margin:0">✕</button>
      </div>
    </div>

    <input type="file" id="import-file" accept=".json" style="display:none" />

    <div class="app-version-footer">
      GetManifest ✦ v${APP_VERSION}
    </div>
  `;

  document.querySelectorAll('[data-theme-id]').forEach(b => {
    b.addEventListener('click', () => {
      state.settings.theme = b.dataset.themeId;
      saveState();
      applyTheme();
      toast(`${t('toast_theme')} : ${THEMES.find(th => th.id === b.dataset.themeId).name}`);
      render();
    });
  });

  document.getElementById('toggle-dark')?.addEventListener('click', () => {
    state.settings.darkMode = !state.settings.darkMode;
    saveState();
    applyTheme();
    render();
  });

  document.querySelectorAll('[data-lang]').forEach(b => {
    b.addEventListener('click', () => {
      state.settings.language = b.dataset.lang;
      saveState();
      applyLangTabs();
      render();
    });
  });

  document.getElementById('kofi-support-btn')?.addEventListener('click', () => {
    window.open('https://ko-fi.com/getmanifestapp', '_blank');
  });

  document.getElementById('export').addEventListener('click', () => exportData(false));
  document.getElementById('export-full').addEventListener('click', () => exportData(true));
  document.getElementById('import').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', importData);
  document.getElementById('reset').addEventListener('click', () => {
    if (confirm(t('confirm_reset'))) {
      const prevLang = state.settings.language;
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      state.settings.language = prevLang;
      saveState();
      applyTheme();
      toast(t('toast_reset'));
      render();
    }
  });
}

function exportData(withAudio) {
  const data = {
    groups: state.groups,
    affirmations: withAudio ? state.affirmations : state.affirmations.map(a => ({...a, recording: null})),
    settings: state.settings,
    stats: state.stats,
    version: 1,
    exportDate: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${t('backup_name')}${new Date().toISOString().slice(0,10)}${withAudio?'-full':''}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toast_exported'));
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm(t('confirm_import'))) return;
      if (data.groups) state.groups = data.groups;
      if (data.affirmations) state.affirmations = data.affirmations;
      if (data.settings) state.settings = Object.assign(defaultState().settings, data.settings);
      if (data.stats) state.stats = data.stats;
      // Patch partiel du challenge (ex: restaurer le compteur sans toucher aux stats)
      if (data.challenge) state.challenge = Object.assign(state.challenge, data.challenge);
      saveState();
      applyTheme();
      applyLangTabs();
      toast(t('toast_imported'));
      render();
    } catch(err) { toast(t('toast_invalid_file')); }
  };
  reader.readAsText(file);
}

let toastTimeout;
function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (toastTimeout) clearTimeout(toastTimeout);
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimeout = setTimeout(() => el.remove(), 2500);
}

// ============================================================
// ONBOARDING
// ============================================================
const ONBOARDING_STEPS = [
  { icon: '♥', titleKey: 'ob1_title', textKey: 'ob1_text' },
  { icon: '◈', titleKey: 'ob2_title', textKey: 'ob2_text' },
  { icon: '◉', titleKey: 'ob3_title', textKey: 'ob3_text' },
  { icon: '◇', titleKey: 'ob4_title', textKey: 'ob4_text' },
  { icon: '✦', titleKey: 'ob5_title', textKey: 'ob5_text' },
];

let obStep = 0;

function startOnboarding() {
  obStep = 0;
  renderOnboarding();
}

function renderOnboarding() {
  const step = ONBOARDING_STEPS[obStep];
  const isLast = obStep === ONBOARDING_STEPS.length - 1;

  let el = document.getElementById('onboarding');
  const firstBuild = !el;

  if (firstBuild) {
    el = document.createElement('div');
    el.id = 'onboarding';
    el.className = 'onboarding-overlay';
    el.innerHTML = `
      <div class="ob-top">
        <div class="ob-step-indicator" id="ob-indicator"></div>
        <button class="ob-skip-btn" id="ob-skip">${t('ob_skip')}</button>
      </div>
      <div class="ob-content">
        <div class="ob-visual" id="ob-visual"></div>
        <div class="ob-title" id="ob-title"></div>
        <div class="ob-text" id="ob-text"></div>
      </div>
      <div class="ob-dots" id="ob-dots"></div>
      <button class="ob-next-btn" id="ob-next"></button>
    `;
    document.body.appendChild(el);

    document.getElementById('ob-skip').addEventListener('click', endOnboarding);
    document.getElementById('ob-next').addEventListener('click', () => {
      const isNowLast = obStep === ONBOARDING_STEPS.length - 1;
      if (isNowLast) {
        endOnboarding();
        switchTab('list');
      } else {
        obStep++;
        renderOnboarding();
      }
    });
  }

  // Update contents with fade transition
  const visualEl = document.getElementById('ob-visual');
  const titleEl = document.getElementById('ob-title');
  const textEl = document.getElementById('ob-text');
  const indicatorEl = document.getElementById('ob-indicator');
  const dotsEl = document.getElementById('ob-dots');
  const nextBtn = document.getElementById('ob-next');

  const applyContent = () => {
    visualEl.textContent = step.icon;
    titleEl.textContent = t(step.titleKey);
    textEl.textContent = t(step.textKey);
    indicatorEl.textContent = `${t('ob_step')} ${obStep+1} ${t('ob_of')} ${ONBOARDING_STEPS.length}`;
    dotsEl.innerHTML = ONBOARDING_STEPS.map((_, i) => `<div class="ob-dot ${i===obStep?'active':''}"></div>`).join('');
    nextBtn.textContent = (isLast ? t('ob_start') : t('ob_next')) + ' →';
  };

  if (firstBuild) {
    applyContent();
  } else {
    // Fade out puis fade in
    const content = el.querySelector('.ob-content');
    content.classList.add('ob-fading');
    setTimeout(() => {
      applyContent();
      content.classList.remove('ob-fading');
    }, 180);
  }
}

function endOnboarding() {
  state.onboardingDone = true;
  saveState();
  document.getElementById('onboarding')?.remove();
}

// BOOT
if (!state.settings.language) {
  state.settings.language = detectBrowserLang();
  saveState();
}
applyTheme();
applyLangTabs();
document.body.classList.add('player-active'); // player est l'onglet par défaut
render();
if (!state.onboardingDone) {
  startOnboarding();
}

// === UPDATE CHECKER : scanne version.txt pour détecter une nouvelle version ===
async function checkForUpdate() {
  try {
    const url = 'version.txt?nocache=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return;
    const latestVersion = (await res.text()).trim();
    if (latestVersion && latestVersion !== APP_VERSION) {
      showUpdateBanner(latestVersion);
    }
  } catch(e) { /* silencieux : pas de réseau, pas grave */ }
}

function showUpdateBanner(newVersion) {
  if (document.getElementById('update-banner')) return;  // Déjà affiché
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.className = 'update-banner';
  banner.innerHTML = `
    <span class="update-icon">✨</span>
    <span class="update-text">Nouvelle version dispo</span>
    <button class="update-btn" id="update-apply">Mettre à jour</button>
    <button class="update-dismiss" id="update-dismiss" aria-label="Fermer">×</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('update-apply').addEventListener('click', () => {
    // Force reload en vidant le cache
    const u = new URL(window.location.href);
    u.searchParams.set('v', Date.now());
    window.location.href = u.toString();
  });
  document.getElementById('update-dismiss').addEventListener('click', () => {
    banner.remove();
  });
}

// Check au chargement + toutes les 5 min
checkForUpdate();
setInterval(checkForUpdate, 5 * 60 * 1000);

function applyLangTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    const key = tab.dataset.tab;
    const label = tab.querySelector('.tab-label');
    if (label) {
      if (key === 'player') label.textContent = t('tab_player');
      else if (key === 'list') label.textContent = t('tab_list');
      else if (key === 'challenge') label.textContent = t('tab_challenge');
      else if (key === 'stats') label.textContent = t('tab_stats');
      else if (key === 'settings') label.textContent = t('tab_settings');
    }
  });
}
