/* === Aff en cours : titre affiché seul, glow par text-shadow multi-couches
   (approche sans ::before pour éviter toute ligne de coupure visible) === */
.orb-current-aff {
  position: relative;
  z-index: 1;
  font-size: 19px;
  font-weight: 700;
  text-align: center;
  color: var(--text-strong);
  padding: 4px 20px;
  letter-spacing: -0.2px;
  line-height: 1.3;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 420px;
  transition: opacity 0.35s ease-out, filter 0.35s ease-out, text-shadow 0.6s ease-out;
  /* 4 couches de glow qui s'estompent progressivement, sans bord dur */
  text-shadow:
    0 0 12px color-mix(in srgb, var(--accent) 45%, transparent),
    0 0 24px color-mix(in srgb, var(--accent) 32%, transparent),
    0 0 50px color-mix(in srgb, var(--accent) 20%, transparent),
    0 0 90px color-mix(in srgb, var(--accent) 10%, transparent);
  animation: aff-halo-breath 3.5s ease-in-out infinite;
}
@keyframes aff-halo-breath {
  0%, 100% {
    text-shadow:
      0 0 12px color-mix(in srgb, var(--accent) 40%, transparent),
      0 0 24px color-mix(in srgb, var(--accent) 28%, transparent),
      0 0 50px color-mix(in srgb, var(--accent) 18%, transparent),
      0 0 90px color-mix(in srgb, var(--accent) 8%, transparent);
  }
  50% {
    text-shadow:
      0 0 14px color-mix(in srgb, var(--accent) 55%, transparent),
      0 0 28px color-mix(in srgb, var(--accent) 38%, transparent),
      0 0 60px color-mix(in srgb, var(--accent) 25%, transparent),
      0 0 110px color-mix(in srgb, var(--accent) 14%, transparent);
  }
}
.orb-current-aff.glowing {
  animation: aff-halo-breath 2.2s ease-in-out infinite;
}
.orb-current-aff.fade-out {
  opacity: 0;
  filter: blur(5px);
}
.orb-current-aff.fade-in {
  animation: aff-glow-in 1.1s cubic-bezier(0.2, 0.9, 0.3, 1);
}
@keyframes aff-glow-in {
  0% {
    opacity: 0;
    filter: blur(8px);
    text-shadow:
      0 0 60px var(--accent),
      0 0 20px color-mix(in srgb, var(--accent) 80%, transparent);
  }
  45% {
    opacity: 1;
    filter: blur(0);
    text-shadow:
      0 0 35px color-mix(in srgb, var(--accent) 70%, transparent),
      0 0 15px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  100% {
    opacity: 1;
    filter: blur(0);
    text-shadow:
      0 0 20px color-mix(in srgb, var(--accent) 45%, transparent),
      0 0 40px color-mix(in srgb, var(--accent) 20%, transparent);
  }
}

/* Ligne meta constante au-dessus de l'orbe (jamais vide → pas de décalage) */
.orb-meta-line {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 600;
  letter-spacing: 0.2px;
  text-align: center;
  padding: 0 10px;
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 6px;
}
.orb-meta-line strong {
  color: var(--text-strong);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.orb-meta-line em {
  color: var(--text-faint);
  font-style: italic;
  font-weight: 500;
}
.ch-edit-affs-mini {
  /* v1.26.0 : pastille « ✏ Modifier » bien visible (avant : petit rond pâle) */
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 1.5px solid var(--accent);
  color: var(--accent);
  height: 28px;
  border-radius: 99px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0 11px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.2px;
  transition: all 0.15s;
  margin-left: 6px;
}
.ch-edit-affs-mini:active {
  background: var(--accent);
  color: var(--btn-text);
  transform: scale(0.9);
}

/* Bouton paramètres discret en haut à droite du Player (non animé) */
.player-gear-btn {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  right: 14px;
  background: color-mix(in srgb, var(--card-bg) 70%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  color: var(--text-soft);
  width: 40px; height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 60;
  transition: color 0.15s, transform 0.1s;
  padding: 0;
}
.player-gear-btn:active {
  transform: scale(0.92);
  color: var(--accent);
}

/* (Ancienne) poignée demi-ronde fixe en bas, gardée pour la page Challenge.
   Le Player utilise maintenant player-gear-btn en haut à droite. */
.ch-settings-handle {
  position: fixed;
  /* Collé au-dessus de la nav. --tabs-height est mesurée en JS au load
     (voir setupTabsHeightVar). Fallback 70px si JS pas encore passé. */
  bottom: var(--tabs-height, 70px);
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 32px;
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-bottom: none;
  border-radius: 100px 100px 0 0;
  color: var(--accent);
  cursor: pointer;
  z-index: 50;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 -4px 14px color-mix(in srgb, var(--accent) 15%, transparent);
  animation: handle-pulse 2.6s ease-in-out infinite;
  transition: transform 0.15s, color 0.2s;
}
.ch-settings-handle::before {
  content: '';
  position: absolute;
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  border-radius: 100px;
  background: color-mix(in srgb, var(--accent) 55%, transparent);
}
.ch-settings-handle svg {
  margin-top: 4px;
}
.ch-settings-handle:active {
  transform: translateX(-50%) scale(0.94);
  background: color-mix(in srgb, var(--accent) 12%, var(--card-bg));
}
@keyframes handle-pulse {
  0%, 100% {
    transform: translateX(-50%) translateY(0);
    box-shadow: 0 -4px 14px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  50% {
    transform: translateX(-50%) translateY(-3px);
    box-shadow: 0 -6px 18px color-mix(in srgb, var(--accent) 25%, transparent);
  }
}

.challenge-eta-top {
  text-align: center;
  font-size: 12.5px;
  color: var(--text-dim);
  font-style: italic;
  letter-spacing: 0.3px;
  padding: 0 10px;
}
.challenge-eta-top strong {
  color: var(--accent);
  font-weight: 800;
  font-style: normal;
}
.challenge-eta-top em {
  font-style: italic;
  color: var(--text-faint);
}

.challenge-orb {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  background: transparent;
  border: none;
  padding: 0;
  margin: 2px 0;
}

/* Halo rose derrière la lune */
.challenge-orb::before {
  content: '';
  position: absolute;
  inset: -32px;
  background: radial-gradient(circle,
    color-mix(in srgb, var(--accent) 28%, transparent) 0%,
    color-mix(in srgb, var(--accent) 10%, transparent) 42%,
    transparent 72%);
  z-index: 0;
  border-radius: 50%;
  animation: orb-glow 4s ease-in-out infinite;
  pointer-events: none;
}
.challenge-orb.playing::before {
  animation: orb-glow 2.6s ease-in-out infinite;
}
@keyframes orb-glow {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.85; transform: scale(1.08); }
}

.orb-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  overflow: visible;
}
.orb-ring .orb-track {
  stroke: var(--line);
  stroke-width: 4;
  opacity: 0.5;
}
.orb-ring .orb-progress {
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 40%, transparent));
}

.orb-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 24px;
  text-align: center;
}

.orb-count {
  font-size: 40px;
  font-weight: 800;
  color: var(--text-strong);
  line-height: 1;
  letter-spacing: -0.5px;
  font-feature-settings: 'tnum';
  font-variant-numeric: tabular-nums;
}
.orb-target {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
  letter-spacing: 0.4px;
  margin-bottom: 2px;
}
.orb-play-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent);
  transition: transform 0.15s, box-shadow 0.2s;
  margin: 2px 0;
}
.challenge-orb:active .orb-play-icon {
  transform: scale(0.9);
  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 60%, transparent);
}
.orb-pct {
  font-size: 11px;
  color: var(--accent);
  font-weight: 800;
  letter-spacing: 0.6px;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

/* Infos sous l'orbe */
.orb-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.orb-remaining {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
  letter-spacing: 0.2px;
}
.orb-remaining strong {
  color: var(--text-strong);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.orb-started {
  font-size: 11px;
  color: var(--text-faint);
  font-style: italic;
  letter-spacing: 0.2px;
}

/* Mobile */
@media (max-width: 400px) {
  .challenge-orb { width: 220px; height: 220px; }
  .orb-count { font-size: 38px; }
  .orb-play-icon { width: 42px; height: 42px; }
}

/* Toggle Dark mode */
.dark-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.dark-toggle-labels {
  display: flex;
  gap: 4px;
}
.dark-emoji { font-size: 14px; }
.toggle-switch {
  background: var(--line);
  border: none;
  width: 44px;
  height: 24px;
  border-radius: 100px;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
  padding: 0;
}
.toggle-switch.active { background: var(--accent); }
.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.3s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle-switch.active .toggle-knob { transform: translateX(20px); }
.dark-toggle-text {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.dark-toggle-text strong {
  color: var(--accent);
  font-weight: 800;
  margin-left: 4px;
}

/* Barre vitesse live */
.live-speed {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 14px 18px;
  box-shadow: var(--card-shadow);
  margin-top: 4px;
}
.live-speed-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.live-speed-label > span:first-child {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
}
.live-speed-val {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
}
/* v1.23.0 : pavé vitesse identique en Repeat, SATS et Challenge : petit, sans halo (il était coupé) */
.live-speed.speed-compact {
  width: 300px;
  max-width: calc(100vw - 32px);
  box-sizing: border-box;
  margin-left: auto;
  margin-right: auto;
  box-shadow: none;
  border: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
}
/* v1.24.0 : étiquette « Mode silencieux » sous le rond, dans les 3 modes */
.silent-tag {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--text-strong);
  background: color-mix(in srgb, var(--accent) 22%, var(--card-bg, #2a201a));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 100px;
  padding: 4px 12px;
  pointer-events: none;
}
/* v1.23.0 : orbe du Challenge = orbe de Repeat */
.ch-orb-target {
  font-size: 13px;
  font-weight: 600;
  margin-top: 6px;
  opacity: 0.85;
  font-variant-numeric: tabular-nums;
}
/* v1.23.0 : titre de Repeat/SATS avec le même halo que le Challenge */
.now-playing { font-weight: 700; }
.now-playing .np-text {
  text-shadow:
    0 0 12px color-mix(in srgb, var(--accent) 45%, transparent),
    0 0 24px color-mix(in srgb, var(--accent) 32%, transparent),
    0 0 50px color-mix(in srgb, var(--accent) 20%, transparent),
    0 0 90px color-mix(in srgb, var(--accent) 10%, transparent);
  animation: aff-halo-breath 3.5s ease-in-out infinite;
  transition: opacity 0.35s ease-out, filter 0.35s ease-out;
}
.now-playing.np-glowing .np-text { animation: aff-halo-breath 2.2s ease-in-out infinite; }
.now-playing .np-text.fade-in { animation: aff-glow-in 1.1s cubic-bezier(0.2, 0.9, 0.3, 1); }
/* Sans défilement, le halo peut déborder (sinon il est coupé net) */
.now-playing:not(.has-scroll),
.now-playing:not(.has-scroll) .now-playing-inner { overflow: visible; }
/* Bloc Vitesse qui contient l'ETA en dessous du slider */
.speed-eta-block { padding: 10px 14px; margin-top: 0; }
/* v1.25.0 : bouton « Recommencer le challenge » quand l'objectif est atteint */
.ch-restart-btn {
  border: none;
  border-radius: 999px;
  padding: 9px 22px;
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  color: var(--bg-solid);
  background: linear-gradient(135deg, var(--accent-light, var(--accent)), var(--accent));
  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent);
  cursor: pointer;
}
.ch-restart-btn:active { transform: scale(0.97); }
.speed-eta-block .live-speed-label { margin-bottom: 6px; }
/* v1.25.1 : un peu d'air entre « Terminer » et le pavé vitesse */
.session-actions + .live-speed.speed-eta-block { margin-top: 10px; }
/* v1.25.2 : pavé vitesse sur une seule ligne (Vitesse · curseur · 1.00x), plus bas de hauteur,
   et le bas du Player resserré : le pavé ne touche plus le bas de l'écran. Le rond ne bouge pas. */
.live-speed.speed-compact { display: flex; align-items: center; flex-wrap: wrap; column-gap: 12px; padding: 8px 16px; }
.live-speed.speed-compact .live-speed-label { display: contents; }
.live-speed.speed-compact .live-speed-label > span:first-child { order: 1; letter-spacing: 1px; }
.live-speed.speed-compact input[type="range"] { order: 2; flex: 1; min-width: 0; margin: 0; }
.live-speed.speed-compact .live-speed-val { order: 3; font-size: 16px; min-width: 46px; text-align: right; }
.live-speed.speed-compact .speed-eta-text { order: 4; flex-basis: 100%; margin-top: 2px; }
#page-player .session-counter-wrap { margin-top: -8px; }
#page-player .session-counter-value { font-size: 38px; }
#page-player .session-actions { margin-top: 10px; }
#page-player .session-actions .session-btn { padding-top: 9px; padding-bottom: 9px; }
/* v1.36.0 : espaces resserrés pour que « Terminer » et la barre de vitesse se voient sans défiler */
#page-player .player-main { gap: 14px; }
#page-player .now-playing { height: 72px; }
#page-player .orb-container { width: 232px; height: 232px; }
#page-player .player-top { margin-bottom: 8px; }
#page-player .player-mode-chips { margin-bottom: 10px; }
#page-player .session-counter-value { font-size: 32px; }
.speed-eta-text {
  margin-top: 6px;
  text-align: center;
  font-size: 11.5px;

  font-style: italic;

}

  color: var(--accent);

}

.challenge-divider {

   ICÔNES SVG DES ONGLETS (style minimaliste moderne)
   =================================================== */

/* ===================================================
   v1.27.0 : PHOTOS DES PLAYLISTS (tableau de vision)
   =================================================== */
/* Le calque qui défile derrière le Player (Repeat et Challenge) */
#vision-show {
  position: fixed; inset: 0; z-index: 0;
  overflow: hidden; pointer-events: none;
  opacity: 0; visibility: hidden;
  transition: opacity 0.9s ease, visibility 0s linear 0.9s;
}
#vision-show.on { opacity: 1; visibility: visible; transition: opacity 0.9s ease; }
.vision-layer {
  position: absolute; inset: -2%;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 1.2s ease;
  will-change: opacity, transform;
}
.vision-layer.front { opacity: 1; }
.vision-layer.kb { animation: vision-zoom 18s ease-out forwards; }
body.vision-paused .vision-layer.kb { animation-play-state: paused; }
@keyframes vision-zoom { from { transform: scale(1); } to { transform: scale(1.08); } }
/* Voile : la couleur du fond du thème, plus forte en haut et en bas, pour que tout reste lisible */
.vision-veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--bg-solid) 84%, transparent) 0%,
    color-mix(in srgb, var(--bg-solid) 58%, transparent) 30%,
    color-mix(in srgb, var(--bg-solid) 48%, transparent) 55%,
    color-mix(in srgb, var(--bg-solid) 78%, transparent) 82%,
    color-mix(in srgb, var(--bg-solid) 92%, transparent) 100%);
}
body.vision-on .app { position: relative; z-index: 1; }
body.vision-on .np-text,
body.vision-on .session-counter-value,
body.vision-on #orb-current-aff { text-shadow: 0 1px 12px color-mix(in srgb, var(--bg-solid) 90%, transparent); }
@media (prefers-reduced-motion: reduce) {
  .vision-layer.kb { animation: none; }
}

/* Bouton photos dans l'en-tête d'une playlist */
.group-photo-btn {
  position: relative;
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--accent);
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-right: 6px;
}
.group-photo-btn:active { background: var(--accent); color: var(--btn-text); }
.group-photo-count {
  position: absolute; top: -5px; right: -6px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px;
  background: var(--accent); color: var(--btn-text);
  font-size: 10px; font-weight: 800; line-height: 17px; text-align: center;
}

/* Fenêtre « Mon tableau de vision » */
.vision-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 14px;
  max-height: 46vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.vision-thumb {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: 12px;
  overflow: hidden;
  background: var(--input-bg);
  border: 1px solid var(--line);
}
.vision-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vision-del {
  position: absolute; top: 5px; right: 5px;
  width: 26px; height: 26px; border-radius: 50%;
  border: none; cursor: pointer;
  background: rgba(0,0,0,0.55); color: #fff;
  font-size: 13px; line-height: 26px; text-align: center;
}
.vision-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 26px 10px;
  color: var(--text-dim);
  font-size: 13px;
  border: 1.5px dashed var(--line);
  border-radius: 14px;
}
.vision-count { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; letter-spacing: 0.3px; }
.vision-group-name { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.btn-primary.busy { opacity: 0.6; pointer-events: none; }

/* Réglage « Photos à l'écoute » : le rythme */
.music-mode-row.vision-every-row { grid-template-columns: repeat(3, 1fr); margin-bottom: 10px; }
.music-mode-row.vision-style-row { margin-bottom: 4px; }

/* v1.28.0 : « Par-dessus » : la photo en grand au-dessus de tout, l'affirmation en haut */
.vision-veil { transition: opacity 0.6s ease; }
#vision-show.front { z-index: 150; pointer-events: auto; cursor: pointer; }
#vision-show.front .vision-veil { opacity: 0; }
.vision-caption {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top) + 34px) 24px 80px;
  background: linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.32) 55%, transparent 100%);
  text-align: center;
  opacity: 0; transition: opacity 0.6s ease;
  pointer-events: none;
}
#vision-show.front .vision-caption { opacity: 1; }
.vision-caption span {
  display: inline-block; max-width: 440px;
  color: #fff; font-family: 'Nunito', sans-serif; font-weight: 700;
  font-size: 23px; line-height: 1.35;
  text-shadow: 0 2px 14px rgba(0,0,0,0.6);
  transition: opacity 0.3s ease;
}
.vision-caption span.swap { opacity: 0; }
.vision-hint {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 30px);
  background: rgba(0,0,0,0.5); color: #fff;
  font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
  padding: 8px 15px; border-radius: 100px; white-space: nowrap;
  opacity: 0; transition: opacity 0.6s ease; pointer-events: none;
}
#vision-show.front.hint .vision-hint { opacity: 1; }
.vision-every-row [data-vision-every="aff"] { grid-column: 1 / -1; }
.vision-every-row.off { opacity: 0.45; pointer-events: none; }
</style>
</head>

function t(key, vars) {
  // Fallback : si pas de langue choisie, détecte via le navigateur (anglais par défaut)
  const lang = state.settings.language || detectBrowserLang();
  let str = (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.en[key] || TRANSLATIONS.fr[key] || key;
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.replace('{' + k + '}', vars[k]); });
  }
  return str;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const p = JSON.parse(raw);
    const d = defaultState();
    const settings = Object.assign(d.settings, p.settings || {});
    // Migration : l'ancien mode 'playlist' n'existe plus → bascule sur 'none'
    if (settings.musicMode === 'playlist') settings.musicMode = 'none';
    // Migration : anciennes ambiances supprimées → healing par défaut
    if (!['healing', 'clouds'].includes(settings.ambianceId)) settings.ambianceId = 'healing';
    // Migration v1.6.1 : si pas de params ch* sauvegardés, copie les params Player → Challenge
    // pour que la première ouverture après maj garde le même feel
    const prevSettings = p.settings || {};
    const hadChSettings = 'chAffVolume' in prevSettings || 'chPlaybackRate' in prevSettings;
    if (!hadChSettings) {
      settings.chAffVolume = settings.affVolume;
      settings.chMusicVolume = settings.musicVolume;
      settings.chPlaybackRate = settings.playbackRate;
      settings.chPauseBetween = settings.pauseBetween;
      settings.chMusicMode = settings.musicMode;
      settings.chAmbianceId = settings.ambianceId;
      settings.chSilentMode = settings.silentMode || false;
      settings.chNightMode = settings.nightMode || false;
      settings.chNightTimer = settings.nightTimer || 60;
    }
    // v1.23.0 : SATS prend ses propres réglages, copiés une fois depuis Repeat
    if (!('satsPlaybackRate' in prevSettings)) {
      settings.satsAffVolume = settings.affVolume;
      settings.satsPlaybackRate = settings.playbackRate;
      settings.satsPauseBetween = settings.pauseBetween;
      settings.satsSilentMode = settings.silentMode || false;
    }
    // v1.27.4 : l'océan devient le fond par défaut (la pluie l'était depuis v1.26.0)
    if (!prevSettings.satsOceanV1) {
      if (settings.satsBgId === 'rain') settings.satsBgId = 'ocean';
      settings.satsOceanV1 = true;
    }
    // v1.22.0 : plus de musique d'ambiance fournie (droits non vérifiés) → coupée partout
    settings.musicMode = 'none';
    settings.chMusicMode = 'none';
    const challenge = Object.assign(d.challenge, p.challenge || {});
    // Migration : ancien champ affirmationId (string) → affirmationIds (array)
    if (!challenge.affirmationIds || !Array.isArray(challenge.affirmationIds)) {
      challenge.affirmationIds = challenge.affirmationId ? [challenge.affirmationId] : [];
      delete challenge.affirmationId;
    }
    if (typeof challenge.currentIdx !== 'number') challenge.currentIdx = 0;
    return {
      groups: p.groups || d.groups,
      affirmations: p.affirmations !== undefined ? p.affirmations : d.affirmations,
      settings: settings,
      stats: Object.assign(d.stats, p.stats || {}),
      challenge: challenge,
      ui: Object.assign({ collapsedPlaylists: {}, playerMode: 'repeat', journalView: 'stats' }, p.ui || {}),
      notes: Array.isArray(p.notes) ? p.notes : [],
      onboardingDone: p.onboardingDone || false,
    };
  } catch(e) { return defaultState(); }
}

// ============================================================
// VOIX À PART (v1.21.0)
// Les enregistrements (dataURL base64) vivent dans IndexedDB, plus dans localStorage.
// - En mémoire rien ne change : aff.recording contient toujours le dataURL.
// - saveState() n'écrit que le léger. Une voix reste dans localStorage tant qu'elle
//   n'est pas CONFIRMÉE dans IndexedDB (écrite puis relue) : jamais de trou.
// - Une aff dont la voix est dans IndexedDB porte le marqueur _v:1 dans localStorage.
// - Si IndexedDB n'est pas dispo, voicesReady reste false : tout marche comme avant.
// ============================================================
const VOICE_DB = 'getmanifest_voices';
const VOICE_STORE = 'voices';
let voiceDb = null;
let voicesReady = false;
const voicesSaved = new Map();  // affId → dataURL confirmé dans IndexedDB
let voiceSyncRunning = false;
let voiceSyncAgain = false;

function openVoiceDb() {
  return new Promise((resolve, reject) => {
    try {
      if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
      const req = indexedDB.open(VOICE_DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(VOICE_STORE)) db.createObjectStore(VOICE_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('open error'));
      req.onblocked = () => reject(new Error('open blocked'));
    } catch(e) { reject(e); }
  });
}

function readAllVoices() {
  return new Promise((resolve, reject) => {
    try {
      const out = new Map();
      const tx = voiceDb.transaction(VOICE_STORE, 'readonly');
      const req = tx.objectStore(VOICE_STORE).openCursor();
      req.onsuccess = () => {
        const c = req.result;
        if (c) { out.set(c.key, c.value); c.continue(); }
      };
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error || new Error('read error'));
      tx.onabort = () => reject(tx.error || new Error('read abort'));
    } catch(e) { reject(e); }
  });
}

// Copie de l'état pour localStorage : sans les voix déjà confirmées dans IndexedDB.
// stripAll = true : enlève toutes les voix (secours si localStorage est plein).
function stateForStorage(stripAll) {
  const affs = (state.affirmations || []).map(a => {
    if (!a || !a.recording) return a;
    if (!stripAll && voicesSaved.get(a.id) !== a.recording) return a;
    const c = Object.assign({}, a);
    delete c.recording;
    c._v = 1;
    return c;
  });
  return Object.assign({}, state, { affirmations: affs });
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stateForStorage(false))); }
  catch(e) {
    let ok = false;
    if (voicesReady) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stateForStorage(true))); ok = true; }
      catch(e2) {}
    }
    if (!ok) toast(t('toast_storage_full'));
  }
  if (voicesReady) syncVoices();
}

// Écrit dans IndexedDB seulement les voix qui ont changé, enlève celles qui n'existent plus.
function syncVoices() {
  if (!voicesReady || !voiceDb) return;
  if (voiceSyncRunning) { voiceSyncAgain = true; return; }
  const puts = [];
  const dels = [];
  const alive = new Set();
  (state.affirmations || []).forEach(a => {
    if (!a || !a.id || !a.recording) return;
    alive.add(a.id);
    if (voicesSaved.get(a.id) !== a.recording) puts.push([a.id, a.recording]);
  });
  voicesSaved.forEach((v, id) => { if (!alive.has(id)) dels.push(id); });
  if (!puts.length && !dels.length) return;

  voiceSyncRunning = true;
  let finished = false;
  const finish = (confirmed, delsOk) => {
    if (finished) return;
    finished = true;
    voiceSyncRunning = false;
    if (delsOk) dels.forEach(id => voicesSaved.delete(id));
    confirmed.forEach(([id, rec]) => voicesSaved.set(id, rec));
    if (confirmed.length < puts.length) {
      logEvent('voices_sync_fail', { puts: puts.length, ok: confirmed.length });
    }
    const again = voiceSyncAgain;
    voiceSyncAgain = false;
    // Voix confirmées : on réécrit le léger (elles sortent de localStorage)
    if (confirmed.length) saveState();
    else if (again) syncVoices();
  };

  try {
    const tx = voiceDb.transaction(VOICE_STORE, 'readwrite');
    const st = tx.objectStore(VOICE_STORE);
    dels.forEach(id => st.delete(id));
    puts.forEach(([id, rec]) => st.put(rec, id));
    tx.onerror = () => finish([], false);
    tx.onabort = () => finish([], false);
    tx.oncomplete = () => {
      if (!puts.length) { finish([], true); return; }
      // Relecture : une voix n'est confirmée que si on la relit à l'identique
      try {
        const confirmed = [];
        const tx2 = voiceDb.transaction(VOICE_STORE, 'readonly');
        const st2 = tx2.objectStore(VOICE_STORE);
        puts.forEach(([id, rec]) => {
          const r = st2.get(id);
          r.onsuccess = () => { if (r.result === rec) confirmed.push([id, rec]); };
        });
        tx2.oncomplete = () => finish(confirmed, true);
        tx2.onerror = () => finish([], true);
        tx2.onabort = () => finish([], true);
      } catch(e) { finish([], true); }
    };
  } catch(e) { finish([], false); }
}

// Au démarrage : recharge les voix depuis IndexedDB, puis déplace celles restées dans localStorage.
async function initVoices() {
  try {
    voiceDb = await openVoiceDb();
    const stored = await readAllVoices();
    stored.forEach((v, id) => voicesSaved.set(id, v));
    let hydrated = 0;
    let missing = 0;
    (state.affirmations || []).forEach(a => {
      if (!a) return;
      if (a._v && !a.recording) {
        if (stored.has(a.id)) { a.recording = stored.get(a.id); hydrated++; }
        else missing++;
      }
      delete a._v;
    });
    voicesReady = true;
    if (missing) logEvent('voices_missing', { n: missing });
    saveState();  // déclenche le déplacement des voix encore dans localStorage
    if (hydrated) {
      const inCh = currentTab === 'player' && state.ui.playerMode === 'challenge'
        && (state.challenge.affirmationIds || []).some(id => state.affirmations.find(a => a.id === id && a.recording))
        && !window.editingChallengeSelection;
      document.body.classList.toggle('ch-active', inCh);
      render();
    }
  } catch(e) {
    logEvent('voices_init_fail', { msg: String(e && e.message || e) });
  }
}

function applyTheme() {
  let theme = state.settings.theme || 'nuit';
  // Migration : ancien thème 'tech' → 'ocean'
  if (THEME_MIGRATION[theme]) { theme = THEME_MIGRATION[theme]; state.settings.theme = theme; saveState(); }

  const dark = state.settings.darkMode ? '-dark' : '';
  document.documentElement.setAttribute('data-theme', theme + dark);

  document.body.classList.toggle('night-mode', state.settings.nightMode === true);

function switchTab(tab) {
  if (tab !== 'list') listOpenGroupId = null;  // v1.33.0 : on revient sur les tuiles
  // Si l'ancien onglet "challenge" est demandé (vieux lien), bascule vers Player + mode challenge
  if (tab === 'challenge') {
    switchPlayerMode('challenge', { skipRender: true });
    tab = 'player';
  }
  // Si on quitte le challenge pendant une édition, on annule l'édition
  if (currentTab === 'player' && state.ui.playerMode === 'challenge' && tab !== 'player') {
    window.editingChallengeSelection = false;
  }
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  // Choisit la page HTML à afficher
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  let pageId;
  if (tab === 'player') {
    const mode = state.ui.playerMode || 'repeat';
    pageId = (mode === 'challenge') ? 'page-challenge' : 'page-player';
  } else {
    pageId = 'page-' + tab;
  }
  const targetPage = document.getElementById(pageId);
  if (targetPage) targetPage.classList.add('active');
  document.body.classList.toggle('player-active', tab === 'player');
  // ch-active : no-scroll quand on est sur Player en mode challenge avec sélection faite
  const inCh = tab === 'player' && state.ui.playerMode === 'challenge'
    && (state.challenge.affirmationIds || []).some(id => state.affirmations.find(a => a.id === id && a.recording))
    && !window.editingChallengeSelection;
  document.body.classList.toggle('ch-active', inCh);
  window.scrollTo(0, 0);
  render();
}

// Changer le mode du Player (Repeat, Challenge, SATS)
// Met en pause tout ce qui joue avant de switcher.
function switchPlayerMode(mode, opts = {}) {
  if (!['repeat', 'challenge', 'sats'].includes(mode)) return;
  const prevMode = state.ui.playerMode || 'repeat';
  // v1.27.6 : changer de mode termine la séance. Avant : une simple pause, et Repeat
  // reprenait l'audio du SATS avec ses échos, ses voix doublées et son filtre.
  // v1.34.0 : entre Repeat et Challenge, simple pause : la séance (temps, compteur) est gardée
  const touchesSats = (mode === 'sats' || prevMode === 'sats');
  if (mode !== prevMode && touchesSats && (playerState.playing || playerState.sessionStart)) endPlaybackSession();
  else if (playerState.playing) pausePlayback();
  if (state.challenge.playing) {
    state.challenge.playing = false;
    if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
    if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
    stopMusic();
    clearNightTimer();
  }
  // SATS = mode nuit auto activé, Repeat/Challenge = mode nuit auto désactivé
  state.settings.nightMode = (mode === 'sats');
  // v1.27.6 : en quittant le SATS, on coupe ses effets tout de suite (échos, voix doublées, filtre, fond sonore)
  if (mode !== 'sats' && playerAudioCtx) { applyNightMode(false); stopSatsBackground(); }
  satsSubReset();
  state.ui.playerMode = mode;
  saveState();
  if (!opts.skipRender) {
    // Si on est sur l'onglet Player, bascule la page affichée selon le mode
    if (currentTab === 'player') {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const pageId = (mode === 'challenge') ? 'page-challenge' : 'page-player';
      document.getElementById(pageId)?.classList.add('active');
      // Toggle ch-active
      const inCh = mode === 'challenge'
        && (state.challenge.affirmationIds || []).some(id => state.affirmations.find(a => a.id === id && a.recording))
        && !window.editingChallengeSelection;
      document.body.classList.toggle('ch-active', inCh);
    }
    render();
  }
}

// ============================================================
// PLAYER
// ============================================================
let playerState = {
  playing: false,
  paused: false,
  currentIdx: 0,
  queue: [],
  loopCount: 0,
  totalPlayed: 0,
  lastSessionCount: 0,
  pauseTimeout: null,
  repeatPending: false,
  sessionStart: null,
  sessionTimerInterval: null,
  // Chrono Repeat (v1.23.0) : temps de lecture cumulé, hors pauses
  elapsedMs: 0,
  runStart: null,
  goalNotified: false,
};

function formatSessionTime(secs) {
  secs = Math.max(0, Math.floor(secs));
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

// ============================================================
// CHRONO REPEAT (v1.23.0) : temps de lecture dans l'orbe,
// durée de séance optionnelle (réglages) avec anneau + vibration à la fin
// ============================================================
function syncRepeatClock() {
  const now = Date.now();
  if (playerState.playing && !playerState.runStart) {
    playerState.runStart = now;
  } else if (!playerState.playing && playerState.runStart) {
    playerState.elapsedMs += now - playerState.runStart;
    playerState.runStart = null;
  }
}
function getRepeatElapsedMs() {
  syncRepeatClock();
  return playerState.elapsedMs + (playerState.runStart ? Date.now() - playerState.runStart : 0);
}
function resetRepeatClock() {
  try { routineFlush(true); } catch(e) {}  // v1.30.0 : on garde le temps de la séance pour la routine
  routineLastElapsed = 0;
  playerState.elapsedMs = 0;
  playerState.runStart = null;
  playerState.goalNotified = false;
  playerState.routineSnap = null;  // v1.31.0 : la prochaine séance repart de ce qui reste de la routine
}
// v1.31.0 : la durée de séance (réglages) passe en premier ; sinon, le rond décompte ce qui reste de la routine du jour
function getRepeatGoalMs() {
  // v1.35.0 : « Écoute libre » = la durée choisie sous le bouton (0 = sans fin) ; « Ma routine » = la séance en cours
  if (!repeatModeIsRoutine()) return Math.max(0, state.settings.repeatDuration || 0) * 60000;
  return routineSessionGoalMs();
}
// v1.35.0 : Repeat en « Ma routine » ou en « Écoute libre » (avant 1.35 : une durée choisie passait avant la routine)
function repeatModeIsRoutine() {
  const m = state.settings.repeatMode;
  if (m === 'routine') return true;
  if (m === 'free') return false;
  return !(state.settings.repeatDuration > 0) && (state.settings.routineMinutes || 0) > 0;
}
function routineSessionGoalMs() {
  const g = routineGoal();
  if (!g.ms || state.ui.playerMode === 'sats') return 0;
  const k = todayKey();
  if (!playerState.routineSnap || playerState.routineSnap.k !== k) {
    // Temps déjà fait aujourd'hui AVANT cette séance (la part de la séance déjà comptée est retirée)
    const today = (state.stats.routineDays || {})[k] || 0;
    playerState.routineSnap = { k, base: Math.max(0, today - Math.min(today, routineLastElapsed)) };
  }
  // v1.34.0 : le rond décompte la séance en cours ; quand toutes les séances du jour sont faites, le temps monte
  const base = playerState.routineSnap.base;
  if (base >= g.dayMs) return 0;
  const total = base + getRepeatElapsedMs();
  if (total >= g.dayMs) return g.dayMs - base;
  const boundary = (Math.floor(total / g.ms) + 1) * g.ms;
  return boundary - base;
}
function repeatGoalIsRoutine() {
  return repeatModeIsRoutine() && routineSessionGoalMs() > 0;
}
function formatRepeatClock(ms) {
  const secs = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
// v1.30.0 : avec une durée, le temps décompte (10:00 → 00:00), puis « +01:23 » au-delà
function repeatClockText(elapsed) {
  const goal = getRepeatGoalMs();
  if (goal <= 0) return formatRepeatClock(elapsed);
  if (elapsed < goal) return formatRepeatClock(Math.ceil((goal - elapsed) / 1000) * 1000);
  return '+' + formatRepeatClock(elapsed - goal);
}

// Met à jour le titre affiché dans .now-playing avec:
// - font-size adaptative selon la longueur
// - défilement vertical auto synchro sur la durée de l'aff si ça déborde
let _scrollRAF = null;
function updateNowPlayingTitle(title, affDurationSec) {
  const np = document.getElementById('now-playing');
  const inner = document.getElementById('now-playing-inner');
  const text = document.getElementById('np-text');
  if (!np || !inner || !text) return;
  // Stop tout scroll en cours
  if (_scrollRAF) { cancelAnimationFrame(_scrollRAF); _scrollRAF = null; }
  text.style.transform = '';
  text.style.transition = '';
  inner.classList.remove('scroll-auto');
  np.classList.remove('has-scroll');
  const titleChanged = text.textContent !== (title || '');
  text.textContent = title || '';
  np.classList.toggle('np-glowing', !!playerState.playing);
  // v1.23.0 : même apparition lumineuse que dans le Challenge
  if (titleChanged && playerState.playing) {
    text.classList.remove('fade-in');
    void text.offsetWidth;
    text.classList.add('fade-in');
    setTimeout(() => text.classList.remove('fade-in'), 1200);
  }
  // Taille selon longueur du texte
  const len = (title || '').length;
  let size = '';
  if (len > 150) size = 'xs';
  else if (len > 90) size = 's';
  else if (len > 50) size = 'm';
  if (size) np.setAttribute('data-size', size);
  else np.removeAttribute('data-size');
  // Vérifie si ça déborde encore après le downsize → scroll auto
  requestAnimationFrame(() => {
    // Premier check en mode centré (flex align-items: center)
    const containerH = inner.clientHeight;
    const textH = text.scrollHeight;
    const overflow = textH - containerH;
    if (overflow > 4) {
      // Passe en mode scroll (top-aligned)
      inner.classList.add('scroll-auto');
      np.classList.add('has-scroll');
      // Durée totale = durée de l'aff (ou 10s par défaut) ajustée par playbackRate
      const rate = pget('playbackRate') || 1;
      const totalDur = Math.max(5, (affDurationSec || 10) / rate) * 1000; // ms
      const start = performance.now();
      // Anime scroll: 10% pause top, 80% scroll down, 10% pause bottom, alterne
      const step = (now) => {
        const elapsed = (now - start) % (totalDur * 2);  // alternate cycle
        const halfCycle = totalDur;
        let t = elapsed < halfCycle ? elapsed / halfCycle : (2 * halfCycle - elapsed) / halfCycle;
        // Easing pauses aux extrêmes: [0, 0.1] = 0, [0.1, 0.9] = progress, [0.9, 1] = 1
        let progress;
        if (t < 0.1) progress = 0;
        else if (t > 0.9) progress = 1;
        else progress = (t - 0.1) / 0.8;
        const y = -overflow * progress;
        text.style.transform = `translateY(${y}px)`;
        _scrollRAF = requestAnimationFrame(step);
      };
      _scrollRAF = requestAnimationFrame(step);
    }
  });
}

        <input type="range" id="live-speed" min="0.5" max="3" step="0.05" value="${pget('playbackRate')}" />

    </div>

    <!-- Bouton paramètres discret en haut à droite (non animé) -->
    <button class="player-gear-btn" id="player-settings-btn" aria-label="${t('player_sheet_btn')}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  `;

  // Click sur orb : si en lecture = pause, sinon start/resume
  document.getElementById('play-btn').addEventListener('click', togglePlay);
  // v1.35.0 : Ma routine / Écoute libre, sans quitter Repeat
  document.querySelectorAll('[data-rp-mode]').forEach(b => b.addEventListener('click', () => setRepeatMode(b.dataset.rpMode)));
  document.querySelectorAll('[data-rp-dur]').forEach(b => b.addEventListener('click', () => setFreeDuration(parseInt(b.dataset.rpDur, 10) || 0)));

    s.selectedGroupId = e.target.value;
    saveState();
    // v1.23.0 : on termine la session (et on jette l'ancien audio), sinon Play reprenait l'ancienne playlist
    if (playerState.playing || playerState.sessionStart) endPlaybackSession();
    playerState.lastSessionCount = 0;
    playerState.totalPlayed = 0;
    // v1.28.2 : on vide la file de l'ancienne playlist, sinon son affirmation restait affichée au-dessus du rond
    playerState.queue = [];
    playerState.currentIdx = 0;
    playerState.shownAffId = null;
    render();
  });
  document.getElementById('player-settings-btn').addEventListener('click', openPlayerSheet);
  document.getElementById('end-btn')?.addEventListener('click', endPlaybackSession);

  // (Toggle Mode Nuit retiré : géré automatiquement par le mode SATS via switchPlayerMode)

  // Timer de nuit (chips 1h/2h/4h/8h)
  document.querySelectorAll('[data-night-timer]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mins = parseInt(btn.dataset.nightTimer, 10);
      state.settings.nightTimer = mins;
      saveState();
      // Si lecture en cours, relance le timer avec la nouvelle durée
      if (playerState.playing && state.settings.nightMode) {
        startNightTimer();
      }
      renderPlayer();
      toast(t('night_timer_set', { n: mins/60 }));
    });
  });
  document.getElementById('live-speed')?.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    state.settings[pkey('playbackRate')] = v;
    saveState();
    document.getElementById('live-speed-val').textContent = v.toFixed(2) + 'x';
    document.getElementById('aff-audio').playbackRate = v;
  });

  // Chips Repeat / Challenge / SATS
  bindPlayerModeChips();

  // Calcul initial de la taille / scroll du titre
  const np = document.getElementById('now-playing');
  const npText = document.getElementById('np-text');
  if (np && npText) {
    const currentAffNow = playerState.queue[playerState.currentIdx];
    updateNowPlayingTitle(npText.textContent, currentAffNow ? currentAffNow.duration : 0);
  }
}

function getAvailableAffs() {
  const s = state.settings;
  return state.affirmations.filter(a => {
    if (!a.recording) return false;
    if (s.selectedGroupId === 'all') return true;
    return a.groupId === s.selectedGroupId;
  });
}

function togglePlay() {
  if (playerState.playing) {
    pausePlayback();
  } else if (playerState.sessionStart) {
    resumePlayback();
  } else {
    startPlayback();
  }
}

async function startPlayback() {
  logEvent('startPlayback', { mix: !!state.settings.allowMixing, nAffs: getAvailableAffs().length });
  const affs = getAvailableAffs();
  if (affs.length === 0) { toast(t('toast_no_recordings')); return; }
  playerState.queue = affs;
  if (playerState.currentIdx >= affs.length) playerState.currentIdx = 0;
  playerState.playing = true;
  playerState.paused = false;
  playerState.repeatPending = false;
  if (!playerState.sessionStart) {
    playerState.sessionStart = Date.now();
    playerState.totalPlayed = 0;
    resetRepeatClock();
  }
  state.stats.sessionsCount++;
  saveState();
  startMusic();
  // Si mode nuit activé, démarre le timer d'auto-stop
  if (state.settings.nightMode) startNightTimer();
  acquireWakeLock();
  renderPlayer();

  // Nouveau: on construit UN SEUL gros audio concaténé pour toute la queue
  // avec les silences entre, puis audio.loop = true. Comme ça aucun switch
  // de src, aucun gap → Chrome Android ne met jamais l'app en veille.
  const pauseSec = Math.max(0, pget('pauseBetween') || 0);
  // En mode silencieux (bips), pas de buffer concaténé possible: on repasse en mode legacy
  if (pget('silentMode')) { playNext(); return; }
  const url = await buildQueueBuffer(affs, pauseSec);
  if (!url) { playNext(); return; }  // fallback si décodage échoue
  const firstAff = affs[0];
  playerState.shownAffId = firstAff.id;
  updateNowPlayingTitle(firstAff.title, firstAff.duration);
  const stEl = document.getElementById('np-state');
  if (stEl) stEl.textContent = t('playing');

  // MODE MIX : Web Audio au lieu de <audio> (ne pause pas Spotify)
  if (state.settings.allowMixing) {
    if (queueBufferCtx && queueBufferCtx.state === 'suspended') await queueBufferCtx.resume();
    const ok = startMixPlayback(queueBufferAudio, 0, pget('playbackRate') || 1, pget('affVolume') || 1);
    if (ok) { startQueueTick(); return; }
    // Si start web audio échoue, on retombe sur le mode normal
  }

  // MODE NORMAL : élément <audio> HTML
  const audio = document.getElementById('aff-audio');
  audio.src = url;
  audio.loop = true;
  audio.volume = pget('affVolume');
  audio.playbackRate = pget('playbackRate');
  applyNightMode(state.settings.nightMode === true);
  try {
    await audio.play();
    updateMediaSessionMetadata(firstAff, state.ui.playerMode === 'sats' ? 'SATS' : 'Repeat');
    startQueueTick();
  } catch(e) {
    toast(t('toast_play_error'));
    stopPlayback();
  }
}

function pausePlayback() {
  logEvent('pausePlayback_called', { mix: !!mixSourceNode });
  playerState.playing = false;
  playerState.paused = true;
  const audio = document.getElementById('aff-audio');
  audio.pause();
  if (mixSourceNode) pauseMixPlayback();
  if (playerState.pauseTimeout) { clearTimeout(playerState.pauseTimeout); playerState.pauseTimeout = null; }
  stopQueueTick();
  clearNightTimer();
  stopMusic();
  releaseWakeLock();
  renderPlayer();
}

async function resumePlayback() {
  logEvent('resumePlayback_called', { mix: !!state.settings.allowMixing, hasBuffer: !!queueBufferURL });
  // v1.23.0 : si la playlist a changé depuis la pause, on ne reprend pas l'ancien audio
  if (queueBufferURL && queueBufferKey !== queueKeyFor(getAvailableAffs(), Math.max(0, pget('pauseBetween') || 0))) {
    logEvent('resume_stale_queue');
    stopMixPlayback();
    mixPausedPos = 0;
    clearQueueBuffer();
    playerState.currentIdx = 0;
    await startPlayback();
    return;
  }
  playerState.playing = true;
  playerState.paused = false;
  startMusic();
  if (state.settings.nightMode) startNightTimer();
  acquireWakeLock();
  // Mode MIX : on reprend via Web Audio Source Node
  if (state.settings.allowMixing && queueBufferAudio) {
    if (queueBufferCtx && queueBufferCtx.state === 'suspended') await queueBufferCtx.resume();
    if (resumeMixPlayback(queueBufferAudio, pget('playbackRate') || 1, pget('affVolume') || 1)) {
      startQueueTick(); renderPlayer(); return;
    }
  }
  // Si on a toujours notre gros buffer, on reprend juste sa lecture
  // Pas de audio.load() ici : il resettait la position à 0 et faisait
  // sauter d'une aff à chaque pause/play. On reprend juste là où on était.
  const audio = document.getElementById('aff-audio');
  if (queueBufferURL && audio && audio.src && audio.src.includes(queueBufferURL.split('/').pop())) {
    try {
      // Re-applique les settings au cas où
      audio.volume = pget('affVolume');
      audio.playbackRate = pget('playbackRate') || 1;
      audio.loop = true;
      await audio.play();
      // Rafraîchit Media Session pour re-lier le routing audio au casque
      const nowAff = getCurrentQueueAff(audio.currentTime) || playerState.queue[0];
      updateMediaSessionMetadata(nowAff, state.ui.playerMode === 'sats' ? 'SATS' : 'Repeat');
      startQueueTick();
      renderPlayer();
      return;
    } catch(e){}
  }
  // Sinon on redémarre proprement une session
  await startPlayback();
}

function endPlaybackSession() {
  // Garde le compteur de la session comme "dernière session"
  playerState.lastSessionCount = playerState.totalPlayed || 0;
  playerState.totalPlayed = 0;
  playerState.playing = false;
  playerState.paused = false;
  playerState.sessionStart = null;
  playerState.currentIdx = 0;
  resetRepeatClock();
  const audio = document.getElementById('aff-audio');
  audio.pause();
  audio.loop = false;
  audio.currentTime = 0;
  stopMixPlayback();
  mixPausedPos = 0;
  if (playerState.pauseTimeout) { clearTimeout(playerState.pauseTimeout); playerState.pauseTimeout = null; }
  clearQueueBuffer();
  clearNightTimer();
  stopMusic();
  satsSubReset();
  releaseWakeLock();
  renderPlayer();
}

// Alias pour compat avec changement de playlist
function stopPlayback(fully = true) {
  if (fully) {
    endPlaybackSession();
  } else {
    pausePlayback();
  }
}

// ============================================================
// NIGHT MODE : chaîne audio dreamy (low pass + 2 échos qui s'estompent)
// ============================================================
let playerAudioCtx = null;
let playerSource = null;
let playerLowpass = null;
let playerDryGain = null;
let playerDelay1 = null;
let playerDelay1Gain = null;
let playerDelay2 = null;
let playerDelay2Gain = null;
let playerFadeGain = null;
let playerLayerL = null;   // v1.26.0 : voix à gauche
let playerLayerR = null;   // v1.26.0 : voix à droite
let playerSubGain = null;  // v1.26.0 : mode subliminal
let nightTimerHandle = null;
let nightFadeHandle = null;

function ensurePlayerChain() {
  if (playerAudioCtx) return true;
  try {
    const audio = document.getElementById('aff-audio');
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    playerAudioCtx = new Ctx();
    playerSource = playerAudioCtx.createMediaElementSource(audio);

    // Gain master pour fade-out du timer de nuit
    playerFadeGain = playerAudioCtx.createGain();
    playerFadeGain.gain.value = 1;

    // Low pass : bypass par défaut (20kHz)
    playerLowpass = playerAudioCtx.createBiquadFilter();
    playerLowpass.type = 'lowpass';
    playerLowpass.frequency.value = 20000;
    playerLowpass.Q.value = 0.7;

    // Voix principale (dry)
    playerDryGain = playerAudioCtx.createGain();
    playerDryGain.gain.value = 1;

    // Écho 1 : court (250ms), avec feedback léger pour cascade douce
    playerDelay1 = playerAudioCtx.createDelay(2.0);
    playerDelay1.delayTime.value = 0.25;
    playerDelay1Gain = playerAudioCtx.createGain();
    playerDelay1Gain.gain.value = 0;
    // Low pass sur l'écho pour qu'il sonne chaleureux (pas crispy)
    const delay1Filter = playerAudioCtx.createBiquadFilter();
    delay1Filter.type = 'lowpass';
    delay1Filter.frequency.value = 2500;
    // Feedback : l'écho se nourrit lui-même pour cascader doucement
    const delay1Feedback = playerAudioCtx.createGain();
    delay1Feedback.gain.value = 0.35;

    // Écho 2 : plus long (550ms), très diffus
    playerDelay2 = playerAudioCtx.createDelay(2.0);
    playerDelay2.delayTime.value = 0.55;
    playerDelay2Gain = playerAudioCtx.createGain();
    playerDelay2Gain.gain.value = 0;
    const delay2Filter = playerAudioCtx.createBiquadFilter();
    delay2Filter.type = 'lowpass';
    delay2Filter.frequency.value = 2000;

    // Routing dry
    playerSource.connect(playerLowpass);
    playerLowpass.connect(playerDryGain);
    playerDryGain.connect(playerFadeGain);

    // Routing echo 1 avec feedback cascadant
    playerLowpass.connect(playerDelay1);
    playerDelay1.connect(delay1Filter);
    delay1Filter.connect(playerDelay1Gain);
    delay1Filter.connect(delay1Feedback);
    delay1Feedback.connect(playerDelay1); // boucle feedback
    playerDelay1Gain.connect(playerFadeGain);

    // Routing echo 2 (sans feedback, un seul tap diffus)
    playerLowpass.connect(playerDelay2);
    playerDelay2.connect(delay2Filter);
    delay2Filter.connect(playerDelay2Gain);
    playerDelay2Gain.connect(playerFadeGain);

    // v1.26.0 : voix multiples (SATS) : 2 copies décalées, à gauche et à droite
    const mkLayer = (delaySec, pan, lp, hp) => {
      const d = playerAudioCtx.createDelay(2.0);
      d.delayTime.value = delaySec;
      const f = playerAudioCtx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = lp;
      let last = f;
      if (hp) {
        const hf = playerAudioCtx.createBiquadFilter();
        hf.type = 'highpass'; hf.frequency.value = hp;
        f.connect(hf); last = hf;
      }
      const g = playerAudioCtx.createGain();
      g.gain.value = 0;
      last.connect(g);
      let out = g;
      if (playerAudioCtx.createStereoPanner) {
        const pn = playerAudioCtx.createStereoPanner();
        pn.pan.value = pan;
        g.connect(pn); out = pn;
      }
      playerLowpass.connect(d);
      d.connect(f);
      out.connect(playerFadeGain);
      return g;
    };
    playerLayerL = mkLayer(0.6, -0.8, 2600, 0);
    playerLayerR = mkLayer(1.15, 0.8, 4200, 380);

    // v1.26.0 : gain du mode subliminal, après tout le reste
    playerSubGain = playerAudioCtx.createGain();
    playerSubGain.gain.value = 1;
    playerFadeGain.connect(playerSubGain);
    playerSubGain.connect(playerAudioCtx.destination);
    return true;
  } catch(e) {
    console.warn('Night chain init failed', e);
    return false;
  }
}

function applyNightMode(enable) {
  if (!ensurePlayerChain()) return;
  const now = playerAudioCtx.currentTime;
  if (enable) {
    // Voix douce et chaleureuse + échos subtils qui s'étalent
    playerLowpass.frequency.linearRampToValueAtTime(3200, now + 0.5);
    playerDryGain.gain.linearRampToValueAtTime(0.75, now + 0.5);
    playerDelay1Gain.gain.linearRampToValueAtTime(0.22, now + 0.5);  // beaucoup moins fort
    playerDelay2Gain.gain.linearRampToValueAtTime(0.1, now + 0.5);   // juste une touche
  } else {
    playerLowpass.frequency.linearRampToValueAtTime(20000, now + 0.3);
    playerDryGain.gain.linearRampToValueAtTime(1, now + 0.3);
    playerDelay1Gain.gain.linearRampToValueAtTime(0, now + 0.3);
    playerDelay2Gain.gain.linearRampToValueAtTime(0, now + 0.3);
  }
  // v1.26.0 : voix multiples et mode subliminal, seulement en SATS
  const layers = enable && state.ui.playerMode === 'sats' && state.settings.satsLayers !== false;
  [[playerLayerL, 0.42], [playerLayerR, 0.32]].forEach(([g, v]) => {
    if (!g) return;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(layers ? v : 0, now + 0.5);
  });
  if (enable) satsSubStart();
  else if (playerSubGain) {
    playerSubGain.gain.cancelScheduledValues(now);
    playerSubGain.gain.setValueAtTime(1, now);
  }
}

function startNightTimer(ctx = 'player') {
  clearNightTimer();
  const minutes = cfgFor(ctx).nightTimer || 30;
  nightTimerHandle = setTimeout(() => {
    // Fade out progressif sur 15 sec, puis stop
    if (playerAudioCtx && playerFadeGain) {
      const now = playerAudioCtx.currentTime;
      playerFadeGain.gain.linearRampToValueAtTime(0, now + 15);
    }
    // Fade aussi la musique de fond (générative ou fichier)
    if (musicMasterGain && musicCtx) {
      const now = musicCtx.currentTime;
      musicMasterGain.gain.linearRampToValueAtTime(0, now + 15);
    }
    fadeOutMusicFile(15);
    if (satsBgGain && playerAudioCtx) {
      const n2 = playerAudioCtx.currentTime;
      satsBgGain.gain.cancelScheduledValues(n2);
      satsBgGain.gain.setValueAtTime(satsBgGain.gain.value, n2);
      satsBgGain.gain.linearRampToValueAtTime(0, n2 + 15);
    }
    nightFadeHandle = setTimeout(() => {
      // Stoppe le bon contexte selon qui a lancé le timer
      if (ctx === 'challenge') {
        if (state.challenge.playing) stopChallenge();
      } else {
        if (playerState.playing) stopPlayback(false);
      }
      // Restaure le gain pour la session suivante
      if (playerFadeGain && playerAudioCtx) {
        playerFadeGain.gain.value = 1;
      }
    }, 15500);
  }, minutes * 60 * 1000);
}

function clearNightTimer() {
  if (nightTimerHandle) { clearTimeout(nightTimerHandle); nightTimerHandle = null; }
  if (nightFadeHandle) { clearTimeout(nightFadeHandle); nightFadeHandle = null; }
  // Restaure le gain si on avait commencé le fade
  if (playerFadeGain && playerAudioCtx) {
    try {
      playerFadeGain.gain.cancelScheduledValues(playerAudioCtx.currentTime);
      playerFadeGain.gain.value = 1;
    } catch(e){}
  }
}

function playNext() {
  if (!playerState.playing) return;
  const audio = document.getElementById('aff-audio');
  audio.loop = false;  // important: fallback legacy n'utilise pas le loop
  const aff = playerState.queue[playerState.currentIdx];
  if (!aff) return;

  updateNowPlayingTitle(aff.title, aff.duration);
  const stEl = document.getElementById('np-state');
  if (stEl) stEl.textContent = t('playing');

  // Mode silencieux : bip au lieu de la voix (côté Player)
  // Le bip reste court mais on attend la durée RÉELLE de l'aff (ajustée par la vitesse)
  // pour que le rythme corresponde à ce qu'on aurait eu avec la voix.
  if (pget('silentMode')) {
    // Double bip SEULEMENT si plusieurs affs dans la queue ET nouvelle aff
    const isChange = (playerState.currentRepeat || 0) === 0 && (playerState.queue?.length || 0) > 1;
    playBeep(isChange, pget('affVolume'));
    const affDuration = (aff.duration || 3) * 1000; // ms (fallback 3s)
    const rate = pget('playbackRate') || 1;
    const waitMs = Math.max(400, affDuration / rate);
    setTimeout(() => {
      if (!playerState.playing) return;
      handlePlayNextEnd(aff);
    }, waitMs);
    return;
  }

  audio.src = aff.recording;
  audio.volume = pget('affVolume');
  audio.playbackRate = pget('playbackRate');
  // Appliquer le mode nuit si activé
  applyNightMode(state.settings.nightMode === true);
  audio.play().catch(e => { toast(t('toast_play_error')); stopPlayback(); });

  // Media Session (lock screen Android)
  updateMediaSessionMetadata(aff, state.ui.playerMode === 'sats' ? 'SATS' : 'Repeat');

  audio.onended = () => {
    if (!playerState.playing) return;
    handlePlayNextEnd(aff);
  };
}

// Extrait la logique de fin de lecture pour la partager entre audio et bip
function handlePlayNextEnd(aff) {
  if (!playerState.playing) return;

  playerState.totalPlayed++;

  // Track play stats pour l'affirmation qu'on vient de terminer
  trackPlay(aff);

  // Gestion des répétitions : chaque aff peut être répétée N fois de suite
  const repeatTarget = aff.repeatCount || 1;
  if (!playerState.currentRepeat) playerState.currentRepeat = 0;
  playerState.currentRepeat++;
  if (playerState.currentRepeat < repeatTarget) {
    // Rejouer la même aff (ne pas avancer l'index)
  } else {
    playerState.currentRepeat = 0;  // Reset pour la prochaine aff
    playerState.currentIdx++;
    if (playerState.currentIdx >= playerState.queue.length) {
      playerState.currentIdx = 0;
      playerState.loopCount++;
      trackLoop();
    }
  }

  saveState();
  const lc = document.getElementById('loop-counter');
  if (lc) lc.textContent = playerState.loopCount;
  const tc = document.getElementById('total-counter');
  if (tc) tc.textContent = playerState.totalPlayed;

  const stEl2 = document.getElementById('np-state');
  if (stEl2) stEl2.textContent = t('pause_wait', { s: pget('pauseBetween') });

  // Enchaînement : au lieu de setTimeout (throttled en background Android),
  // on joue un audio silencieux de la durée de la pause. L'audio continue
  // → Chrome ne met pas l'app en pause.
  const audio = document.getElementById('aff-audio');
  const pauseSec = Math.max(0, pget('pauseBetween') || 0);
  playSilenceThen(pauseSec, audio, () => {
    if (!playerState.playing) return;
    playNext();
  });
}

// ============================================================
// DEBUG LOG : journal d'événements pour diagnostiquer les arrêts aléatoires
// Accessible via 5 taps sur la version. Stocké dans localStorage, cap 200.
// ============================================================
const DEBUG_LOG_KEY = 'getmanifest_debug_log';
const DEBUG_LOG_MAX = 200;
function logEvent(tag, data) {
  try {
    const entry = { ts: Date.now(), tag, data: data || null };
    const arr = JSON.parse(localStorage.getItem(DEBUG_LOG_KEY) || '[]');
    arr.push(entry);
    while (arr.length > DEBUG_LOG_MAX) arr.shift();
    localStorage.setItem(DEBUG_LOG_KEY, JSON.stringify(arr));
  } catch(e) {}
}
function openDebugLog() {
  const arr = JSON.parse(localStorage.getItem(DEBUG_LOG_KEY) || '[]');
  const lines = arr.map(e => {
    const d = new Date(e.ts);
    const h = String(d.getHours()).padStart(2,'0');
    const m = String(d.getMinutes()).padStart(2,'0');
    const s = String(d.getSeconds()).padStart(2,'0');
    const ms = String(d.getMilliseconds()).padStart(3,'0');
    return `${h}:${m}:${s}.${ms}  ${e.tag}  ${e.data ? JSON.stringify(e.data) : ''}`;
  }).join('\n');
  const text = `GetManifest ✦ Journal (${arr.length} événements)\nVersion : ${APP_VERSION}\nUA : ${navigator.userAgent}\n\n${lines || '(vide)'}`;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;flex-direction:column;padding:20px;color:#fff;font-family:monospace;font-size:11px;';
  overlay.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button id="dbg-copy" style="flex:1;padding:12px;background:#f5b593;color:#000;border:none;border-radius:8px;font-weight:600">Copier le journal</button>

  `;
  document.body.appendChild(overlay);
  overlay.querySelector('textarea').value = text;
  overlay.querySelector('#dbg-copy').onclick = () => {
    navigator.clipboard?.writeText(text).then(() => toast('📋 Copié !')).catch(() => {

    });
  };
  overlay.querySelector('#dbg-clear').onclick = () => {
    localStorage.removeItem(DEBUG_LOG_KEY);
    overlay.remove();
