  overlay.querySelector('#dbg-close').onclick = () => overlay.remove();
}

// ============================================================
// SILENCE AUDIO (évite les setTimeout throttled en background)
// On génère un WAV silencieux de la durée demandée, et on le joue sur
// l'élément audio principal. Comme ça il y a TOUJOURS un audio en cours,
// Chrome Android ne met pas l'app en pause.
// ============================================================
const silenceURLs = {};
function makeSilenceURL(seconds) {
  const key = seconds.toFixed(1);
  if (silenceURLs[key]) return silenceURLs[key];
  const sampleRate = 8000;
  const samples = Math.max(1, Math.floor(seconds * sampleRate));
  const buffer = new ArrayBuffer(44 + samples * 2);
  const view = new DataView(buffer);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + samples * 2, true);
  writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeStr(36, 'data'); view.setUint32(40, samples * 2, true);
  // Les samples sont 0 par défaut (silence)
  const blob = new Blob([buffer], { type: 'audio/wav' });
  silenceURLs[key] = URL.createObjectURL(blob);
  return silenceURLs[key];
}

// Joue un silence de X secondes puis callback. Permet d'enchaîner les affs
// sans setTimeout → l'audio continue en background sans throttle.
function playSilenceThen(seconds, audioEl, onEnd) {
  if (!audioEl || seconds <= 0.05) { onEnd(); return; }
  try {
    audioEl.src = makeSilenceURL(seconds);
    audioEl.volume = 0;
    audioEl.playbackRate = 1.0;
    const done = () => { audioEl.volume = state.challenge.playing ? cfgFor('challenge').affVolume : pget('affVolume'); onEnd(); };
    audioEl.onended = done;
    audioEl.play().catch(() => done());
  } catch(e) { onEnd(); }
}

// ============================================================
// QUEUE BUFFER : construit un gros audio concaténé pour la session
// Toutes les affs + silences entre sont fusionnées en UN SEUL fichier.
// audio.src pointe sur ce buffer, audio.loop = true → aucun gap, aucun switch
// de src. Chrome Android / iOS ne peuvent pas mettre en pause car l'audio
// tourne en continu au niveau système, même JS totalement gelé en background.
// ============================================================
let queueBufferURL = null;        // Blob URL du gros audio concaténé
let queueBufferDuration = 0;      // durée totale en secondes
let queueBufferSegments = [];     // [{affId, startSec, endSec, affDuration}, ...]
let queueBufferCtx = null;        // AudioContext dédié pour décoder
let lastQueueBufferTime = 0;      // suivi currentTime pour détecter fin d'aff en background
let queueBufferKey = null;        // Empreinte de la liste qui a servi à construire le gros audio
let queueBufferAudio = null;      // AudioBuffer gardé en RAM pour le mode "mix avec Spotify"
// === MIX MODE : Web Audio AudioBufferSource au lieu de <audio> element ===
let mixSourceNode = null;         // AudioBufferSourceNode courant
let mixGainNode = null;           // GainNode pour volume
let mixStartedAt = 0;             // audioContext.currentTime au moment du start
let mixOffset = 0;                // position dans le buffer quand on a start
let mixPausedPos = 0;             // position sauvegardée à la pause
let mixDuration = 0;              // durée du buffer actif en mix
function getMixCurrentTime() {
  if (!queueBufferCtx || !mixSourceNode) return mixPausedPos;
  return (queueBufferCtx.currentTime - mixStartedAt + mixOffset) % Math.max(0.001, mixDuration);
}

// Décode un dataURL/blobURL en AudioBuffer via AudioContext
async function decodeAffToBuffer(aff, ctx) {
  const res = await fetch(aff.recording);
  const arr = await res.arrayBuffer();
  return await ctx.decodeAudioData(arr);
}

// Encode un AudioBuffer en WAV Blob (PCM 16 bits)
function audioBufferToWavBlob(buffer) {
  const nChan = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const nSamples = buffer.length;
  const bitsPerSample = 16;
  const bytesPerSample = bitsPerSample / 8;
  const blockAlign = nChan * bytesPerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = nSamples * blockAlign;
  const bufOut = new ArrayBuffer(44 + dataSize);
  const view = new DataView(bufOut);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, nChan, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);
  // Interleave channels + convert float to int16
  let offset = 44;
  const channels = [];
  for (let c = 0; c < nChan; c++) channels.push(buffer.getChannelData(c));
  for (let i = 0; i < nSamples; i++) {
    for (let c = 0; c < nChan; c++) {
      let s = Math.max(-1, Math.min(1, channels[c][i]));
      s = s < 0 ? s * 0x8000 : s * 0x7FFF;
      view.setInt16(offset, s, true);
      offset += 2;
    }
  }
  return new Blob([bufOut], { type: 'audio/wav' });
}

// Resample + downmix mono pour réduire mémoire (évite crash Chrome Android)
// Voix est très bien à 24kHz mono. 48kHz stéréo prenait 4x plus de RAM.
const BUFFER_TARGET_RATE = 24000;
function resampleAndMonoize(buf, targetRate) {
  const srcRate = buf.sampleRate;
  const srcLen = buf.length;
  const nChan = buf.numberOfChannels;
  const ratio = srcRate / targetRate;
  const outLen = Math.floor(srcLen / ratio);
  const out = new Float32Array(outLen);
  // Downmix channels to mono tout en resample linéaire simple
  const chans = [];
  for (let c = 0; c < nChan; c++) chans.push(buf.getChannelData(c));
  for (let i = 0; i < outLen; i++) {
    const srcIdx = Math.floor(i * ratio);
    let sum = 0;
    for (let c = 0; c < nChan; c++) sum += chans[c][srcIdx] || 0;
    out[i] = sum / nChan;
  }
  return out;
}

// Construit le gros buffer concaténé pour la queue courante.
// Retourne l'URL du blob (ou null si erreur/non supporté).
async function buildQueueBuffer(queue, pauseSec) {
  try {
    if (!queue || queue.length === 0) return null;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { logEvent('audioCtx_unsupported'); return null; }
    if (!queueBufferCtx) {
      queueBufferCtx = new Ctx();
      queueBufferCtx.addEventListener('statechange', () => {
        logEvent('audioCtx_state', { state: queueBufferCtx.state, playing: playerState.playing, chPlaying: state.challenge.playing });
        scheduleInterruptCheck('ctx_' + queueBufferCtx.state);
      });
      logEvent('audioCtx_created', { sr: queueBufferCtx.sampleRate, state: queueBufferCtx.state });
    }
    // On décode toutes les affs vers mono + 24kHz pour minimiser la RAM
    const affSegs = [];  // {aff, mono: Float32Array}
    for (const aff of queue) {
      if (!aff.recording) continue;
      try {
        const buf = await decodeAffToBuffer(aff, queueBufferCtx);
        const mono = resampleAndMonoize(buf, BUFFER_TARGET_RATE);
        const repeat = Math.max(1, aff.repeatCount || 1);
        for (let r = 0; r < repeat; r++) affSegs.push({ aff, mono });
      } catch(e) {
        console.warn('Décodage aff échoué :', aff.title, e);
      }
    }
    if (affSegs.length === 0) return null;
    const sampleRate = BUFFER_TARGET_RATE;
    const silenceSamples = Math.max(1, Math.floor(pauseSec * sampleRate));
    let totalSamples = 0;
    for (const { mono } of affSegs) totalSamples += mono.length + silenceSamples;
    // Buffer mono
    const out = queueBufferCtx.createBuffer(1, totalSamples, sampleRate);
    const chan = out.getChannelData(0);
    queueBufferSegments = [];
    let cursor = 0;
    for (const { aff, mono } of affSegs) {
      chan.set(mono, cursor);
      const affStart = cursor / sampleRate;
      const affEnd = (cursor + mono.length) / sampleRate;
      queueBufferSegments.push({ affId: aff.id, startSec: affStart, endSec: affEnd });
      cursor += mono.length + silenceSamples;
    }
    queueBufferDuration = out.length / sampleRate;
    queueBufferKey = queueKeyFor(queue, pauseSec);
    queueBufferAudio = out;  // Garde en RAM pour le mode mix (Web Audio Source Node)
    const blob = audioBufferToWavBlob(out);
    if (queueBufferURL) URL.revokeObjectURL(queueBufferURL);
    queueBufferURL = URL.createObjectURL(blob);
    return queueBufferURL;
  } catch(e) {
    console.warn('buildQueueBuffer failed', e);
    return null;
  }
}

// === Helpers mix mode (Web Audio au lieu de <audio> element) ===
// Joue un AudioBuffer en loop via AudioBufferSourceNode. Android/iOS
// traitent ça comme "communication/game" audio → ça ne pause pas Spotify.
function startMixPlayback(bufferAudio, offsetSec = 0, playbackRate = 1, volume = 1) {
  if (!bufferAudio || !queueBufferCtx) { logEvent('mix_start_fail', { reason: 'no buffer or ctx' }); return false; }
  stopMixPlayback();
  try {
    mixSourceNode = queueBufferCtx.createBufferSource();
    mixSourceNode.buffer = bufferAudio;
    mixSourceNode.loop = true;
    mixGainNode = queueBufferCtx.createGain();
    mixGainNode.gain.value = volume;
    if (state.ui.playerMode === 'sats') satsSubApply(mixGainNode.gain, queueBufferCtx, volume);
    mixSourceNode.playbackRate.value = playbackRate;
    mixSourceNode.connect(mixGainNode);
    mixGainNode.connect(queueBufferCtx.destination);
    mixOffset = offsetSec;
    mixStartedAt = queueBufferCtx.currentTime;
    mixDuration = bufferAudio.length / bufferAudio.sampleRate;
    mixSourceNode.onended = () => { logEvent('mix_source_ended_UNEXPECTED', { ctState: queueBufferCtx.state }); };
    mixSourceNode.start(0, offsetSec);
    logEvent('mix_start_ok', { offset: offsetSec.toFixed(1), dur: mixDuration.toFixed(1), ctState: queueBufferCtx.state });
    return true;
  } catch(e) { logEvent('mix_start_fail', { msg: String(e && e.message) }); return false; }
}
function stopMixPlayback() {
  if (mixSourceNode) {
    try { mixSourceNode.stop(); } catch(e){}
    try { mixSourceNode.disconnect(); } catch(e){}
    mixSourceNode = null;
  }
  if (mixGainNode) {
    try { mixGainNode.disconnect(); } catch(e){}
    mixGainNode = null;
  }
}
function pauseMixPlayback() {
  mixPausedPos = getMixCurrentTime();
  stopMixPlayback();
}
function resumeMixPlayback(bufferAudio, playbackRate = 1, volume = 1) {
  return startMixPlayback(bufferAudio, mixPausedPos, playbackRate, volume);
}

// Scanne audio.currentTime pour détecter la fin d'une aff (pour les stats).
// Marche en foreground (setInterval); en background on recalcule au retour
// en utilisant wallclock pour estimer les loops complets manqués.
let queueTickInterval = null;
let lastQueueTickWall = 0;
// Retourne la position actuelle dans le buffer (0..duration), selon le mode
function getQueuePlaybackTime() {
  if (mixSourceNode) return getMixCurrentTime();
  const audio = document.getElementById('aff-audio');
  return audio ? audio.currentTime : 0;
}
function startQueueTick() {
  stopQueueTick();
  lastQueueBufferTime = getQueuePlaybackTime();
  lastQueueTickWall = Date.now();
  queueTickInterval = setInterval(() => {
    if (!playerState.playing || !queueBufferURL) return;
    const t = getQueuePlaybackTime();
    const nowWall = Date.now();
    processQueueProgress(lastQueueBufferTime, t, nowWall - lastQueueTickWall);
    lastQueueBufferTime = t;
    lastQueueTickWall = nowWall;
  }, 500);
}
function stopQueueTick() {
  if (queueTickInterval) { clearInterval(queueTickInterval); queueTickInterval = null; }
}

// Pour chaque aff dont l'endSec tombe entre prev et curr (avec wrap), on trackPlay
// wallDeltaMs: temps écoulé en temps réel depuis le dernier tick (pour détecter
// les loops complets manqués pendant un long background).
let lastQueueSaveWall = 0;
function processQueueProgress(prev, curr, wallDeltaMs) {
  if (!queueBufferSegments.length || queueBufferDuration <= 0) return;
  const dur = queueBufferDuration;
  const rate = pget('playbackRate') || 1;
  const expectedDelta = ((wallDeltaMs || 0) / 1000) * rate;
  // Nombre de loops complets manqués, CAPÉ pour éviter runaway (crash)
  let fullLoops = 0;
  if (expectedDelta > dur) fullLoops = Math.min(500, Math.floor(expectedDelta / dur));
  // Loops complets : batch update pour pas spammer trackPlay en boucle (crash risk)
  if (fullLoops > 0) {
    const nSegs = queueBufferSegments.length;
    const totalEnds = fullLoops * nSegs;
    playerState.totalPlayed += totalEnds;
    // trackPlay une seule fois par aff unique, en incrémentant par le compte
    const affCounts = {};
    queueBufferSegments.forEach(seg => { affCounts[seg.affId] = (affCounts[seg.affId] || 0) + fullLoops; });
    Object.keys(affCounts).forEach(affId => {
      const aff = state.affirmations.find(x => x.id === affId);
      if (aff) trackPlayN(aff, affCounts[affId]);
    });
    // loopCount : nombre de fois qu'on repasse par le 1er segment
    const queueLen = Math.max(1, playerState.queue.length);
    const loopsAdded = Math.floor(totalEnds / queueLen);
    playerState.loopCount += loopsAdded;
    playerState.currentIdx = (playerState.currentIdx + totalEnds) % queueLen;
  }
  // Traitement du wrap partiel (segment incomplet actuel)
  const mod = (x) => ((x % dur) + dur) % dur;
  const a = mod(prev), b = mod(curr);
  const checkRange = (lo, hi) => {
    queueBufferSegments.forEach((seg) => {
      if (seg.endSec > lo && seg.endSec <= hi) {
        const aff = state.affirmations.find(x => x.id === seg.affId);
        if (!aff) return;
        trackPlay(aff);
        playerState.totalPlayed++;
        playerState.currentIdx = (playerState.currentIdx + 1) % Math.max(1, playerState.queue.length);
        if (playerState.currentIdx === 0) { playerState.loopCount++; trackLoop(); }
      }
    });
  };
  if (b >= a) checkRange(a, b);
  else { checkRange(a, dur); checkRange(0, b); }
  // Update UI counters
  const lc = document.getElementById('loop-counter');
  if (lc) lc.textContent = playerState.loopCount;
  const tc = document.getElementById('total-counter');
  if (tc) tc.textContent = playerState.totalPlayed;
  // Update now-playing title
  const nowAff = getCurrentQueueAff(curr);
  if (nowAff) playerState.shownAffId = nowAff.id;
  if (nowAff) {
    const npText = document.getElementById('np-text');
    if (npText && npText.textContent !== nowAff.title) updateNowPlayingTitle(nowAff.title, nowAff.duration);
  }
  // Throttle saveState : max 1 write toutes les 5s
  // (sinon on freeze l'app en sérialisant state à chaque tick 500ms)
  const nowWall = Date.now();
  if (nowWall - lastQueueSaveWall > 5000) {
    saveState();
    lastQueueSaveWall = nowWall;
  }
}

// trackPlay batch (N occurrences d'un coup) pour éviter N appels séparés
function trackPlayN(aff, n) {
  if (!n || n <= 0) return;
  // Factorise la logique de trackPlay pour un incrément de N
  for (let i = 0; i < Math.min(n, 10); i++) trackPlay(aff);  // Cap trackPlay aussi
  // Pour un n énorme, on se contente d'incrémenter stats.totalPlays directement
  if (n > 10) {
    const bulk = n - 10;
    if (state.stats) {
      state.stats.totalPlays = (state.stats.totalPlays || 0) + bulk;
      const today = todayKey();
      if (!state.stats.byDay) state.stats.byDay = {};
      if (!state.stats.byDay[today]) state.stats.byDay[today] = { plays: 0, loops: 0, seconds: 0 };
      state.stats.byDay[today].plays += bulk;
    }
  }
}

function getCurrentQueueAff(timeSec) {
  if (!queueBufferSegments.length) return null;
  const dur = queueBufferDuration;
  const t = ((timeSec % dur) + dur) % dur;
  for (const seg of queueBufferSegments) {
    if (t >= seg.startSec && t < seg.endSec) {
      return state.affirmations.find(a => a.id === seg.affId);
    }
  }
  // Dans un silence inter-aff : renvoie la dernière aff jouée
  for (let i = queueBufferSegments.length - 1; i >= 0; i--) {
    if (queueBufferSegments[i].endSec <= t) return state.affirmations.find(a => a.id === queueBufferSegments[i].affId);
  }
  return null;
}

// Nettoie le buffer de la queue (session terminée)
// Empreinte d'une liste : si elle change (playlist, voix, répétitions, pause), l'ancien audio n'est plus bon
function queueKeyFor(affs, pauseSec) {
  return (affs || []).map(a => a.id + ':' + (a.repeatCount || 1) + ':' + (a.recording ? a.recording.length : 0)).join(',') + '|' + pauseSec;
}

function clearQueueBuffer() {
  stopQueueTick();
  playerState.shownAffId = null;
  queueBufferKey = null;
  if (queueBufferURL) { try { URL.revokeObjectURL(queueBufferURL); } catch(e){} queueBufferURL = null; }
  queueBufferAudio = null;  // libère la RAM
  queueBufferSegments = [];
  queueBufferDuration = 0;
  lastQueueBufferTime = 0;
}

// Quand l'onglet revient visible, rattrape les stats depuis la dernière mesure
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && playerState.playing && queueBufferURL) {
    const t = getQueuePlaybackTime();
    const nowWall = Date.now();
    processQueueProgress(lastQueueBufferTime, t, nowWall - lastQueueTickWall);
    lastQueueBufferTime = t;
    lastQueueTickWall = nowWall;
  }
});

// ============================================================
// MEDIA SESSION API (contrôles lock screen + background Android)
// ============================================================
function updateMediaSessionMetadata(aff, modeLabel) {
  if (!('mediaSession' in navigator)) return;
  try {
    if (aff) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: aff.title || 'Affirmation',
        artist: 'GetManifest ✦',
        album: modeLabel || 'Repeat',
      });
    }
    navigator.mediaSession.playbackState = (playerState.playing || state.challenge.playing) ? 'playing' : 'paused';
  } catch(e) {}
}

function setupMediaSessionHandlers() {
  if (!('mediaSession' in navigator)) return;
  const h = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch(e){} };
  h('play', () => {
    if (currentTab !== 'player') return;
    const mode = (state.ui && state.ui.playerMode) || 'repeat';
    if (mode === 'challenge') {
      if (!state.challenge.playing) startChallenge();
    } else {
      if (!playerState.playing) {
        if (playerState.sessionStart) resumePlayback(); else startPlayback();
      }
    }
    updateMediaSessionMetadata(null, null);
  });
  h('pause', () => {
    if (playerState.playing) pausePlayback();
    else if (state.challenge.playing) stopChallenge();
    updateMediaSessionMetadata(null, null);
  });
  h('stop', () => {
    if (playerState.playing) pausePlayback();
    else if (state.challenge.playing) stopChallenge();
  });
  // iOS Safari attend ces actions sinon il affiche pas les contrôles proprement
  // On les désactive (null) pour cacher le skip ±15s qu'on ne gère pas vraiment
  h('seekbackward', null);
  h('seekforward', null);
  h('previoustrack', null);
  h('nexttrack', null);
}

// ============================================================
// SCREEN WAKE LOCK (empêche le verrouillage auto pendant un récap)
// Marche sur iOS 16.4+ et Chrome Android. Si l'utilisateur appuie
// quand même sur le bouton power, le fix silence + Media Session prend
// le relais pour continuer la lecture.
// ============================================================
let wakeLockSentinel = null;
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) { logEvent('wakelock_unsupported'); return; }
  try {
    if (wakeLockSentinel && !wakeLockSentinel.released) return;
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    logEvent('wakelock_acquired');
    wakeLockSentinel.addEventListener('release', () => { logEvent('wakelock_released_by_system'); wakeLockSentinel = null; });
  } catch(e) { logEvent('wakelock_refused', { msg: String(e && e.message) }); }
}
async function releaseWakeLock() {
  try {
    if (wakeLockSentinel && !wakeLockSentinel.released) {
      await wakeLockSentinel.release();
      logEvent('wakelock_released_manually');
    }
  } catch(e) {}
  wakeLockSentinel = null;
}
// Si l'onglet revient au 1er plan pendant une lecture, on ré-acquiert
// (iOS/Android relâchent automatiquement le wake lock quand on quitte l'onglet)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (playerState.playing || state.challenge.playing)) {
    acquireWakeLock();
  }
});

// ============================================================
// MUSIC (drone + playlist)
// ============================================================
// ============================================================
// AMBIANCES SONORES génératives
// ============================================================
let musicCtx = null;
let musicNodes = [];
let musicMasterGain = null;
let musicLFOs = [];

const AMBIANCES = {
  healing: { name: '🌸 Healing Touch', color: '#f0a0a8', file: 'audio/healing-touch.mp3' },
  clouds: { name: '☁️ From the Clouds', color: '#d4e5f0', file: 'audio/from-the-clouds.mp3' },
};

// Audio element pour les ambiances fichier (healing, clouds...)
let musicFileAudio = null;
let musicFileFadeInterval = null;

// activeAudioCtx = 'player' ou 'challenge' : indique quel contexte a lancé la musique en cours
let activeAudioCtx = 'player';

// Helper : récupère les paramètres audio du contexte (player ou challenge)
// v1.23.0 : SATS a ses propres réglages (voix, vitesse, pause, silencieux), à part de Repeat
const SATS_KEYS = { affVolume: 'satsAffVolume', playbackRate: 'satsPlaybackRate', pauseBetween: 'satsPauseBetween', silentMode: 'satsSilentMode' };
function pkey(k) { return (state.ui.playerMode === 'sats' && SATS_KEYS[k]) ? SATS_KEYS[k] : k; }
function pget(k) { if (k === 'playbackRate' && state.ui.playerMode === 'sats') return 1;  // v1.27.4 : SATS toujours à 1x
  const v = state.settings[pkey(k)]; return (v === undefined || v === null) ? state.settings[k] : v; }

function cfgFor(ctx) {
  const s = state.settings;
  if (ctx === 'challenge') {
    return {
      affVolume: s.chAffVolume ?? s.affVolume,
      musicVolume: s.chMusicVolume ?? s.musicVolume,
      playbackRate: s.chPlaybackRate ?? s.playbackRate,
      pauseBetween: s.chPauseBetween ?? s.pauseBetween,
      musicMode: s.chMusicMode ?? s.musicMode,
      ambianceId: s.chAmbianceId ?? s.ambianceId,
      silentMode: s.chSilentMode ?? false,
      nightMode: s.chNightMode ?? false,
      nightTimer: s.chNightTimer ?? 60,
    };
  }

  } catch(e) { console.warn('beep error', e); }
}

      <button type="button" class="btn-primary celebrate-ok">${escapeHtml(texts.btn)}</button>
    </div>`;
  document.body.appendChild(el);
  try { if (navigator.vibrate) navigator.vibrate([120, 80, 120, 80, 260]); } catch(e) {}
  el.querySelector('.celebrate-ok').addEventListener('click', () => { el.remove(); celebrateNext(); });
}

// Félicitations du Challenge : la moitié, chaque palier de 10K, et l'objectif atteint (une seule fenêtre par ajout)
function celebrateMilestoneIfReached(oldCount, newCount) {
  const target = state.challenge.target || 10000;
  if (oldCount < target && newCount >= target) { celebrate('challenge', { target: fmtN(target) }); return; }
  const half = Math.floor(target / 2);
  if (oldCount < half && newCount >= half) { celebrate('half', { n: fmtN(half), target: fmtN(target) }); return; }
  const milestones = [10000, 20000, 30000, 40000, 50000];
  for (const m of milestones) {
    if (m < target && oldCount < m && newCount >= m) {
      celebrate('milestone', { n: fmtN(m) });
      break;  // Un seul palier par ajout
    }
  }
}

// Enregistre la complétion d'un challenge dans les stats
function recordChallengeCompletion() {
  if (!state.stats.completedChallenges) state.stats.completedChallenges = [];
  // Snapshot des titres des affs pour garder l'info même si elles sont supprimées plus tard
  const affIds = [...(state.challenge.affirmationIds || [])];
  const affTitles = affIds.map(id => {
    const a = state.affirmations.find(x => x.id === id);
    return a ? a.title : '(supprimée)';
  });
  state.stats.completedChallenges.push({
    target: state.challenge.target,
    startedAt: state.challenge.startedAt,
    completedAt: Date.now(),
    affirmationIds: affIds,
    affirmationTitles: affTitles,  // Snapshot pour conservation à long terme
  });
  saveState();
}

function stopAmbiance() {
  // Stop le fichier audio s'il tourne
  if (musicFileAudio) {
    try { musicFileAudio.pause(); } catch(e){}
    musicFileAudio = null;
  }
  if (musicFileFadeInterval) {
    clearInterval(musicFileFadeInterval);
    musicFileFadeInterval = null;
  }

  // Stop la chaîne Web Audio générative
  musicLFOs.forEach(lfo => { try { lfo.stop(); } catch(e){} });
  musicLFOs = [];
  musicNodes.forEach(n => {
    try {
      if (n.gain) {
        n.gain.gain.setValueAtTime(n.gain.gain.value, musicCtx.currentTime);
        n.gain.gain.linearRampToValueAtTime(0, musicCtx.currentTime + 0.4);
      }
      if (n.osc) n.osc.stop(musicCtx.currentTime + 0.5);
      if (n.source) try { n.source.stop(musicCtx.currentTime + 0.5); } catch(e){}
    } catch(e){}
  });
  musicNodes = [];
  if (musicCtx) {
    const ctx = musicCtx;
    musicCtx = null;
    setTimeout(() => { try { ctx.close(); } catch(e){} }, 700);
  }
}

function updateMusicVolume() {
  // Prend le volume du contexte actif (player ou challenge)
  const vol = cfgFor(activeAudioCtx).musicVolume;
  if (musicMasterGain && musicCtx) {
    try { musicMasterGain.gain.value = vol * 0.4; } catch(e){}
  }
  if (musicFileAudio) {
    try { musicFileAudio.volume = vol * 0.5; } catch(e){}
  }
}

// Fade out progressif du fichier audio (pour le timer du mode nuit)
function fadeOutMusicFile(seconds) {
  if (!musicFileAudio) return;
  const startVol = musicFileAudio.volume;
  const steps = 60;
  const stepMs = (seconds * 1000) / steps;
  let i = 0;
  if (musicFileFadeInterval) clearInterval(musicFileFadeInterval);
  musicFileFadeInterval = setInterval(() => {
    i++;
    if (!musicFileAudio) { clearInterval(musicFileFadeInterval); return; }
    const t = i / steps;
    musicFileAudio.volume = Math.max(0, startVol * (1 - t));
    if (i >= steps) clearInterval(musicFileFadeInterval);
  }, stepMs);
}

// Alias pour compat
function updateDroneVolume() { updateMusicVolume(); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Met à jour l'ETA du challenge en live (sans re-render complet)
function updateChallengeEtaLive() {
  // Nouveau sélecteur en priorité (orb), fallback sur l'ancien
  const el = document.getElementById('ch-eta-top') || document.querySelector('.challenge-eta');
  if (!el) return;
  const c = state.challenge;
  const cfg = cfgFor('challenge');
  const selectedAffs = (c.affirmationIds || [])
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  const remaining = Math.max(0, c.target - c.count);
  el.innerHTML = estimateChallengeTime(selectedAffs, remaining, cfg.playbackRate, cfg.pauseBetween);
}

// Anime le titre de l'aff courante : fade out → changement → fade in avec glow
// Appelé quand une NOUVELLE aff démarre dans le Challenge
function animateCurrentAff(title) {
  const el = document.getElementById('orb-current-aff');
  if (!el) return;
  // Si c'est le même texte, on ne fait rien (évite les flashes inutiles)
  if (el.textContent.trim() === title.trim()) return;

  }, 350);
}

// Met à jour les éléments de l'orbe (compteur, pct, remaining, ring)
// Appelé après chaque tick (lecture ou ajout manuel) pour éviter un re-render complet
function updateChallengeOrbUI() {
  const c = state.challenge;
  const RING_R = 110;
  const RING_C = 2 * Math.PI * RING_R;
  const pct = Math.min(100, (c.count / c.target) * 100);
  const remaining = Math.max(0, c.target - c.count);

  const countEl = document.querySelector('.ch-orb-count');
  if (countEl) countEl.textContent = fmtN(c.count);

  }

// Estime le temps restant du challenge basé sur la durée moyenne des affs,
// la vitesse de lecture et le temps de pause entre chaque
function estimateChallengeTime(selectedAffs, remaining, rate, pauseBetween) {
  if (remaining <= 0) return '🎉 Objectif atteint !';
  // Récupérer les durées valides
  const durations = selectedAffs.map(a => a.duration || 0).filter(d => d > 0);
  if (durations.length === 0) return '<em>Enregistre tes affs pour voir l\'estimation</em>';
  const avgDuration = durations.reduce((a, b) => a + b, 0) / durations.length;
  // Temps pour UN cycle d'affirmation (lecture + pause)
  const secPerAff = (avgDuration / (rate || 1)) + (pauseBetween || 0);
  const totalSec = secPerAff * remaining;

  // Formater en jours/heures/minutes
  let label;
  if (totalSec < 60) {
    label = `${Math.round(totalSec)}s`;
  } else if (totalSec < 3600) {
    label = `${Math.round(totalSec / 60)} min`;
  } else if (totalSec < 86400) {
    const h = Math.floor(totalSec / 3600);
    const m = Math.round((totalSec % 3600) / 60);
    label = m > 0 ? `${h}h ${m}min` : `${h}h`;
  } else {
    const d = Math.floor(totalSec / 86400);
    const h = Math.round((totalSec % 86400) / 3600);
    label = h > 0 ? `${d}j ${h}h` : `${d}j`;
  }
  return `⏱️ Encore ~<strong>${label}</strong> de lecture à ${rate.toFixed(2)}x`;
}

function formatChallengeDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const lang = state.settings.language || detectBrowserLang();
  const months = {
    fr: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'],
    en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  };
  const ms = months[lang] || months.fr;
  return `${d.getDate()} ${ms[d.getMonth()]} ${d.getFullYear()}`;
}

function trackPlay(aff) {
  if (!aff) return;
  const key = todayKey();
  const s = state.stats;

  // byDay
  if (!s.byDay[key]) s.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
  s.byDay[key].plays++;
  s.byDay[key].seconds += Math.round(aff.duration || 0);

  // byAffirmation
  if (!s.byAffirmation[aff.id]) s.byAffirmation[aff.id] = { plays: 0, lastPlayed: 0 };
  s.byAffirmation[aff.id].plays++;
  s.byAffirmation[aff.id].lastPlayed = Date.now();

  // byPlaylist
  if (aff.groupId) {
    if (!s.byPlaylist[aff.groupId]) s.byPlaylist[aff.groupId] = { plays: 0 };
    s.byPlaylist[aff.groupId].plays++;
  }

  // globals
  s.totalPlays++;
  s.totalSeconds += Math.round(aff.duration || 0);

  // best day
  if (s.byDay[key].plays > s.bestDay.plays) {
    s.bestDay = { date: key, plays: s.byDay[key].plays };
  }

  // streak
  updateStreak();

  saveState();
}

function trackLoop() {
  const key = todayKey();
  if (!state.stats.byDay[key]) state.stats.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
  state.stats.byDay[key].loops++;
  state.stats.totalLoops++;
  saveState();
}

function updateStreak() {
  const s = state.stats;
  const today = todayKey();
  if (s.lastActiveDay === today) return; // déjà compté aujourd'hui

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  if (s.lastActiveDay === yKey) {
    s.streak++;
  } else if (!s.lastActiveDay) {
    s.streak = 1;
  } else {
    s.streak = 1; // reset
  }
  s.lastActiveDay = today;
}

function timeAgo(ts) {
  if (!ts) return t('stats_never_played');
  const now = Date.now();
  const diff = Math.floor((now - ts) / 1000);
  if (diff < 60) return t('stats_just_now');
  if (diff < 3600) return t('stats_mins_ago', { n: Math.floor(diff/60) });
  if (diff < 86400) return t('stats_hours_ago', { n: Math.floor(diff/3600) });
  const days = Math.floor(diff/86400);
  if (days === 0) return t('stats_today_short');
  return t('stats_days_ago', { n: days });
}

function previewAff(aff) {
  // Utilise un audio dédié pour éviter d'interférer avec le player principal
  // (qui peut être en loop = true sur un gros buffer de session)
  playPreviewRobust(aff.recording, state.settings.affVolume, 'previewAff');
}

// Helper robuste pour jouer un enregistrement (dataURL base64)
// - Un seul preview à la fois (clicks multiples ne s'empilent pas)
// - Convertit le dataURL en Blob URL (plus rapide à charger sur Android)
// - Attend canplaythrough avant play
// - Log détaillé si erreur, pour diagnostiquer "Erreur de lecture"
let _activePreviewAudio = null;
function stopActivePreview() {
  if (_activePreviewAudio) {
    try { _activePreviewAudio.pause(); } catch(e){}
    try { _activePreviewAudio.src = ''; _activePreviewAudio.load(); } catch(e){}
    _activePreviewAudio = null;
  }
}
async function playPreviewRobust(dataURL, volume, source) {
  logEvent('preview_start', { source, urlStart: String(dataURL).slice(0, 40), len: String(dataURL).length });
  // Coupe le preview précédent (évite empilement sur clics répétés)
  stopActivePreview();
  try {
    // Convertit dataURL → Blob URL (Chrome Android gère mieux)
    let srcToPlay = dataURL;
    try {
      const resp = await fetch(dataURL);
      const blob = await resp.blob();
      srcToPlay = URL.createObjectURL(blob);
      logEvent('preview_blobURL_ok', { source, type: blob.type, size: blob.size });
    } catch(e) {
      logEvent('preview_blobURL_fail', { source, msg: String(e && e.message) });
    }
    const preview = new Audio();
    _activePreviewAudio = preview;
    preview.volume = volume;
    preview.playbackRate = 1.0;
    preview.preload = 'auto';
    preview.onerror = () => {
      logEvent('preview_audio_error', { source, code: preview.error && preview.error.code, msg: preview.error && preview.error.message });
      toast(t('toast_play_error'));
    };
    preview.onended = () => { if (_activePreviewAudio === preview) _activePreviewAudio = null; };
    preview.oncanplaythrough = () => {
      if (_activePreviewAudio !== preview) return;  // un autre preview a pris le dessus
      preview.play().then(() => {
        logEvent('preview_play_ok', { source });
      }).catch(err => {
        logEvent('preview_play_reject', { source, name: err && err.name, msg: err && err.message });
        toast(t('toast_play_error'));
      });
    };
    preview.src = srcToPlay;
    preview.load();
    // Fallback: après 2s sans canplaythrough, try play quand même
    setTimeout(() => {
      if (_activePreviewAudio !== preview) return;
      if (preview.paused && !preview.error) {
        logEvent('preview_fallback_play', { source, readyState: preview.readyState });
        preview.play().catch(err => {
          logEvent('preview_fallback_reject', { source, name: err && err.name, msg: err && err.message });
          toast(t('toast_play_error'));
        });
      }
    }, 2000);
  } catch(e) {
    logEvent('preview_exception', { source, msg: String(e && e.message) });
    toast(t('toast_play_error'));
  }
}

  document.body.appendChild(overlay);

  const bindRange = (id, key, format) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      state.settings[pkey(key)] = v;
      saveState();
      document.getElementById('ps-val-' + id.replace('ps-', '')).textContent = format(v);
      if (key === 'musicVolume') updateDroneVolume();
      if (key === 'affVolume') {
        document.getElementById('aff-audio').volume = v;
        if (mixGainNode) mixGainNode.gain.value = v;
      }
      if (key === 'playbackRate') {
        document.getElementById('aff-audio').playbackRate = v;
        if (mixSourceNode) { try { mixSourceNode.playbackRate.value = v; } catch(e){} }
      }
      // Si vitesse ou pause change → recalcule l'ETA du challenge en live
      if (key === 'playbackRate' || key === 'pauseBetween') updateChallengeEtaLive();
    });
  };
  bindRange('ps-aff-vol', 'affVolume', v => Math.round(v*100) + '%');
  bindRange('ps-music-vol', 'musicVolume', v => Math.round(v*100) + '%');
  bindRange('ps-rate', 'playbackRate', v => v.toFixed(2) + 'x');
  bindRange('ps-pause', 'pauseBetween', v => v + 's');

  // Helper : relance la musique instantanément si on est en lecture (Player OU Challenge)
  const isActivelyPlaying = () => playerState.playing || state.challenge.playing;
  const restartMusicIfActive = () => {
    if (!isActivelyPlaying()) return;
    stopMusic();
    if (state.settings.musicMode === 'drone') startMusic();
  };

  // Update en place (pas de re-render, c'est moche quand ça clignote)
  function bindAmbianceButtons() {
    overlay.querySelectorAll('[data-ambiance]').forEach(b => {
      b.onclick = () => {
        state.settings.ambianceId = b.dataset.ambiance;
        saveState();
        overlay.querySelectorAll('[data-ambiance]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        restartMusicIfActive();
      };
    });
  }
  function updateAmbianceGridVisibility() {
    const musicRow = overlay.querySelector('[data-ps-music-mode="drone"]')?.closest('.ps-row');
    if (!musicRow) return;
    let grid = musicRow.querySelector('.ambiance-grid');
    if (state.settings.musicMode === 'drone') {
      if (!grid) {
        grid = document.createElement('div');
        grid.className = 'ambiance-grid';
        grid.style.marginTop = '10px';
        grid.innerHTML = Object.entries(AMBIANCES).map(([id, amb]) => `
          <button class="ambiance-btn ${state.settings.ambianceId===id?'active':''}" data-ambiance="${id}" style="--amb-color: ${amb.color}">
            ${amb.name}
          </button>
        `).join('');
        musicRow.appendChild(grid);
        bindAmbianceButtons();
      } else {
        grid.style.display = '';
      }
    } else if (grid) {
      grid.style.display = 'none';
    }
  }
  function bindMusicModeButtons() {
    overlay.querySelectorAll('[data-ps-music-mode]').forEach(b => {
      b.onclick = () => {
        state.settings.musicMode = b.dataset.psMusicMode;
        saveState();
        overlay.querySelectorAll('[data-ps-music-mode]').forEach(x => x.classList.toggle('active', x.dataset.psMusicMode === state.settings.musicMode));
        updateAmbianceGridVisibility();
        restartMusicIfActive();
      };
    });
  }
  bindMusicModeButtons();
  bindAmbianceButtons();

  // Silent mode toggle (PLAYER uniquement — le Challenge a son propre toggle)
  document.getElementById('ps-silent-mode')?.addEventListener('change', (e) => {
    state.settings[pkey('silentMode')] = e.target.checked;
    saveState();
    renderPlayer();  // v1.24.0 : affiche ou retire l'étiquette sous le rond
    toast(e.target.checked ? '🔕 Player en mode silencieux' : '🔔 Player en mode voix');
  });

  // Allow mixing (Spotify / YT Music / Apple Music en parallèle)
  document.getElementById('ps-allow-mixing')?.addEventListener('change', (e) => {
    state.settings.allowMixing = e.target.checked;
    saveState();
    if (e.target.checked) {
      toast('🎧 Mix activé. Relance pour appliquer.');
    } else {
      toast('🎧 Mix désactivé. Relance pour appliquer.');
    }
  });

  // v1.26.0 : SATS pour dormir
  overlay.querySelectorAll('[data-sats-bg]').forEach(b => {
    b.addEventListener('click', () => {
      state.settings.satsBgId = b.dataset.satsBg;
      saveState();
      overlay.querySelectorAll('[data-sats-bg]').forEach(x => x.classList.toggle('active', x === b));
      previewSatsBackground(state.settings.satsBgId);
    });
  });
  const satsVol = document.getElementById('ps-sats-bg-vol');
  satsVol?.addEventListener('input', () => {
    state.settings.satsBgVolume = parseFloat(satsVol.value);
    document.getElementById('ps-val-sats-bg-vol').textContent = Math.round(state.settings.satsBgVolume * 100) + '%';
    updateSatsBgVolume();
  });
  satsVol?.addEventListener('change', () => saveState());
  document.getElementById('ps-sats-layers')?.addEventListener('change', (e) => {
    state.settings.satsLayers = e.target.checked;
    saveState();
    if (playerState.playing && state.ui.playerMode === 'sats') applyNightMode(true);
  });
  document.getElementById('ps-sats-sub')?.addEventListener('change', (e) => {
    state.settings.satsSubliminal = e.target.checked;
    saveState();
    if (playerState.playing && state.ui.playerMode === 'sats') satsSubStart();
  });
  document.getElementById('ps-sats-night')?.addEventListener('change', (e) => {
    state.settings.satsNightScreen = e.target.checked;
    saveState();
  });

  // Minuteur SATS (v1.23.0, dans la roue)
  overlay.querySelectorAll('[data-ps-night-timer]').forEach(b => {
    b.addEventListener('click', () => {
      state.settings.nightTimer = parseInt(b.dataset.psNightTimer, 10);
      saveState();
      overlay.querySelectorAll('[data-ps-night-timer]').forEach(x => x.classList.toggle('active', x === b));
      if (playerState.playing && state.settings.nightMode) startNightTimer();
      toast(t('night_timer_set', { n: state.settings.nightTimer / 60 }));
    });
  });

  // Durée de séance Repeat (v1.23.0) : optionnelle, 0 = aucune (le temps s'affiche quand même)
  overlay.querySelectorAll('[data-ps-duration]').forEach(b => {
    b.addEventListener('click', () => {
      const m = parseInt(b.dataset.psDuration, 10) || 0;
      state.settings.repeatDuration = m;
      saveState();
      overlay.querySelectorAll('[data-ps-duration]').forEach(x => x.classList.toggle('active', x === b));
      playerState.goalNotified = m > 0 && getRepeatElapsedMs() >= m * 60000;
      renderPlayer();
    });
  });

  bindVisionSettingRow(overlay, 'repeat');  // v1.27.0

  document.getElementById('ps-close').addEventListener('click', () => overlay.remove());
  overlay.querySelector('.sheet-x').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

    state.challenge.count = 0;
    state.challenge.currentIdx = 0;
    state.challenge.currentRepeat = 0;
    state.challenge.startedAt = null;
    state.challenge.affirmationIds = [];
    try { challengeShownAffId = null; } catch(e) {}
    saveState();
    overlay.remove();
    toast(t('toast_ch_abandoned'));
    render();
  });
  // Recommencer à 0 (même affirmations), avec une vraie confirmation
  document.getElementById('cs-ch-reset')?.addEventListener('click', async () => {
    const yes = await confirmAsync(t('ch_restart_confirm'), t('ch_restart'));
    if (!yes) return;
    if (state.challenge.playing) {
      state.challenge.playing = false;
      if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
      if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
      stopMusic();
    }
    state.challenge.count = 0;
    state.challenge.currentIdx = 0;
    state.challenge.currentRepeat = 0;
    state.challenge.startedAt = null;
    saveState();
    toast(t('toast_ch_restarted'));
    overlay.remove();
    render();
  });

  bindVisionSettingRow(overlay, 'challenge');  // v1.27.0

  document.getElementById('cs-close').addEventListener('click', () => overlay.remove());
  overlay.querySelector('.sheet-x').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

let challengeAudio = null;
let challengeTimeout = null;

// v1.29.0 : choisir les affirmations du Challenge depuis la barre du haut (comme la playlist en Repeat).

// v1.37.0 : l'enregistrement d'une nouvelle phrase du Challenge, dans une fenêtre
function openChallengeRecSheet() {
  document.getElementById('ch-rec-sheet')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.id = 'ch-rec-sheet';
  overlay.innerHTML = `

          <button class="playback-btn" id="ch-rec-play">${t('listen')}</button>

  setupChallengeRecorder();
}
function openChallengeAffPicker(opts) {
  if (!opts || typeof opts !== 'object' || !('onPick' in opts)) opts = null;  // v1.37.0 : appelé par un clic = comme avant
  const picked = new Set(((opts && opts.ids) || state.challenge.affirmationIds || []).filter(id => state.affirmations.some(a => a.id === id && a.recording)));
  let groupId = state.settings.selectedGroupId || 'all';
  if (groupId !== 'all' && !state.groups.some(g => g.id === groupId)) groupId = 'all';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.id = 'ch-aff-picker';
  const close = () => overlay.remove();
  const draw = () => {
    const affs = state.affirmations.filter(a => a.recording && (groupId === 'all' || a.groupId === groupId));
    const groupName = groupId === 'all' ? t('all_groups') : (state.groups.find(g => g.id === groupId)?.name || t('all_groups'));
    overlay.innerHTML = `
      <div class="modal modal-full ch-pick-modal">
        <div class="sheet-x-bar"><button type="button" class="sheet-x" aria-label="${t('sheet_close')}">✕</button></div>
        <div class="modal-title">${t('ch_pick_title')}</div>
        <div class="ch-pick-group">
          <div class="playlist-selector-wrap">
            <div class="playlist-selector-btn">
              <span class="playlist-selector-icon">♪</span>
              <span class="playlist-selector-name">${escapeHtml(groupName)}</span>
              <span class="playlist-selector-arrow">⌄</span>
            </div>
            <select class="playlist-overlay-select" id="ch-pick-group">
              <option value="all" ${groupId === 'all' ? 'selected' : ''}>${t('all_groups')} (${state.affirmations.filter(a => a.recording).length})</option>
              ${state.groups.map(g => {
                const n = state.affirmations.filter(a => a.groupId === g.id && a.recording).length;
                return `<option value="${g.id}" ${groupId === g.id ? 'selected' : ''}>${escapeHtml(g.name)} (${n})</option>`;
              }).join('')}
            </select>
          </div>
        </div>
        <div class="ch-pick-count" id="ch-pick-count">${t('ch_pick_count', { n: picked.size })}</div>
        ${affs.length ? `<div class="aff-check-list ch-pick-list">
          ${affs.map(a => `
            <label class="aff-check-item">
              <input type="checkbox" class="aff-check ch-pick-check" value="${a.id}" ${picked.has(a.id) ? 'checked' : ''} />
              <span class="aff-check-name">${escapeHtml(a.title)}</span>
            </label>
          `).join('')}
        </div>` : `<div class="sublabel ch-pick-list" style="margin:14px 4px">${t('ch_pick_empty')}</div>`}
        <div class="ch-pick-actions">
          <button class="btn-secondary" id="ch-pick-cancel">${t('cancel')}</button>
          <button class="btn-primary" id="ch-pick-ok" ${picked.size ? '' : 'disabled style="opacity:0.5"'}>${t('ch_pick_ok')}</button>
        </div>
      </div>
    `;
    overlay.querySelector('.sheet-x').addEventListener('click', close);
    overlay.querySelector('#ch-pick-cancel').addEventListener('click', close);
    overlay.querySelector('#ch-pick-group').addEventListener('change', (e) => { groupId = e.target.value; draw(); });
    const okBtn = overlay.querySelector('#ch-pick-ok');
    overlay.querySelectorAll('.ch-pick-check').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) {
          if (picked.size >= 4) { cb.checked = false; toast(t('challenge_max_affs')); return; }
          picked.add(cb.value);
        } else {
          picked.delete(cb.value);
        }
        overlay.querySelector('#ch-pick-count').textContent = t('ch_pick_count', { n: picked.size });
        okBtn.disabled = picked.size === 0;
        okBtn.style.opacity = picked.size ? '1' : '0.5';
      });
    });
    okBtn.addEventListener('click', () => {
      if (!picked.size) return;
      // Dans l'ordre de la liste des affirmations
      const ids = state.affirmations.filter(a => picked.has(a.id)).map(a => a.id);
      if (opts && opts.onPick) { close(); opts.onPick(ids); return; }  // v1.37.0 : page courte, on ne lance rien
      const same = ids.join(',') === (state.challenge.affirmationIds || []).join(',');
      close();
      if (same) return;
      if (state.challenge.playing) stopChallenge();  // l'ancien audio ne correspond plus
      state.challenge.affirmationIds = ids;
      state.challenge.currentIdx = 0;
      state.challenge.currentRepeat = 0;
      if (!state.challenge.startedAt) state.challenge.startedAt = Date.now();
      challengeShownAffId = null;
      saveState();
      toast('Sélection enregistrée ✓');
      render();
    });
  };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  draw();
  document.body.appendChild(overlay);
}

function renderChallenge() {
  const c = state.challenge;
  const s = state.settings;
  const chCfg = cfgFor('challenge');  // Paramètres du Challenge (indépendants du Player)
  const selectedAffs = (c.affirmationIds || [])
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  // Mode édition : clic crayon → affiche la liste même si on a déjà une sélection
  const editing = window.editingChallengeSelection === true;
  const hasSelection = selectedAffs.length > 0 && !editing;
  const pct = Math.min(100, (c.count / c.target) * 100);
  const remaining = Math.max(0, c.target - c.count);
  const available = state.affirmations.filter(a => a.recording);
  const TARGET_CHOICES = [10000, 20000, 30000, 40000, 50000];
  // IDs déjà sélectionnés (pour pré-cocher en mode édition)
  const preCheckedIds = new Set(c.affirmationIds || []);
  // v1.26.0 : objectif choisi sur l'écran de départ (gardé tant qu'on n'a pas validé)
  if (!TARGET_CHOICES.includes(window.chSetupTarget)) window.chSetupTarget = TARGET_CHOICES.includes(c.target) ? c.target : 10000;
  const setupTarget = window.chSetupTarget;
  // v1.37.0 : les phrases choisies sur la page courte (gardées tant qu'on n'a pas commencé)
  if (!Array.isArray(window.chSetupPicked)) window.chSetupPicked = [...preCheckedIds];
  const setupPicked = window.chSetupPicked.map(id => available.find(a => a.id === id)).filter(Boolean).slice(0, 4);

  pageEl.innerHTML = `

    <!-- SÉLECTION DES AFFIRMATIONS (seulement en mode édition ou pas de sélection) -->

          : `<div class="ch-setup-none">${t(available.length ? 'ch_setup_none' : 'ch_setup_none_rec')}</div>`}
        ${available.length ? `<button type="button" class="btn-secondary ch-setup-pick" id="ch-setup-pick">${t(setupPicked.length ? 'ch_setup_change' : 'ch_setup_pick')}</button>` : ''}
        <button class="btn-primary" id="ch-confirm-affs" ${setupPicked.length ? '' : 'disabled'} style="margin-top:12px;${setupPicked.length ? '' : ' opacity:0.5'}">${editing ? (window.chRestartSetup ? t('ch_start_new') : t('ch_edit')) : t('ch_setup_start')}</button>

      const countTxt = fmtN(c.count);

      // v1.25.0 : challenge fini = ✓ dans le rond, plus de ▶ (on recommence avec le bouton)

      const chOrbInner = c.playing
        ? `<span class="orb-inner"><span class="orb-clock ch-orb-count">${countTxt}</span><span class="ch-orb-target">/ ${targetTxt}</span><span class="orb-pause-hint">❚❚</span></span>`
        : chDone
          ? `<span class="orb-inner"><span class="orb-play">✓</span><span class="orb-clock orb-clock-small"><span class="ch-orb-count">${countTxt}</span> / ${targetTxt}</span></span>`
          : `<span class="orb-inner"><span class="orb-play">▶</span><span class="orb-clock orb-clock-small"><span class="ch-orb-count">${countTxt}</span> / ${targetTxt}</span></span>`;
      // L'aff courante dans la rotation
      const curIdx = (c.currentIdx || 0) % selectedAffs.length;
      // v1.25.1 : on garde l'affirmation qu'on entendait au moment de la pause
      const currentAff = selectedAffs.find(a => a.id === challengeShownAffId) || selectedAffs[curIdx] || selectedAffs[0];
      return `
        <div class="challenge-orb-wrap">
          <!-- HAUT : aff en cours (glow fade à chaque changement) -->
          <div class="ch-top ${chDone ? '' : 'ch-top-sel'}">
            ${chDone ? '' : `<button type="button" class="playlist-selector-btn ch-aff-selector" id="ch-aff-selector">
              <span class="playlist-selector-icon">◎</span>
              <span class="playlist-selector-name">${selectedAffs.length === 1 ? t('ch_sel_one') : t('ch_sel_n', { n: selectedAffs.length })}</span>

            </button>`}
            <div class="orb-current-aff ${c.playing || chDone ? 'glowing' : ''}" id="orb-current-aff">
              ${chDone ? t('ch_goal_reached') : escapeHtml(currentAff ? currentAff.title : '')}
            </div>
          </div>

          <!-- CENTRE : orbe (centrée verticalement par flex) -->
          <div class="ch-middle">
            <div class="orb-container">
              <div class="orb-ring"></div>
              <svg class="repeat-ring" viewBox="0 0 260 260" aria-hidden="true">
                <defs>
                  <linearGradient id="chRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="var(--accent)" />
                    <stop offset="100%" stop-color="var(--accent-light, var(--accent))" />
                  </linearGradient>
                </defs>
                <circle class="repeat-ring-track" cx="130" cy="130" r="${REPEAT_RING_R}" fill="none" />
                <circle class="repeat-ring-progress" id="ch-ring-progress" cx="130" cy="130" r="${REPEAT_RING_R}" fill="none"
                        stroke="url(#chRingGrad)"

          <!-- BAS : meta line (sous l'orbe, proche) + bloc vitesse+ETA + ajout manuel -->
          <div class="ch-bottom">
            <!-- Meta ligne juste sous l'orbe : restantes · commencé le · edit -->
            ${chDone ? `<button type="button" class="ch-restart-btn" id="ch-restart">${t('ch_restart')}</button>` : `<div class="orb-meta-line">
              <strong>${fmtN(remaining)}</strong> ${t('challenge_remaining')}${c.startedAt ? ` · <em>${t('challenge_started_on', { d: formatChallengeDate(c.startedAt) })}</em>` : ''}
            </div>`}

            <!-- Bloc Vitesse + ETA : seulement pendant la lecture (v1.23.0), place gardée pour que rien ne bouge -->
            <div class="live-speed speed-eta-block speed-compact ${c.playing ? '' : 'session-placeholder'}" ${chDone ? 'style="display:none"' : ''}>
              <div class="live-speed-label">
                <span>${t('play_speed_short')}</span>
                <span class="live-speed-val" id="ch-live-speed-val">${chCfg.playbackRate.toFixed(2)}x</span>
              </div>
              <input type="range" id="ch-live-speed" min="0.5" max="3" step="0.05" value="${chCfg.playbackRate}" />
              <div class="speed-eta-text" id="ch-eta-top">
                ${estimateChallengeTime(selectedAffs, remaining, chCfg.playbackRate, chCfg.pauseBetween)}
              </div>
            </div>

          </div>

          <!-- Bouton paramètres en haut à droite, comme Repeat et SATS (v1.22.0) -->
          <button class="player-gear-btn" id="ch-settings-btn" aria-label="${t('challenge_sheet_title')}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>

    })() : ''}

  `;

  // ====== HANDLERS ======

  // v1.37.0 : page courte : la fenêtre de choix, le ✕ d'une phrase, l'enregistrement dans une fenêtre
  const confirmBtn = document.getElementById('ch-confirm-affs');
  const updateConfirmBtn = () => {};
  document.getElementById('ch-setup-pick')?.addEventListener('click', () => openChallengeAffPicker({ ids: window.chSetupPicked || [], onPick: (ids) => { window.chSetupPicked = ids; render(); } }));
  document.querySelectorAll('[data-ch-unpick]').forEach(b => b.addEventListener('click', () => {
    window.chSetupPicked = (window.chSetupPicked || []).filter(id => id !== b.dataset.chUnpick);
    render();
  }));
  document.getElementById('ch-setup-rec')?.addEventListener('click', openChallengeRecSheet);

  document.querySelectorAll('[data-ch-setup-target]').forEach(b => {
    b.addEventListener('click', () => {
      window.chSetupTarget = parseInt(b.dataset.chSetupTarget, 10);
      document.querySelectorAll('[data-ch-setup-target]').forEach(x => x.classList.toggle('active', x === b));
      const k = document.getElementById('ch-title-k');
      if (k) k.textContent = (window.chSetupTarget / 1000) + 'K';
    });
  });

  // Au chargement : si on est en mode édition et des cases sont déjà pré-cochées,
  // activer le bouton confirmer immédiatement
  updateConfirmBtn();

  // Confirmer la sélection multiple
  // On NE reset PAS le count (préserve la progression). Pour reset : bouton "Reset le challenge"
  confirmBtn?.addEventListener('click', () => {
    const picked = (window.chSetupPicked || []).filter(id => state.affirmations.some(a => a.id === id && a.recording)).slice(0, 4);
    if (picked.length === 0) return;
    const wasEmpty = (state.challenge.affirmationIds || []).length === 0;
    state.challenge.affirmationIds = picked;
    state.challenge.currentIdx = 0;
    state.challenge.target = window.chSetupTarget || state.challenge.target || 10000;
    // Only set startedAt if the challenge has never been started
    if (wasEmpty || !state.challenge.startedAt) {
      state.challenge.startedAt = Date.now();
    }
    // Sortir du mode édition
    window.editingChallengeSelection = false;
    window.chRestartSetup = false;
    window.chSetupTarget = null;
    window.chSetupPicked = null;
    saveState();
    toast('Sélection enregistrée ✓');
    render();
  });

  // Clic sur crayon ✏️ : passe en mode édition SANS vider la sélection (les cases restent cochées)
  document.getElementById('ch-change-aff')?.addEventListener('click', () => {
    // Stop playback si en cours (le user va modifier la queue)
    if (state.challenge.playing) {
      state.challenge.playing = false;
      if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
      if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
      stopMusic();
    }
    window.editingChallengeSelection = true;
    window.chSetupTarget = state.challenge.target;
    window.chSetupPicked = null;
