// ============================================================
// PHOTOS DES PLAYLISTS (v1.27.0) : le tableau de vision
// - Les photos (Blob JPEG réduit) vivent dans IndexedDB, base à part : getmanifest_photos.
// - Dans state.groups[i].photos : seulement la liste des ids (rien de lourd dans localStorage).
// - Les sauvegardes ne contiennent pas les photos : un id sans photo est simplement ignoré.
// - Pendant Repeat et Challenge, un calque fixe (#vision-show, hors des pages qui se
//   redessinent) fait défiler les photos en fondu derrière l'affirmation. Jamais en SATS.
// ============================================================
const PHOTO_DB = 'getmanifest_photos';
const PHOTO_STORE = 'photos';
const PHOTO_MAX_PER_GROUP = 40;
const PHOTO_MAX_SIDE = 1280;
const VISION_MIN_MS = 1500;   // v1.29.0 : 1,5 s mini (le fondu dure 1,2 s), avant 6 s : la photo changeait au milieu des lectures
let photoDb = null;
let photosReady = false;
const photoUrls = new Map();  // id → objectURL du Blob

function openPhotoDb() {
  return new Promise((resolve, reject) => {
    try {
      if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
      const req = indexedDB.open(PHOTO_DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('open error'));
      req.onblocked = () => reject(new Error('open blocked'));
    } catch(e) { reject(e); }
  });
}

// Lance une transaction et attend qu'elle soit finie (fn reçoit le magasin)
function photoTx(mode, fn) {
  return new Promise((resolve, reject) => {
    try {
      const tx = photoDb.transaction(PHOTO_STORE, mode);
      const out = fn(tx.objectStore(PHOTO_STORE));
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error || new Error('tx error'));
      tx.onabort = () => reject(tx.error || new Error('tx abort'));
    } catch(e) { reject(e); }
  });
}

async function initPhotos() {
  try {
    photoDb = await openPhotoDb();
    const stored = new Map();
    await photoTx('readonly', st => {
      const req = st.openCursor();
      req.onsuccess = () => {
        const c = req.result;
        if (c) { stored.set(c.key, c.value); c.continue(); }
      };
    });
    stored.forEach((blob, id) => {
      try { photoUrls.set(id, URL.createObjectURL(blob)); } catch(e) {}
    });
    photosReady = true;
    if (currentTab === 'list') render();  // met à jour le nombre de photos sur les playlists
  } catch(e) {
    logEvent('photos_init_fail', { msg: String(e && e.message || e) });
  }
}

// Les photos d'une playlist qui existent vraiment sur ce téléphone
function groupPhotoIds(g) {
  return (g && Array.isArray(g.photos)) ? g.photos.filter(id => photoUrls.has(id)) : [];
}

// Réduit une image (1280 px au plus grand côté, JPEG 0,82). Le navigateur redresse les photos (EXIF).
function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    const src = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const w0 = img.naturalWidth, h0 = img.naturalHeight;
        if (!w0 || !h0) throw new Error('empty image');
        const k = Math.min(1, PHOTO_MAX_SIDE / Math.max(w0, h0));
        const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);  // fond pour les PNG transparents
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(src);
        cv.toBlob(b => b ? resolve(b) : reject(new Error('toBlob null')), 'image/jpeg', 0.82);
      } catch(e) { URL.revokeObjectURL(src); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('decode error')); };
    img.src = src;
  });
}

async function addPhotosToGroup(groupId, files) {
  const g = state.groups.find(x => x.id === groupId);
  if (!g) return 0;
  if (!photosReady) { toast(t('vision_unavailable')); return 0; }
  let list = Array.from(files || []).filter(f => !f.type || /^image\//.test(f.type));
  const room = Math.max(0, PHOTO_MAX_PER_GROUP - groupPhotoIds(g).length);
  if (list.length > room) { toast(t('vision_max')); list = list.slice(0, room); }
  let added = 0;
  for (const f of list) {
    try {
      const blob = await resizeImageFile(f);
      const id = 'ph_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await photoTx('readwrite', st => { st.put(blob, id); });
      photoUrls.set(id, URL.createObjectURL(blob));
      if (!Array.isArray(g.photos)) g.photos = [];
      g.photos = g.photos.filter(x => photoUrls.has(x));  // enlève au passage les ids sans photo
      g.photos.push(id);
      added++;
    } catch(e) {
      logEvent('photo_add_fail', { msg: String(e && e.message || e), type: f.type || '?' });
    }
  }
  if (added) { saveState(); toast(t('vision_added', { n: added })); }
  if (added < list.length) setTimeout(() => toast(t('vision_some_failed')), added ? 1800 : 0);
  return added;
}

// Enlève des photos (de toutes les playlists et d'IndexedDB)
function removePhotos(ids) {
  if (!ids || !ids.length) return;
  const set = new Set(ids);
  (state.groups || []).forEach(g => {
    if (Array.isArray(g.photos)) g.photos = g.photos.filter(id => !set.has(id));
  });
  ids.forEach(id => {
    const u = photoUrls.get(id);
    photoUrls.delete(id);
    if (u) setTimeout(() => { try { URL.revokeObjectURL(u); } catch(e) {} }, 3000);
  });
  saveState();
  if (photoDb) photoTx('readwrite', st => { ids.forEach(id => st.delete(id)); })
    .catch(e => logEvent('photo_del_fail', { msg: String(e && e.message || e) }));
}

function openPhotosModal(groupId) {
  const g = state.groups.find(x => x.id === groupId);
  if (!g) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.id = 'vision-modal';
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true;
  input.style.display = 'none';
  let busy = false;

  const draw = () => {
    const ids = groupPhotoIds(g);
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-title">${t('vision_title')}</div>
        <p class="sublabel vision-group-name">♪ ${escapeHtml(g.name)}</p>
        <p class="sublabel">${t('vision_hint')}</p>
        ${!photosReady ? `<p class="sublabel" style="margin-top:12px; color: var(--danger)">${t('vision_unavailable')}</p>` : `
          <div class="vision-grid">
            ${ids.length ? ids.map(id => `
              <div class="vision-thumb">
                <img src="${photoUrls.get(id)}" alt="" loading="lazy">
                <button type="button" class="vision-del" data-vision-del="${id}" aria-label="${t('vision_remove_btn')}">✕</button>
              </div>`).join('') : `<div class="vision-empty">${t('vision_empty')}</div>`}
          </div>
          <div class="vision-count">${ids.length} / ${PHOTO_MAX_PER_GROUP}</div>
          <button type="button" class="btn-primary ${busy ? 'busy' : ''}" id="vision-add">${busy ? t('vision_adding') : t('vision_add')}</button>
        `}
        <button type="button" class="btn-secondary" id="vision-close">${t('vision_close')}</button>
      </div>
    `;
    overlay.appendChild(input);
    overlay.querySelector('#vision-add')?.addEventListener('click', () => {
      if (busy) return;
      if (groupPhotoIds(g).length >= PHOTO_MAX_PER_GROUP) { toast(t('vision_max')); return; }
      input.value = '';
      input.click();
    });
    overlay.querySelectorAll('[data-vision-del]').forEach(b => b.addEventListener('click', async () => {
      if (!await confirmAsync(t('vision_remove'), t('vision_remove_btn'))) return;
      removePhotos([b.dataset.visionDel]);
      draw();
      render();
    }));
    overlay.querySelector('#vision-close').addEventListener('click', close);
  };
  const close = () => { overlay.remove(); render(); };

  input.addEventListener('change', async () => {
    const files = input.files;
    if (!files || !files.length) return;
    busy = true; draw();
    await addPhotosToGroup(g.id, files);
    busy = false;
    if (overlay.isConnected) draw();
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay && !busy) close(); });
  document.body.appendChild(overlay);
  draw();
}

// ---------- Réglages « Photos à l'écoute » (Repeat et Challenge ont les leurs) ----------
// v1.28.0 : 3 façons : 'bg' en fond (derrière le rond), 'front' par-dessus (photo en grand,
// l'affirmation en haut), 'off' aucune. Ancien réglage visionOn = false → 'off'.
function visionCfg(mode) {
  const s = state.settings;
  const ch = mode === 'challenge';
  let style = ch ? s.chVisionStyle : s.visionStyle;
  if (style !== 'bg' && style !== 'front' && style !== 'off') style = ((ch ? s.chVisionOn : s.visionOn) === false) ? 'off' : 'bg';
  const every = ch ? s.chVisionEvery : s.visionEvery;
  return { style, on: style !== 'off', every: (every === 8 || every === 15 || every === 30) ? every : 'aff' };
}

        </div>

function bindVisionSettingRow(overlay, mode) {
  const row = overlay.querySelector(`[data-vision-row="${mode}"]`);
  if (!row) return;
  const styleKey = mode === 'challenge' ? 'chVisionStyle' : 'visionStyle';
  const everyKey = mode === 'challenge' ? 'chVisionEvery' : 'visionEvery';
  row.querySelectorAll('[data-vision-style]').forEach(b => b.addEventListener('click', () => {

  }));
}

// ---------- Le défilement ----------
const vision = { el: null, layers: [], front: 0, shown: false, curId: null, lastKey: null, lastChange: 0, order: [], pos: 0, poolKey: '', loading: false };

function ensureVisionEl() {
  if (vision.el) return vision.el;
  const el = document.createElement('div');
  el.id = 'vision-show';
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = '<div class="vision-layer"></div><div class="vision-layer"></div><div class="vision-veil"></div>'
    + '<div class="vision-caption"><span></span></div><div class="vision-hint"></div>';
  document.body.insertBefore(el, document.body.firstChild);
  vision.el = el;
  vision.layers = Array.from(el.querySelectorAll('.vision-layer'));
  vision.caption = el.querySelector('.vision-caption span');
  // v1.28.0 : « Par-dessus » : toucher la photo montre les commandes pendant 6 s
  el.addEventListener('pointerdown', (e) => {
    if (!el.classList.contains('front')) return;
    e.preventDefault();
    e.stopPropagation();
    vision.peekUntil = Date.now() + 6000;
    visionTick();
  });
  return el;
}

// L'affirmation affichée en ce moment (celle de l'écran du Player ou du Challenge)
function visionAffTitle(mode) {
  const el = document.getElementById(mode === 'challenge' ? 'orb-current-aff' : 'np-text');
  const txt = el ? el.textContent.trim() : '';
  if (txt) return txt;
  const id = mode === 'challenge' ? challengeShownAffId : playerState.shownAffId;
  const a = id && state.affirmations.find(x => x.id === id);
  return a ? a.title : '';
}

function visionSetCaption(text) {
  const sp = vision.caption;
  if (!sp || vision.captionText === text) return;
  vision.captionText = text;
  if (!sp.textContent) { sp.textContent = text; return; }
  sp.classList.add('swap');
  setTimeout(() => { sp.textContent = vision.captionText; sp.classList.remove('swap'); }, 300);
}

function visionSetFront(on) {
  if (!vision.el) return;
  if (on && !vision.el.classList.contains('front')) {
    vision.el.querySelector('.vision-hint').textContent = t('vision_tap_hint');
    vision.el.classList.add('hint');
    clearTimeout(vision.hintTimer);
    vision.hintTimer = setTimeout(() => vision.el && vision.el.classList.remove('hint'), 3500);
  }
  vision.el.classList.toggle('front', on);
  vision.el.setAttribute('aria-hidden', on ? 'false' : 'true');
  document.body.classList.toggle('vision-front', on);
}

// Les photos à montrer : la playlist choisie (Repeat) ou celles des affirmations du Challenge
function visionPool(mode) {
  let groups;
  if (mode === 'challenge') {
    const gids = new Set();
    (state.challenge.affirmationIds || []).forEach(id => {
      const a = state.affirmations.find(x => x.id === id);
      if (a && a.groupId) gids.add(a.groupId);
    });
    groups = state.groups.filter(g => gids.has(g.id));
  } else {
    const sel = state.settings.selectedGroupId;
    groups = (!sel || sel === 'all') ? state.groups : state.groups.filter(g => g.id === sel);
  }
  const out = [];
  groups.forEach(g => groupPhotoIds(g).forEach(id => { if (!out.includes(id)) out.push(id); }));
  return out;
}

// Change à chaque affirmation jouée (y compris quand la même se répète)
function visionAffKey(mode) {
  if (mode === 'challenge') return (challengeShownAffId || state.challenge.currentIdx) + '|' + state.challenge.count;
  return (playerState.shownAffId || playerState.currentIdx) + '|' + playerState.totalPlayed;
}

function visionShuffle(pool, avoidFirst) {
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  if (a.length > 1 && a[0] === avoidFirst) [a[0], a[1]] = [a[1], a[0]];
  return a;
}

function visionShowPhoto(id) {
  const url = photoUrls.get(id);
  if (!url || vision.loading) return;
  if (id === vision.curId && vision.shown) return;
  vision.loading = true;
  const back = vision.layers[1 - vision.front];
  const front = vision.layers[vision.front];
  const img = new Image();
  const swap = () => {
    vision.loading = false;
    back.style.backgroundImage = `url("${url}")`;
    // Zoom lent qui part d'un coin au hasard
    const ox = [20, 50, 80][Math.floor(Math.random() * 3)];
    const oy = [25, 50, 75][Math.floor(Math.random() * 3)];
    back.style.transformOrigin = `${ox}% ${oy}%`;
    back.classList.remove('kb');
    void back.offsetWidth;
    back.classList.add('kb', 'front');
    front.classList.remove('front');
    vision.front = 1 - vision.front;
    vision.curId = id;
  };
  img.onload = swap;
  img.onerror = () => { vision.loading = false; };
  img.src = url;
}

function visionNext(pool) {
  if (vision.pos >= vision.order.length) { vision.order = visionShuffle(pool, vision.curId); vision.pos = 0; }
  const id = vision.order[vision.pos++];
  visionShowPhoto(id);
  vision.lastChange = Date.now();
}

function visionHide() {
  if (!vision.el) return;
  vision.el.classList.remove('on');
  visionSetFront(false);
  document.body.classList.remove('vision-on', 'vision-paused');
  vision.shown = false;
}

function visionTick() {
  if (document.hidden) return;
  const mode = state.ui.playerMode || 'repeat';
  const cfg = visionCfg(mode);
  const isChallenge = mode === 'challenge';
  // Repeat : visible en lecture et en pause, s'en va à « Terminer ». Challenge : pendant la lecture.
  const inSession = isChallenge ? !!state.challenge.playing : (mode === 'repeat' && (playerState.playing || !!playerState.sessionStart));
  const playingNow = isChallenge ? !!state.challenge.playing : !!playerState.playing;
  const pool = (photosReady && currentTab === 'player' && mode !== 'sats' && inSession && cfg.on && !window.editingChallengeSelection)
    ? visionPool(mode) : [];
  if (!pool.length) { if (vision.shown) visionHide(); return; }

  ensureVisionEl();
  const poolKey = pool.join(',');
  if (poolKey !== vision.poolKey) {
    vision.poolKey = poolKey;
    vision.order = visionShuffle(pool, vision.curId);
    vision.pos = 0;
  }
  const now = Date.now();
  if (!vision.shown) {
    // On (re)part : nouvelle photo si l'ancienne n'est plus dans la playlist
    if (!vision.curId || !pool.includes(vision.curId)) visionNext(pool);
    vision.lastKey = visionAffKey(mode);
    vision.el.classList.add('on');
    document.body.classList.add('vision-on');
    vision.shown = true;
  } else if (!pool.includes(vision.curId) && !vision.loading) {
    visionNext(pool);
    vision.lastKey = visionAffKey(mode);
  } else if (playingNow && pool.length > 1) {
    if (cfg.every === 'aff') {
      const k = visionAffKey(mode);
      // v1.29.0 : la photo change seulement entre deux lectures (même affirmation répétée comprise).
      // Trop tôt (lectures très courtes) : on laisse passer cette fin de lecture, sans changer plus tard au milieu d'une phrase.
      if (k !== vision.lastKey) {
        if (now - vision.lastChange >= VISION_MIN_MS) visionNext(pool);
        vision.lastKey = k;
      }
    } else if (now - vision.lastChange >= cfg.every * 1000) {
      visionNext(pool);
    }
  }
  document.body.classList.toggle('vision-paused', !playingNow);
  // v1.28.0 : « Par-dessus » pendant la lecture (en pause ou quand on a touché l'écran : comme « En fond »)
  const front = cfg.style === 'front' && playingNow && now >= (vision.peekUntil || 0);
  if (front) visionSetCaption(visionAffTitle(mode));
  visionSetFront(front);
}

setInterval(() => { try { visionTick(); } catch(e) {} }, 500);

// ============================================================
// v1.25.0 : COUPURE PAR LE TÉLÉPHONE (appel, autre app qui prend le son)
// Le système coupe le son sans prévenir l'app : l'écran restait sur « lecture »
// alors que plus rien ne jouait. Maintenant, si le son est vraiment coupé,
// l'app se met en pause proprement (▶ visible) et attend qu'on touche ▶.
// Une coupure très courte (notification) qui reprend toute seule est ignorée.
// ============================================================
let interruptCheckTimer = null;
let interruptNoticePending = false;
function isPlayingBufferSound() {
  // Vrai si l'app joue un gros audio (Repeat, SATS ou Challenge) et que le son tourne vraiment
  if (mixSourceNode) return !!queueBufferCtx && queueBufferCtx.state === 'running';
  const a = document.getElementById('aff-audio');
  return !!a && !a.paused;
}
function isWatchablePlayback() {
  // Seulement la lecture « gros audio » ; le mode silencieux (bips) a sa propre mécanique
  if (playerState.playing && queueBufferURL) return 'player';
  if (state.challenge.playing && challengeBufferURL) return 'challenge';
  return null;
}
function scheduleInterruptCheck(reason) {
  if (!isWatchablePlayback()) return;
  if (interruptCheckTimer) clearTimeout(interruptCheckTimer);
  interruptCheckTimer = setTimeout(() => {
    interruptCheckTimer = null;
    const which = isWatchablePlayback();
    if (!which) return;
    if (!mixSourceNode) {
      // En cours de changement d'audio (démarrage, playlist) : pas une coupure
      const a = document.getElementById('aff-audio');
      const url = which === 'player' ? queueBufferURL : challengeBufferURL;
      if (!a || a.src !== url) return;
    }
    if (isPlayingBufferSound()) return;
    handleSystemInterruption(reason, which);
  }, 900);
}
function handleSystemInterruption(reason, which) {
  logEvent('interrupted_by_system', { reason, which, visible: document.visibilityState });
  if (which === 'player') pausePlayback();
  else stopChallenge();  // le compteur est gardé, ▶ repart d'où on en était
  updateMediaSessionMetadata(null, null);
  if (document.visibilityState === 'visible') toast(t('toast_interrupted'));
  else interruptNoticePending = true;
}
// v1.34.0 : après une coupure (vidéo dans une autre app), le téléphone peut relancer le son tout seul
// alors que l'app affiche « en pause ». L'écran dit vrai : on recoupe ce son.
(function setupStraySoundGuard() {
  const a = document.getElementById('aff-audio');
  if (!a) return;
  a.addEventListener('playing', () => {
    setTimeout(() => {
      if (!playerState.playing && !state.challenge.playing && !a.paused) {
        try { a.pause(); } catch(e) {}
        logEvent('stray_sound_paused');
      }
    }, 120);
  });
})();
(function setupInterruptWatch() {
  const a = document.getElementById('aff-audio');
  if (a) a.addEventListener('pause', () => scheduleInterruptCheck('audio_pause'));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (interruptNoticePending) { interruptNoticePending = false; toast(t('toast_interrupted')); }
    scheduleInterruptCheck('back_visible');
  });
})();

// ============================================================
// VERROU : un code d'accès par acheteuse (v1.22.0)
// L'app ne contient que les empreintes des codes (SHA-256 tronqué).
// La liste des codes reste sur le PC (codes-acces.txt, hors GitHub).
// Retirer une empreinte d'ici = couper ce code à la prochaine mise à jour.
// ============================================================

const LOCK_TEXTS = {
  fr: {
    title: 'Bienvenue',
    text: 'Entre le code reçu après ton achat. Tu ne le taperas qu\'une fois sur cet appareil.',
    btn: 'Ouvrir l\'app',
    wrong: 'Ce code ne marche pas. Vérifie les lettres et réessaie.',
    empty: 'Tape ton code d\'abord.',
    nocrypto: 'Ton navigateur ne peut pas vérifier le code ici. Ouvre l\'app depuis son adresse en https.',
    help: 'Pas de code ou un souci ? Écris à',
  },
  en: {
    title: 'Welcome',
    text: 'Enter the code you received after your purchase. You only type it once on this device.',
    btn: 'Open the app',
    wrong: 'This code doesn\'t work. Check the letters and try again.',
    empty: 'Type your code first.',
    nocrypto: 'Your browser can\'t check the code here. Open the app from its https address.',
    help: 'No code or a problem? Write to',
  },
};

function normalizeAccessCode(raw) {
  let c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length === 8) c = 'GM' + c;  // si on oublie le "GM" du début
  return c;
}

async function hashAccessCode(code) {
  const data = new TextEncoder().encode(ACCESS_SALT + code);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}

function isAppUnlocked() {
  try { return ACCESS_HASHES.has(localStorage.getItem(ACCESS_KEY) || ''); }
  catch (e) { return false; }
}

function showLockScreen(onUnlock) {
  const lang = (state.settings.language || detectBrowserLang()) === 'en' ? 'en' : 'fr';
  const L = LOCK_TEXTS[lang];
  const el = document.createElement('div');
  el.id = 'lock-screen';
  el.className = 'onboarding-overlay lock-overlay';
  el.innerHTML = `
    <div class="lock-box">
      <div class="lock-logo">✦</div>
      <div class="lock-brand">GetManifest</div>
      <div class="lock-title">${L.title}</div>
      <div class="lock-text">${L.text}</div>
      <input id="lock-input" class="lock-input" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="GM-XXXX-XXXX" maxlength="20" />
      <div class="lock-error" id="lock-error"></div>
      <button class="ob-next-btn" id="lock-btn">${L.btn}</button>
      <div class="lock-help">${L.help}<br><a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a></div>
    </div>
  `;
  document.body.appendChild(el);
  const input = el.querySelector('#lock-input');
  const errEl = el.querySelector('#lock-error');
  const btn = el.querySelector('#lock-btn');

  const tryUnlock = async () => {
    errEl.textContent = '';
    const code = normalizeAccessCode(input.value);
    if (!code) { errEl.textContent = L.empty; return; }
    if (!window.crypto || !crypto.subtle) { errEl.textContent = L.nocrypto; return; }
    btn.disabled = true;
    try {
      const h = await hashAccessCode(code);
      if (ACCESS_HASHES.has(h)) {
        try { localStorage.setItem(ACCESS_KEY, h); } catch (e) {}
        logEvent('unlock_ok');
        el.remove();
        onUnlock();
      } else {
        errEl.textContent = L.wrong;
        input.select();
      }
    } catch (e) {
      errEl.textContent = L.nocrypto;
    } finally {
      btn.disabled = false;
    }
  };
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  setTimeout(() => input.focus(), 300);
}

function afterUnlock() {
  if (!state.onboardingDone) {
    startOnboarding();
  }
}

if (isAppUnlocked()) {
  afterUnlock();
} else {
  showLockScreen(afterUnlock);
}

// === UPDATE CHECKER : scanne version.txt pour détecter une nouvelle version ===
async function checkForUpdate() {
  try {
    const url = 'version.txt?nocache=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return;
    const latestVersion = (await res.text()).trim();
    if (latestVersion && latestVersion !== APP_VERSION) {
      showUpdateBanner(latestVersion);
    }
  } catch(e) { /* silencieux : pas de réseau, pas grave */ }
}

function showUpdateBanner(newVersion) {
  if (document.getElementById('update-banner')) return;  // Déjà affiché
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.className = 'update-banner';
  banner.innerHTML = `
    <span class="update-icon">✨</span>
    <span class="update-text">Nouvelle version dispo</span>
    <button class="update-btn" id="update-apply">Mettre à jour</button>
    <button class="update-dismiss" id="update-dismiss" aria-label="Fermer">×</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('update-apply').addEventListener('click', () => {
    // Force reload en vidant le cache
    const u = new URL(window.location.href);
    u.searchParams.set('v', Date.now());
    window.location.href = u.toString();
  });
  document.getElementById('update-dismiss').addEventListener('click', () => {
    banner.remove();
  });
}

// Check au chargement + toutes les 5 min
checkForUpdate();
setInterval(checkForUpdate, 5 * 60 * 1000);

function applyLangTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    const key = tab.dataset.tab;
    const label = tab.querySelector('.tab-label');
    if (label) {
      if (key === 'player') label.textContent = t('tab_player');
      else if (key === 'list') label.textContent = t('tab_list');
      else if (key === 'challenge') label.textContent = t('tab_challenge');
      else if (key === 'stats') label.textContent = t('tab_stats');
      else if (key === 'settings') label.textContent = t('tab_settings');
    }
  });
}
