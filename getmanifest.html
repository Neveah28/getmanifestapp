  });

  document.getElementById('ch-aff-selector')?.addEventListener('click', openChallengeAffPicker);
  document.getElementById('ch-toggle')?.addEventListener('click', toggleChallenge);
  document.getElementById('ch-restart')?.addEventListener('click', restartChallenge);
  document.getElementById('ch-settings-btn')?.addEventListener('click', openChallengeSheet);
  // Chips Repeat / Challenge / SATS
  bindPlayerModeChips();
  // Reset du compteur : utilise un toast de confirmation (confirm() natif ne marche pas en PWA)
  let resetPending = false;
  document.getElementById('ch-reset')?.addEventListener('click', (ev) => {
    if (!resetPending) {
      resetPending = true;
      ev.target.textContent = '⚠️ Confirmer reset ?';
      toast('Tape à nouveau pour confirmer');
      setTimeout(() => {
        resetPending = false;
        const btn = document.getElementById('ch-reset');
        if (btn) btn.textContent = t('challenge_reset');
      }, 3000);
      return;
    }
    // Confirmé : reset
    if (state.challenge.playing) {
      state.challenge.playing = false;
      if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; }
      if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
      stopMusic();
    }
    state.challenge.count = 0;
    state.challenge.currentIdx = 0;
    saveState();
    toast('Compteur reset à 0 ✓');
    render();
  });

  // Ajout manuel (compteur à main) : compte dans le challenge + stats globales
  // Expose aussi globalement pour que la bottom sheet puisse l'appeler
  const addToCount = (n) => {
    if (!n || n < 1) return;
    const oldCount = state.challenge.count;
    state.challenge.count = Math.min(state.challenge.target, state.challenge.count + n);
    const newCount = state.challenge.count;

    // === Track dans les stats globales ===
    const key = todayKey();
    if (!state.stats.byDay[key]) state.stats.byDay[key] = { plays: 0, loops: 0, seconds: 0 };
    state.stats.byDay[key].plays += n;
    state.stats.totalPlays += n;
    if (state.stats.byDay[key].plays > (state.stats.bestDay?.plays || 0)) {
      state.stats.bestDay = { date: key, plays: state.stats.byDay[key].plays };
    }
    updateStreak();

    // Répartir équitablement sur les affs sélectionnées pour les stats détaillées
    const selectedIds = state.challenge.affirmationIds || [];
    if (selectedIds.length > 0) {
      const perAff = Math.floor(n / selectedIds.length);
      const remainder = n - perAff * selectedIds.length;
      selectedIds.forEach((id, idx) => {
        const add = perAff + (idx === 0 ? remainder : 0);
        if (add === 0) return;
        if (!state.stats.byAffirmation[id]) state.stats.byAffirmation[id] = { plays: 0, lastPlayed: 0 };
        state.stats.byAffirmation[id].plays += add;
        state.stats.byAffirmation[id].lastPlayed = Date.now();
        const aff = state.affirmations.find(a => a.id === id);
        if (aff && aff.groupId) {
          if (!state.stats.byPlaylist[aff.groupId]) state.stats.byPlaylist[aff.groupId] = { plays: 0 };
          state.stats.byPlaylist[aff.groupId].plays += add;
        }
      });
    }

    saveState();
    toast(t('challenge_added', { n: n }));
    // Toasts "Bravo" à chaque palier atteint (10K, 20K, 30K...)
    celebrateMilestoneIfReached(oldCount, newCount);
    if (oldCount < state.challenge.target && state.challenge.count >= state.challenge.target) {
      recordChallengeCompletion();
      stopChallenge();
    }
    render();
  };
  // Expose pour la bottom sheet (bouton ✋ dans les paramètres)
  window.chAddToCount = addToCount;

  // Live speed slider pendant lecture (modifie uniquement la vitesse CHALLENGE)
  document.getElementById('ch-live-speed')?.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    state.settings.chPlaybackRate = v;
    saveState();
    document.getElementById('ch-live-speed-val').textContent = v.toFixed(2) + 'x';
    document.getElementById('aff-audio').playbackRate = v;
    updateChallengeEtaLive();  // Recalcule l'ETA en temps réel
  });

  // v1.37.0 : l'enregistrement d'une nouvelle phrase est dans sa fenêtre (openChallengeRecSheet)
}

// Enregistrement intégré dans l'onglet 10K
let chRecorder = { mediaRecorder: null, chunks: [], startTime: 0, interval: null, recording: null, duration: 0 };

// ============================================================
// AUDIO RECORDING - avec filtres bruits + embellissement voix
// ============================================================
// Choisit le meilleur format audio supporté par le device, haute qualité
function getBestRecorderOptions() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus',
  ];
  for (const type of candidates) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
      return { mimeType: type, audioBitsPerSecond: 128000 };
    }
  }
  return { audioBitsPerSecond: 128000 };
}

async function getProcessedMicStream() {
  // Approche minimale : on fait confiance aux filtres natifs du navigateur
  // (annulation echo + bruit + auto-gain). PAS de traitement supplémentaire.
  // Résultat : voix naturelle, propre, sans artefacts.
  // IMPORTANT : contraintes sampleRate/channelCount retirées pour laisser
  // Chrome choisir ce qui marche avec le device courant (sinon casque BT
  // qui ne supporte pas 48000 Hz → erreur OverconstrainedError).
  logEvent('mic_request_start');
  let rawStream;
  try {
    rawStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      }
    });
    const track = rawStream.getAudioTracks()[0];
    const settings = track ? track.getSettings() : {};
    logEvent('mic_request_ok', { deviceId: settings.deviceId && settings.deviceId.slice(0, 8), label: track && track.label, sr: settings.sampleRate, ch: settings.channelCount });
  } catch(e) {
    logEvent('mic_request_fail', { name: e && e.name, msg: e && e.message });
    // Deuxième tentative sans aucune contrainte (brut)
    try {
      rawStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      logEvent('mic_request_ok_fallback');
    } catch(e2) {
      logEvent('mic_request_fail_final', { name: e2 && e2.name, msg: e2 && e2.message });
      throw e2;
    }
  }
  const cleanup = () => rawStream.getTracks().forEach(t => t.stop());
  return { stream: rawStream, cleanup, analyser: null };
}

// Fonction de test micro avec visualisation du niveau
async function testMic(canvas) {
  const rawStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioContextClass();
  const source = ctx.createMediaStreamSource(rawStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);

  const canvasCtx = canvas.getContext('2d');
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  let running = true;

  function draw() {
    if (!running) return;
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);
    const w = canvas.width;
    const h = canvas.height;
    canvasCtx.clearRect(0, 0, w, h);

    const bars = 24;
    const barW = w / bars - 3;
    for (let i = 0; i < bars; i++) {
      const idx = Math.floor((i / bars) * bufferLength * 0.6);
      const v = dataArray[idx] / 255;
      const barH = v * h * 0.95;
      // dégradé rose gold
      const t = i / bars;
      const r = Math.round(0xf5 + (0xe4 - 0xf5) * t);
      const g = Math.round(0xb5 + (0x78 - 0xb5) * t);
      const b = Math.round(0x93 + (0xa0 - 0x93) * t);
      canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
      canvasCtx.fillRect(i * (w / bars) + 1.5, h - barH, barW, barH);
    }
  }
  draw();

  return () => {
    running = false;
    try { source.disconnect(); } catch(e){}
    try { ctx.close(); } catch(e){}
    rawStream.getTracks().forEach(t => t.stop());
  };
}

function setupChallengeRecorder() {
  const recBtn = document.getElementById('ch-rec-btn');
  const timer = document.getElementById('ch-rec-timer');
  const hint = document.getElementById('ch-rec-hint');
  const playback = document.getElementById('ch-rec-playback');
  const createBtn = document.getElementById('ch-create');
  const titleInput = document.getElementById('ch-new-title');

  if (!recBtn) return;

  const updateCreateBtn = () => {
    const hasTitle = titleInput.value.trim().length > 0;
    const hasRec = !!chRecorder.recording;
    if (hasTitle && hasRec) {
      createBtn.disabled = false;
      createBtn.style.opacity = '1';
    } else {
      createBtn.disabled = true;
      createBtn.style.opacity = '0.5';
    }
  };

  titleInput.addEventListener('input', updateCreateBtn);

  recBtn.addEventListener('click', async () => {
    if (chRecorder.mediaRecorder && chRecorder.mediaRecorder.state === 'recording') {
      chRecorder.mediaRecorder.stop();
      recBtn.classList.remove('recording');
      recBtn.textContent = '●';
      clearInterval(chRecorder.interval);
    } else {
      // Hors du try : si getUserMedia a marché mais que la suite plante
      // (new MediaRecorder, start...), on doit quand même fermer le micro,
      // sinon il reste bloqué et la tentative d'après fait "micro occupé".
      let micCleanup = null;
      try {
        const { stream, cleanup } = await getProcessedMicStream();
        micCleanup = cleanup;
        chRecorder.chunks = [];
        chRecorder.mediaRecorder = new MediaRecorder(stream, getBestRecorderOptions());
        chRecorder._cleanup = cleanup;
        chRecorder.mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chRecorder.chunks.push(e.data); };
        chRecorder.mediaRecorder.onerror = (ev) => {
          const err = ev && ev.error;
          logEvent('mic_recorder_error_ch', { name: err && err.name, msg: err && err.message });
        };
        chRecorder.mediaRecorder.onstop = () => {
          cleanup();
          // Si le recorder s'est arrêté tout seul (casque BT déco, erreur...),
          // on remet le bouton à zéro (sans effet si déjà fait au clic)
          recBtn.classList.remove('recording');
          recBtn.textContent = '●';
          clearInterval(chRecorder.interval);
          // Strip ;codecs=... pour éviter que le data URL ait deux `;` (bug Chrome Android)
          const rawMime = chRecorder.mediaRecorder.mimeType || (chRecorder.chunks[0] && chRecorder.chunks[0].type) || 'audio/webm';
          const realMime = rawMime.split(';')[0].trim();
          const blob = new Blob(chRecorder.chunks, { type: realMime });
          // Enregistrement vide (0 octet) : on garde l'ancien s'il y en avait un
          if (!blob.size || chRecorder.chunks.length === 0) {
            logEvent('record_empty_ch', { mime: rawMime, ms: Date.now() - chRecorder.startTime });
            toast(t('toast_rec_empty'));
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            chRecorder.recording = reader.result;
            chRecorder.duration = (Date.now() - chRecorder.startTime) / 1000;
            timer.textContent = formatDur(chRecorder.duration);
            hint.textContent = t('rec_exists');
            playback.style.display = 'block';
            updateCreateBtn();
          };
          reader.readAsDataURL(blob);
        };
        chRecorder.mediaRecorder.start();
        chRecorder.startTime = Date.now();
        recBtn.classList.add('recording');
        recBtn.textContent = '■';
        chRecorder.interval = setInterval(() => {
          timer.textContent = formatDur((Date.now() - chRecorder.startTime) / 1000);
        }, 100);
      } catch(e) {
        if (micCleanup) { try { micCleanup(); } catch(_) {} }
        chRecorder.mediaRecorder = null;
        const name = e && e.name;
        let msg = t('toast_mic_error');
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') msg = '🎤 Permission micro refusée';
        else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') msg = '🎤 Aucun micro trouvé';
        else if (name === 'OverconstrainedError') msg = '🎤 Micro incompatible (casque BT ?). Débranche et réessaye.';
        else if (name === 'NotReadableError') msg = '🎤 Micro occupé par une autre app. Ferme-les et réessaye.';
        logEvent('mic_record_fail_ch', { name, msg: e && e.message, micOpened: !!micCleanup });
        toast(msg);
      }
    }
  });

  document.getElementById('ch-rec-play')?.addEventListener('click', () => {
    playPreviewRobust(chRecorder.recording, state.settings.affVolume, 'ch-rec-play');
  });

  document.getElementById('ch-rec-redo')?.addEventListener('click', () => {
    chRecorder.recording = null;
    chRecorder.duration = 0;
    timer.textContent = formatDur(0);
    hint.textContent = t('ch_rec_hint');
    playback.style.display = 'none';
    updateCreateBtn();
  });

  createBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    if (!title || !chRecorder.recording) return;

    // Trouver un groupe par défaut (le premier)
    let groupId = state.groups[0]?.id;
    if (!groupId) {
      // Créer un groupe si aucun
      const newG = { id: uid(), name: state.settings.language === 'en' ? 'My affirmations' : 'Mes affirmations' };
      state.groups.push(newG);
      groupId = newG.id;
    }

    const newAff = {
      id: uid(),
      title,
      groupId,
      recording: chRecorder.recording,
      duration: chRecorder.duration,
    };
    state.affirmations.push(newAff);

    // Reset du recorder
    chRecorder = { mediaRecorder: null, chunks: [], startTime: 0, interval: null, recording: null, duration: 0 };

    // v1.37.0 : depuis la fenêtre, la phrase rejoint « Tes affirmations » ; on commence avec le bouton
    const recSheet = document.getElementById('ch-rec-sheet');
    if (recSheet) {
      recSheet.remove();
      const ids = (window.chSetupPicked || []).filter(id => id !== newAff.id);
      if (ids.length < 4) ids.push(newAff.id);
      window.chSetupPicked = ids;
      saveState();
      toast(t('toast_created'));
      render();
      return;
    }
    // Set comme affirmation du challenge
    state.challenge.affirmationIds = [newAff.id];
    state.challenge.currentIdx = 0;
    state.challenge.currentRepeat = 0;
    state.challenge.count = 0;
    state.challenge.target = window.chSetupTarget || state.challenge.target || 10000;
    state.challenge.startedAt = Date.now();
    challengeShownAffId = null;
    window.editingChallengeSelection = false;
    window.chRestartSetup = false;
    window.chSetupTarget = null;
    saveState();

    toast(t('toast_created'));
    render();
  });
}

function toggleChallenge() {
  if (state.challenge.playing) {
    stopChallenge();
  } else {
    startChallenge();
  }
}

// v1.25.0 : un challenge fini ne repart plus d'une affirmation à chaque ▶
function isChallengeDone() {
  return (state.challenge.count || 0) >= (state.challenge.target || 10000);
}
function restartChallenge() {
  if (state.challenge.playing) stopChallenge();
  state.challenge.count = 0;
  state.challenge.currentIdx = 0;
  state.challenge.currentRepeat = 0;
  state.challenge.startedAt = null;   // la date repart quand on valide le nouveau choix
  challengeShownAffId = null;
  window.editingChallengeSelection = true;
  window.chRestartSetup = true;
  window.chSetupTarget = state.challenge.target;
  window.chSetupPicked = null;
  saveState();
  toast(t('ch_restart_pick'));
  render();
  window.scrollTo(0, 0);
}

async function startChallenge() {
  if (isChallengeDone()) { toast(t('ch_done_hint')); render(); return; }
  const ids = state.challenge.affirmationIds || [];
  const validAffs = ids
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  if (validAffs.length === 0) { toast(t('toast_no_recordings')); return; }
  state.challenge.playing = true;
  if (!state.challenge.startedAt) state.challenge.startedAt = Date.now();
  if (typeof state.challenge.currentIdx !== 'number' || state.challenge.currentIdx >= validAffs.length) {
    state.challenge.currentIdx = 0;
  }
  saveState();
  startMusic('challenge');
  acquireWakeLock();
  render();
  toast(t('challenge_started'));

  const cfg = cfgFor('challenge');
  if (cfg.silentMode) { playChallenge(); return; }
  const pauseSec = Math.max(0, cfg.pauseBetween || 0);
  const url = await buildChallengeBuffer(validAffs, pauseSec);
  if (!url) { playChallenge(); return; }
  // v1.25.1 : on repart de l'affirmation affichée à l'écran (celle de la pause)
  const startSeg = challengeBufferSegments.find(sg => sg.affId === challengeShownAffId) || challengeBufferSegments[0];
  const startAff = validAffs.find(a => a.id === startSeg.affId) || validAffs[0];
  const startOffset = startSeg ? startSeg.startSec : 0;
  challengeShownAffId = startAff.id;

  // MODE MIX : Web Audio au lieu de <audio>
  if (state.settings.allowMixing) {
    if (queueBufferCtx && queueBufferCtx.state === 'suspended') await queueBufferCtx.resume();
    const ok = startMixPlayback(challengeBufferAudio, startOffset, cfg.playbackRate || 1, cfg.affVolume || 1);
    if (ok) {
      animateCurrentAff(startAff.title);
      startChallengeTick(validAffs);
      return;
    }
  }

  const audio = document.getElementById('aff-audio');
  audio.src = url;
  audio.loop = true;
  audio.volume = cfg.affVolume;
  audio.playbackRate = cfg.playbackRate;
  applyNightMode(false);
  try {
    await audio.play();
    if (startOffset > 0) { try { audio.currentTime = startOffset; } catch(e) {} }
    challengeAudio = audio;
    updateMediaSessionMetadata(startAff, 'Challenge');
    animateCurrentAff(startAff.title);
    startChallengeTick(validAffs);
  } catch(e) {
    toast(t('toast_play_error'));
    stopChallenge();
  }
}

function stopChallenge() {
  state.challenge.playing = false;
  if (challengeAudio) { challengeAudio.pause(); challengeAudio.currentTime = 0; challengeAudio.loop = false; }
  stopMixPlayback();
  mixPausedPos = 0;
  if (challengeTimeout) { clearTimeout(challengeTimeout); challengeTimeout = null; }
  stopChallengeTick();
  clearChallengeBuffer();
  clearNightTimer();
  stopMusic();
  releaseWakeLock();
  saveState();
  render();
}

// === CHALLENGE BUFFER : même principe que le player, un gros audio concaténé ===
let challengeBufferURL = null;
let challengeBufferDuration = 0;
let challengeBufferSegments = [];
let challengeBufferAudio = null;  // AudioBuffer gardé en RAM pour mode mix
let lastChallengeBufferTime = 0;
let challengeTickInterval = null;

async function buildChallengeBuffer(validAffs, pauseSec) {
  try {
    if (!validAffs.length) return null;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!queueBufferCtx) {
      queueBufferCtx = new Ctx();
      queueBufferCtx.addEventListener('statechange', () => scheduleInterruptCheck('ctx_' + queueBufferCtx.state));
    }
    const affSegs = [];
    for (const aff of validAffs) {
      try {
        const buf = await decodeAffToBuffer(aff, queueBufferCtx);
        const mono = resampleAndMonoize(buf, BUFFER_TARGET_RATE);
        const repeat = Math.max(1, aff.repeatCount || 1);
        for (let r = 0; r < repeat; r++) affSegs.push({ aff, mono });
      } catch(e) { console.warn('Décodage aff échoué (challenge):', aff.title, e); }
    }
    if (!affSegs.length) return null;
    const sampleRate = BUFFER_TARGET_RATE;
    const silenceSamples = Math.max(1, Math.floor(pauseSec * sampleRate));
    let totalSamples = 0;
    for (const { mono } of affSegs) totalSamples += mono.length + silenceSamples;
    const out = queueBufferCtx.createBuffer(1, totalSamples, sampleRate);
    const chan = out.getChannelData(0);
    challengeBufferSegments = [];
    let cursor = 0;
    for (const { aff, mono } of affSegs) {
      chan.set(mono, cursor);
      const affStart = cursor / sampleRate;
      const affEnd = (cursor + mono.length) / sampleRate;
      challengeBufferSegments.push({ affId: aff.id, startSec: affStart, endSec: affEnd });
      cursor += mono.length + silenceSamples;
    }
    challengeBufferDuration = out.length / sampleRate;
    challengeBufferAudio = out;  // Pour le mode mix
    const blob = audioBufferToWavBlob(out);
    if (challengeBufferURL) URL.revokeObjectURL(challengeBufferURL);
    challengeBufferURL = URL.createObjectURL(blob);
    return challengeBufferURL;
  } catch(e) { console.warn('buildChallengeBuffer failed', e); return null; }
}

let lastChallengeTickWall = 0;
function startChallengeTick(validAffs) {
  stopChallengeTick();
  lastChallengeBufferTime = getChallengePlaybackTime();
  lastChallengeTickWall = Date.now();
  challengeTickInterval = setInterval(() => {
    if (!state.challenge.playing || !challengeBufferURL) return;
    const t = getChallengePlaybackTime();
    const nowWall = Date.now();
    processChallengeProgress(lastChallengeBufferTime, t, validAffs, nowWall - lastChallengeTickWall);
    lastChallengeBufferTime = t;
    lastChallengeTickWall = nowWall;
  }, 500);
}
function stopChallengeTick() {
  if (challengeTickInterval) { clearInterval(challengeTickInterval); challengeTickInterval = null; }
}

let lastChallengeSaveWall = 0;
function processChallengeProgress(prev, curr, validAffs, wallDeltaMs) {
  if (!challengeBufferSegments.length || challengeBufferDuration <= 0) return;
  const dur = challengeBufferDuration;
  const cfg = cfgFor('challenge');
  const rate = cfg.playbackRate || 1;
  const expectedDelta = ((wallDeltaMs || 0) / 1000) * rate;
  let fullLoops = 0;
  if (expectedDelta > dur) fullLoops = Math.min(500, Math.floor(expectedDelta / dur));
  let stopped = false;
  // Loops complets manqués (background prolongé) : batch
  if (fullLoops > 0) {
    const nSegs = challengeBufferSegments.length;
    const totalEnds = fullLoops * nSegs;
    const remaining = state.challenge.target - state.challenge.count;
    const effectiveEnds = Math.min(totalEnds, remaining);
    const oldCount = state.challenge.count;
    state.challenge.count += effectiveEnds;
    const affCounts = {};
    challengeBufferSegments.forEach(seg => { affCounts[seg.affId] = (affCounts[seg.affId] || 0) + fullLoops; });
    Object.keys(affCounts).forEach(affId => {
      const aff = state.affirmations.find(x => x.id === affId);
      if (aff) trackPlayN(aff, affCounts[affId]);
    });
    celebrateMilestoneIfReached(oldCount, state.challenge.count);
    state.challenge.currentIdx = (state.challenge.currentIdx + effectiveEnds) % Math.max(1, validAffs.length);
    if (state.challenge.count >= state.challenge.target) {
      recordChallengeCompletion();
      stopChallenge();
      stopped = true;
    }
  }
  if (stopped) return;
  // Wrap partiel courant
  const mod = (x) => ((x % dur) + dur) % dur;
  const a = mod(prev), b = mod(curr);
  const checkRange = (lo, hi) => {
    challengeBufferSegments.forEach((seg) => {
      if (stopped) return;
      if (seg.endSec > lo && seg.endSec <= hi) {
        const aff = state.affirmations.find(x => x.id === seg.affId);
        if (!aff) return;
        const oldCount = state.challenge.count;
        state.challenge.count++;
        trackPlay(aff);
        celebrateMilestoneIfReached(oldCount, state.challenge.count);
        state.challenge.currentIdx = (state.challenge.currentIdx + 1) % Math.max(1, validAffs.length);
        if (state.challenge.count >= state.challenge.target) {
          recordChallengeCompletion();
          stopChallenge();
          stopped = true;
        }
      }
    });
  };
  if (b >= a) checkRange(a, b);
  else { checkRange(a, dur); checkRange(0, b); }
  if (stopped) return;
  updateChallengeOrbUI();
  updateChallengeEtaLive();
  const nowAff = getCurrentChallengeAff(curr);
  if (nowAff) { challengeShownAffId = nowAff.id; animateCurrentAffIfChanged(nowAff.title); }
  // Throttle saveState : max 1 write toutes les 5s (évite freeze)
  const nowWall = Date.now();
  if (nowWall - lastChallengeSaveWall > 5000) {
    saveState();
    lastChallengeSaveWall = nowWall;
  }
}

function getCurrentChallengeAff(timeSec) {
  if (!challengeBufferSegments.length) return null;
  const dur = challengeBufferDuration;
  const t = ((timeSec % dur) + dur) % dur;
  for (const seg of challengeBufferSegments) {
    if (t >= seg.startSec && t < seg.endSec) return state.affirmations.find(a => a.id === seg.affId);
  }
  for (let i = challengeBufferSegments.length - 1; i >= 0; i--) {
    if (challengeBufferSegments[i].endSec <= t) return state.affirmations.find(a => a.id === challengeBufferSegments[i].affId);
  }
  return null;
}

let lastAnimatedTitle = null;
let challengeShownAffId = null;  // v1.25.1 : dernière affirmation entendue dans le Challenge
function animateCurrentAffIfChanged(title) {
  if (title === lastAnimatedTitle) return;
  lastAnimatedTitle = title;
  animateCurrentAff(title);
}

function clearChallengeBuffer() {
  if (challengeBufferURL) { try { URL.revokeObjectURL(challengeBufferURL); } catch(e){} challengeBufferURL = null; }
  challengeBufferAudio = null;  // libère la RAM
  challengeBufferSegments = [];
  challengeBufferDuration = 0;
  lastChallengeBufferTime = 0;
  lastAnimatedTitle = null;
}

// Retourne la position courante dans le challenge buffer (mix ou <audio>)
function getChallengePlaybackTime() {
  if (mixSourceNode) return getMixCurrentTime();
  const audio = document.getElementById('aff-audio');
  return audio ? audio.currentTime : 0;
}

// Rattrapage stats challenge quand on revient au 1er plan
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.challenge.playing && challengeBufferURL) {
    const ids = state.challenge.affirmationIds || [];
    const validAffs = ids.map(id => state.affirmations.find(a => a.id === id && a.recording)).filter(Boolean);
    const t = getChallengePlaybackTime();
    const nowWall = Date.now();
    processChallengeProgress(lastChallengeBufferTime, t, validAffs, nowWall - lastChallengeTickWall);
    lastChallengeBufferTime = t;
    lastChallengeTickWall = nowWall;
  }
});

function playChallenge() {
  if (!state.challenge.playing) return;
  const legacyAudio = document.getElementById('aff-audio');
  if (legacyAudio) legacyAudio.loop = false;  // fallback legacy
  // Récupère la liste des affirmations valides dans l'ordre de la sélection
  const ids = state.challenge.affirmationIds || [];
  const validAffs = ids
    .map(id => state.affirmations.find(a => a.id === id && a.recording))
    .filter(Boolean);
  if (validAffs.length === 0) { stopChallenge(); return; }

  // L'affirmation courante selon currentIdx
  const idx = state.challenge.currentIdx % validAffs.length;
  const aff = validAffs[idx];

  // Animation glow fade quand on commence une NOUVELLE aff (pas une répétition)
  // On s'appuie sur currentRepeat === 0 : chaque passage par 0 marque une nouvelle aff
  if ((state.challenge.currentRepeat || 0) === 0) {
    animateCurrentAff(aff.title);
  }

  const cfg = cfgFor('challenge');

  // Mode silencieux : bip au lieu de la voix
  // Le bip reste court mais on attend la durée RÉELLE de l'aff (ajustée par la vitesse)
  if (cfg.silentMode) {
    // Double bip SEULEMENT s'il y a plusieurs affs ET qu'on passe à une nouvelle
    const isChange = (state.challenge.currentRepeat || 0) === 0 && validAffs.length > 1;
    playBeep(isChange, cfg.affVolume);
    challengeAudio = null;
    const affDuration = (aff.duration || 3) * 1000;
    const rate = cfg.playbackRate || 1;
    const waitMs = Math.max(400, affDuration / rate);
    challengeTimeout = setTimeout(() => {
      if (!state.challenge.playing) return;
      handleChallengeEnd(aff, validAffs);
    }, waitMs);
    return;
  }

  const audio = document.getElementById('aff-audio');
  audio.src = aff.recording;
  audio.volume = cfg.affVolume;
  audio.playbackRate = cfg.playbackRate;
  // Pas de mode nuit sur le Challenge (voix normale, pas d'EQ)
  applyNightMode(false);
  audio.play().catch(() => { toast(t('toast_play_error')); stopChallenge(); });
  challengeAudio = audio;
  updateMediaSessionMetadata(aff, 'Challenge');

  audio.onended = () => {
    if (!state.challenge.playing) return;
    handleChallengeEnd(aff, validAffs);
  };
}

// Extrait la logique fin lecture challenge pour partager entre audio + bip
function handleChallengeEnd(aff, validAffs) {
  if (!state.challenge.playing) return;

  const cfg = cfgFor('challenge');
  const oldCount = state.challenge.count;
  state.challenge.count++;
  const newCount = state.challenge.count;

  // Gestion des répétitions : chaque aff peut être répétée N fois de suite
  const repeatTarget = aff.repeatCount || 1;
  if (!state.challenge.currentRepeat) state.challenge.currentRepeat = 0;
  state.challenge.currentRepeat++;
  if (state.challenge.currentRepeat < repeatTarget) {
    // Rejouer la même aff
  } else {
    state.challenge.currentRepeat = 0;
    state.challenge.currentIdx = (state.challenge.currentIdx + 1) % validAffs.length;
  }
  trackPlay(aff);
  saveState();

  // Toasts "Bravo" à chaque palier atteint
  celebrateMilestoneIfReached(oldCount, newCount);

  // Update UI (nouveau orb)
  updateChallengeOrbUI();
  updateChallengeEtaLive();

  if (state.challenge.count >= state.challenge.target) {
    recordChallengeCompletion();
    stopChallenge();
    return;
  }

  // Pause entre deux affs via audio silencieux (évite throttle en background)
  const audio = document.getElementById('aff-audio');
  const pauseSec = Math.max(0, cfg.pauseBetween || 0);
  playSilenceThen(pauseSec, audio, () => {
    if (!state.challenge.playing) return;
    playChallenge();
  });
}

// Éditeur de note : A gauche / B droite 50/50 avec slider au milieu
function openNoteEditor(noteId) {
  let note = noteId ? state.notes.find(n => n.id === noteId) : null;
  if (!note) {
    note = { id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
             title: '', realityA: '', realityB: '',
             createdAt: Date.now(), updatedAt: Date.now() };
  }
  const isNew = !noteId;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active note-editor-overlay';
  overlay.innerHTML = `
    <div class="note-editor">
      <div class="note-editor-head">
        <input type="text" class="note-title-input" id="note-title" placeholder="Titre de la note..." value="${escapeHtml(note.title)}" />
        <button class="note-close-btn" id="note-close" aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="note-split" id="note-split">
        <div class="note-pane note-pane-a" id="note-pane-a">
          <div class="note-pane-label"><span class="note-letter note-letter-a">A</span> Réalité actuelle</div>
          <textarea class="note-area" id="note-text-a" placeholder="Décris ce que tu vis maintenant...">${escapeHtml(note.realityA)}</textarea>
        </div>
        <div class="note-divider" id="note-divider" aria-label="Redimensionner">
          <div class="note-divider-bar"></div>
        </div>
        <div class="note-pane note-pane-b" id="note-pane-b">
          <div class="note-pane-label"><span class="note-letter note-letter-b">B</span> Réalité désirée</div>
          <textarea class="note-area" id="note-text-b" placeholder="Décris ce que tu veux manifester...">${escapeHtml(note.realityB)}</textarea>
        </div>
      </div>

      <div class="note-editor-actions">
        ${!isNew ? `<button class="btn-secondary danger" id="note-delete">Supprimer</button>` : ''}
        <button class="btn-primary" id="note-save">${isNew ? 'Créer' : 'Enregistrer'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Slider au milieu : drag horizontal pour redimensionner A/B
  const split = overlay.querySelector('#note-split');
  const divider = overlay.querySelector('#note-divider');
  let ratioA = 0.5;  // 50/50 par défaut
  let dragging = false;

  const applyRatio = (r) => {
    r = Math.max(0.15, Math.min(0.85, r));
    ratioA = r;
    split.style.gridTemplateColumns = `${(r*100).toFixed(1)}% 6px auto`;
  };
  applyRatio(0.5);

  const startDrag = (e) => {
    dragging = true;
    e.preventDefault();
    document.body.style.userSelect = 'none';
  };
  const onMove = (e) => {
    if (!dragging) return;
    const rect = split.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    applyRatio(x / rect.width);
  };
  const endDrag = () => {
    dragging = false;
    document.body.style.userSelect = '';
  };
  divider.addEventListener('mousedown', startDrag);
  divider.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('touchend', endDrag);

  // Fermer sans sauver
  const closeOverlay = () => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('mouseup', endDrag);
    window.removeEventListener('touchend', endDrag);
    overlay.remove();
  };
  document.getElementById('note-close').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });

  // Sauver
  document.getElementById('note-save').addEventListener('click', () => {
    note.title = (document.getElementById('note-title').value || '').trim();
    note.realityA = document.getElementById('note-text-a').value || '';
    note.realityB = document.getElementById('note-text-b').value || '';
    note.updatedAt = Date.now();
    if (isNew) {
      state.notes.push(note);
    } else {
      const idx = state.notes.findIndex(n => n.id === note.id);
      if (idx >= 0) state.notes[idx] = note;
    }
    saveState();
    closeOverlay();
    renderNotes();
    toast(isNew ? 'Note créée ✓' : 'Note enregistrée ✓');
  });

  // Supprimer (seulement en édition)
  if (!isNew) {
    let deletePending = false;
    document.getElementById('note-delete')?.addEventListener('click', (ev) => {
      const btn = ev.target;
      if (!deletePending) {
        deletePending = true;
        btn.textContent = '⚠️ Confirmer ?';
        setTimeout(() => { deletePending = false; btn.textContent = 'Supprimer'; }, 3000);
        return;
      }
      state.notes = state.notes.filter(n => n.id !== note.id);
      saveState();
      closeOverlay();
      renderNotes();
      toast('Note supprimée');
    });
  }

  // Autofocus titre si nouvelle
  if (isNew) setTimeout(() => document.getElementById('note-title').focus(), 50);
}

// === Agrège les stats par jour / semaine / mois selon la plage ===
function aggregateStats(nDays, mode, byDay) {
  const todayStr = todayKey();
  const data = [];
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  if (mode === 'day') {
    const limit = (nDays === Infinity) ? 60 : nDays;  // cap pour pas déborder visuellement
    for (let i = limit - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = fmt(d);
      const plays = (byDay[k] || {}).plays || 0;
      data.push({
        label: d.getDate().toString(),
        shortLabel: ['D','L','M','M','J','V','S'][d.getDay()],
        count: plays, isToday: k === todayStr, date: k,
      });
    }
  } else if (mode === 'week') {
    const nWeeks = Math.min(26, Math.ceil(nDays / 7));
    for (let i = nWeeks - 1; i >= 0; i--) {
      const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate() - i * 7);
      const weekStart = new Date(weekEnd); weekStart.setDate(weekEnd.getDate() - 6);
      let count = 0;
      for (let d = new Date(weekStart); d <= weekEnd; d.setDate(d.getDate() + 1)) {
        count += ((byDay[fmt(d)] || {}).plays) || 0;
      }
      data.push({
        label: `${weekStart.getDate()}/${weekStart.getMonth()+1}`,
        shortLabel: `S${Math.ceil(weekStart.getDate()/7)}`,
        count, isToday: false,
      });
    }
  } else if (mode === 'month') {
    const nMonths = Math.min(24, Math.max(3, Math.ceil(nDays / 30)));
    for (let i = nMonths - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      const next = new Date(d); next.setMonth(d.getMonth() + 1);
      let count = 0;
      for (let dd = new Date(d); dd < next; dd.setDate(dd.getDate() + 1)) {
        count += ((byDay[fmt(dd)] || {}).plays) || 0;
      }
      data.push({
        label: ['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()],
        shortLabel: ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'][d.getMonth()],
        count, isToday: false,
      });
    }
  }
  return data;
}

// === Heatmap : commence au 1er jour d'usage (semaine du lundi), étendue à 52 semaines max ===
function buildHeatmap(byDay, maxWeeks = 52) {
  const today = new Date(); today.setHours(0,0,0,0);
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const dow = today.getDay(); // 0=dim, 1=lun, ..., 6=sam
  const toMonday = (dow === 0 ? 6 : dow - 1);

  // 1) Trouve le 1er jour d'utilisation (plus ancienne date avec plays > 0 dans byDay)
  const activeKeys = Object.keys(byDay || {}).filter(k => (byDay[k] || {}).plays > 0).sort();
  let firstUseDate = activeKeys.length > 0 ? new Date(activeKeys[0] + 'T00:00:00') : new Date(today);

  // 2) Démarre au lundi de la semaine du 1er usage (pour aligner la grille)
  const firstDow = firstUseDate.getDay();
  const firstToMonday = (firstDow === 0 ? 6 : firstDow - 1);
  const start = new Date(firstUseDate);
  start.setDate(firstUseDate.getDate() - firstToMonday);

  // 3) Fin : dimanche de la semaine en cours
  const end = new Date(today);
  end.setDate(today.getDate() + (dow === 0 ? 0 : 7 - dow));

  // 4) Si plus de maxWeeks semaines entre start et end, on tronque le début (mode glissant)
  const totalDays = Math.ceil((end - start) / 86400000) + 1;
  const totalWeeks = Math.ceil(totalDays / 7);
  if (totalWeeks > maxWeeks) {
    start.setDate(start.getDate() + (totalWeeks - maxWeeks) * 7);
  }

  const cells = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const isPast = d <= today;
    const k = fmt(d);
    const plays = isPast ? (((byDay[k] || {}).plays) || 0) : null;
    cells.push({ date: k, plays, future: !isPast, month: d.getMonth() });
  }
  return cells;
}

// v1.30.0 : onglet « Routine » des stats (série, record, semaine, mois)
function routineDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function routineAddDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function routineMonday(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function routineStatsHTML() {
  const g = routineGoal();
  if (!g.minutes) {
    return `<div class="routine-empty">
      <p class="sublabel">${t('routine_none_set')}</p>
      <button class="btn-primary" id="routine-go-profile">${t('routine_go_profile')}</button>
    </div>`;
  }
  const lang = state.settings.language === 'en' ? 'en-GB' : 'fr-FR';
  const rd = state.stats.routineDays || {};
  const msOf = k => rd[k] || 0;
  const ok = k => msOf(k) >= g.dayMs;  // v1.34.0 : toutes les séances du jour
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayK = routineDateKey(today);
  const keys = Object.keys(rd).filter(k => rd[k] > 0).sort();
  const first = keys.length ? new Date(keys[0] + 'T00:00:00') : new Date(today);
  let streak = 0, record = 0, unitLabel;
  if (g.days === 7) {
    // Série de jours : aujourd'hui compte s'il est fait, sinon on part d'hier (la journée n'est pas finie)
    let d = ok(todayK) ? new Date(today) : routineAddDays(today, -1);
    while (d >= first && ok(routineDateKey(d))) { streak++; d = routineAddDays(d, -1); }
    let run = 0;
    for (let d2 = new Date(first); d2 <= today; d2 = routineAddDays(d2, 1)) {
      if (ok(routineDateKey(d2))) { run++; record = Math.max(record, run); } else run = 0;
    }
    unitLabel = t('routine_streak_days');
  } else {
    // 3 ou 5 jours par semaine : série de semaines réussies (lundi → dimanche)
    const weekOk = (mon) => { let n = 0; for (let i = 0; i < 7; i++) if (ok(routineDateKey(routineAddDays(mon, i)))) n++; return n >= g.days; };
    const thisMon = routineMonday(today), firstMon = routineMonday(first);
    let w = weekOk(thisMon) ? new Date(thisMon) : routineAddDays(thisMon, -7);
    while (w >= firstMon && weekOk(w)) { streak++; w = routineAddDays(w, -7); }
    let run = 0;
    for (let w2 = new Date(firstMon); w2 <= thisMon; w2 = routineAddDays(w2, 7)) {
      if (weekOk(w2)) { run++; record = Math.max(record, run); } else run = 0;
    }
    unitLabel = t('routine_streak_weeks');
  }
  record = Math.max(record, streak);

  // Cette semaine
  const mon = routineMonday(today);
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = routineAddDays(mon, i), k = routineDateKey(d);
    week.push({ ms: msOf(k), isToday: k === todayK, label: d.toLocaleDateString(lang, { weekday: 'narrow' }).toUpperCase() });
  }
  const weekDone = week.filter(x => x.ms >= g.dayMs).length;
  const maxMs = Math.max(g.dayMs, ...week.map(x => x.ms)) * 1.15;

  // Ce mois-ci
  const y = today.getFullYear(), mo = today.getMonth();
  const lead = (new Date(y, mo, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, mo + 1, 0).getDate();
  let monthMs = 0;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="rcal-cell blank"></div>');
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(y, mo, day), k = routineDateKey(d), ms = msOf(k);
    monthMs += ms;
    const cls = d > today ? 'future' : ms >= g.dayMs ? 'done' : ms > 0 ? 'part' : '';
    cells.push(`<div class="rcal-cell ${cls} ${k === todayK ? 'today' : ''}"><span>${day}</span></div>`);
  }
  const heads = week.map(x => `<div>${x.label}</div>`).join('');
  const allMs = Object.values(rd).reduce((a, b) => a + (b || 0), 0);
  const monthName = today.toLocaleDateString(lang, { month: 'long', year: 'numeric' });

  return `
    <p class="sublabel routine-goal-line">${t('routine_goal_line', { m: g.minutes, n: g.times, d: g.days })}</p>
    <div class="stats-grid">
      <div class="stats-card primary">
        <div class="stats-card-icon">🔥</div>
        <div class="stats-card-val">${streak}</div>
        <div class="stats-card-label">${unitLabel}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon">🏆</div>
        <div class="stats-card-val">${record}</div>
        <div class="stats-card-label">${t('routine_record')}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon">✅</div>
        <div class="stats-card-val">${weekDone}<span class="routine-of"> / ${g.days}</span></div>
        <div class="stats-card-label">${t('routine_week_done')}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon">⏱️</div>
        <div class="stats-card-val">${routineSeancesOf(todayK)}<span class="routine-of"> / ${g.times}</span></div>
        <div class="stats-card-label">${t('routine_today_sessions')}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon">📅</div>
        <div class="stats-card-val">${fmtListenTime(monthMs / 1000)}</div>
        <div class="stats-card-label">${t('routine_month_time')}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-icon">✨</div>
        <div class="stats-card-val">${fmtListenTime(allMs / 1000)}</div>
        <div class="stats-card-label">${t('routine_all_time')}</div>
      </div>
    </div>

    <div class="h3" style="margin-top:24px">${t('routine_week_title')}</div>
    <div class="stats-chart routine-chart">
      ${week.map(x => `
        <div class="chart-col">
          <div class="chart-bar-wrap">
            <div class="routine-goal-tick" style="bottom:${(g.dayMs / maxMs * 100).toFixed(1)}%"></div>
            <div class="chart-bar ${x.isToday ? 'today' : ''} ${x.ms >= g.dayMs ? '' : 'below'}" style="height:${(x.ms / maxMs * 100).toFixed(1)}%"></div>
          </div>
          <div class="chart-label ${x.isToday ? 'today' : ''}">${x.label}</div>
          <div class="chart-count">${x.ms >= 60000 ? Math.floor(x.ms / 60000) + ' min' : ''}</div>
        </div>
      `).join('')}
    </div>

    <div class="h3 routine-month-h" style="margin-top:24px">${escapeHtml(monthName)}</div>
    <div class="routine-cal-wrap">
      <div class="rcal rcal-head">${heads}</div>
      <div class="rcal">${cells.join('')}</div>
      <div class="rcal-legend">
        <span class="rcal-dot done"></span>${t('routine_legend_done')}
        <span class="rcal-dot part"></span>${t('routine_legend_part')}
      </div>
    </div>
    <p class="sublabel routine-since">${t('routine_since')}</p>
  `;
}

function renderStats() {
  const s = state.stats;
  const today = todayKey();
  const todayStats = s.byDay[today] || { plays: 0, loops: 0, seconds: 0 };

  // Plage sélectionnée (7d par défaut)
  if (!state.ui) state.ui = {};
  const statsRange = state.ui.statsRange || '7d';
  const RANGE_DAYS = { '7d': 7, '30d': 30, '3m': 90, '1y': 365, 'all': Infinity };
  const RANGE_LABEL = { '7d': '7j', '30d': '30j', '3m': '3 mois', '1y': '1 an', 'all': 'Tout' };
  const nDays = RANGE_DAYS[statsRange];
  // Mode d'agrégation selon la plage : jour / semaine / mois
  let aggMode = 'day';
  if (nDays === Infinity) aggMode = 'month';
  else if (nDays > 120) aggMode = 'month';
  else if (nDays > 31) aggMode = 'week';
  const chartData = aggregateStats(nDays === Infinity ? 365 : nDays, aggMode, s.byDay);
  const maxDay = Math.max(1, ...chartData.map(d => d.count));
  // Semaine total (toujours 7 derniers jours)
  let weekTotal = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    weekTotal += (s.byDay[k] || {}).plays || 0;
  }

  // Heatmap annuelle (52 semaines)
  const heatmapCells = buildHeatmap(s.byDay, 52);
  const heatmapMax = Math.max(1, ...heatmapCells.map(c => c.plays || 0));
  const intensityOf = (plays) => {
    if (plays === null) return 'future';
    if (plays === 0) return 'level-0';
    const r = plays / heatmapMax;
    if (r < 0.25) return 'level-1';
    if (r < 0.5) return 'level-2';
    if (r < 0.75) return 'level-3';
    return 'level-4';
  };

  // Top affirmations
  const topAffs = Object.entries(s.byAffirmation || {})
    .map(([id, data]) => {
      const aff = state.affirmations.find(a => a.id === id);
      return aff ? { title: aff.title, plays: data.plays, lastPlayed: data.lastPlayed } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.plays - a.plays)
    .slice(0, 10);

  // Top playlists
  const topPlaylists = Object.entries(s.byPlaylist || {})
    .map(([id, data]) => {
      const g = state.groups.find(g => g.id === id);
      return g ? { name: g.name, plays: data.plays } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.plays - a.plays)
    .slice(0, 5);

  const activeDays = Object.keys(s.byDay || {}).filter(k => s.byDay[k].plays > 0).length;

  // v1.25.1 : onglets Résumé / Top / Challenges (le dernier ouvert est retenu)
  const statsTab = ['resume', 'routine', 'top', 'challenges'].includes(state.ui.statsTab) ? state.ui.statsTab : 'resume';
  const statsTabsHTML = `
    <div class="player-mode-chips stats-tabs">
      <button class="pm-chip ${statsTab==='resume'?'active':''}" data-st="resume"><span>${t('stats_tab_summary')}</span></button>
      <button class="pm-chip ${statsTab==='routine'?'active':''}" data-st="routine"><span>${t('stats_tab_routine')}</span></button>
      <button class="pm-chip ${statsTab==='top'?'active':''}" data-st="top"><span>${t('stats_tab_top')}</span></button>
      <button class="pm-chip ${statsTab==='challenges'?'active':''}" data-st="challenges"><span>${t('stats_tab_challenges')}</span></button>
    </div>`;
  const chNow = state.challenge || {};
  const chNowAffs = (chNow.affirmationIds || []).map(id => state.affirmations.find(a => a.id === id)).filter(Boolean);
  const chNowPct = chNow.target ? Math.min(100, Math.round((chNow.count || 0) / chNow.target * 100)) : 0;
  const currentChallengeHTML = chNowAffs.length === 0 ? `<p class="sublabel stats-empty-line">${t('stats_ch_no_current')}</p>` : `
    <div class="ch-stat-card ch-stat-current">
      <div class="ch-stat-head">
        <div class="ch-stat-trophy">🎯</div>
        <div class="ch-stat-head-text">
          <div class="ch-stat-target">${fmtN(chNow.count || 0)} / ${fmtN(chNow.target)}</div>
          <div class="ch-stat-done">${(chNow.count || 0) >= chNow.target ? t('ch_goal_reached') : chNowPct + '\u00A0%'}</div>
        </div>
      </div>
      <div class="ch-progress"><div class="ch-progress-fill" style="width:${chNowPct}%"></div></div>
      <div class="ch-stat-meta">
        ${chNow.startedAt ? `<div class="ch-stat-row"><span>📅 ${t('stats_ch_started')}</span><strong>${new Date(chNow.startedAt).toLocaleDateString('fr-FR')}</strong></div>` : ''}
        <div class="ch-stat-row"><span>⏳ ${t('stats_ch_left')}</span><strong>${fmtN(Math.max(0, chNow.target - (chNow.count || 0)))}</strong></div>
      </div>
      <div class="ch-stat-affs">
        <div class="ch-stat-affs-label">🎙️ Affirmations (${chNowAffs.length})</div>
        ${chNowAffs.map(a => `<div class="ch-stat-aff-item">• ${escapeHtml(a.title)}</div>`).join('')}
      </div>
    </div>`;

  // v1.25.1 : calendrier à cases de taille normale quand il y a peu de semaines
  const heatWeeks = Math.ceil(heatmapCells.length / 7);
  const heatSmall = heatWeeks <= 18;

  document.getElementById('page-stats').innerHTML = `
    <div class="eyebrow">${t('stats_eyebrow')}</div>
    <h1 class="h1">${t('stats_title_1')} <span class="dot">${t('stats_title_2')}</span></h1>

    ${s.totalPlays === 0 ? `
      <div class="empty-state">
        <div class="big">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-5"/></svg>
        </div>
        <p>${t('stats_empty')}</p>
      </div>
    ` : `
      ${statsTabsHTML}
      ${statsTab === 'resume' ? `
      <div class="stats-grid">
        <div class="stats-card primary">
          <div class="stats-card-icon">🔥</div>
          <div class="stats-card-val">${s.streak || 0}</div>
          <div class="stats-card-label">${t('stats_streak')}</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-icon">📅</div>
          <div class="stats-card-val">${fmtN(todayStats.plays)}</div>
          <div class="stats-card-label">${t('stats_today')}</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-icon">📊</div>
          <div class="stats-card-val">${fmtN(weekTotal)}</div>
          <div class="stats-card-label">${t('stats_week')}</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-icon">✨</div>
          <div class="stats-card-val">${fmtN(s.totalPlays)}</div>
          <div class="stats-card-label">${t('stats_total')}</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-icon">🏆</div>
          <div class="stats-card-val">${fmtN(s.bestDay.plays || 0)}</div>
          <div class="stats-card-label">${t('stats_best_day')}</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-icon">⏱️</div>
          <div class="stats-card-val">${fmtListenTime(s.totalSeconds || 0)}</div>
          <div class="stats-card-label">${t('stats_minutes')}</div>
        </div>
      </div>

      <div class="stats-chart-head">
        <div class="h3" style="margin:0">Activité</div>
        <div class="stats-range-chips">
          ${['7d','30d','3m','1y','all'].map(r => `
            <button class="sr-chip ${statsRange===r?'active':''}" data-sr="${r}">${RANGE_LABEL[r]}</button>
          `).join('')}
        </div>
      </div>
      <div class="stats-chart ${aggMode==='day' && chartData.length <= 7 ? '' : 'compact'}">
        ${chartData.map(d => `
          <div class="chart-col">
            <div class="chart-bar-wrap">
              <div class="chart-bar ${d.isToday ? 'today' : ''}" style="height:${(d.count / maxDay) * 100}%" title="${d.label}: ${fmtN(d.count)} aff."></div>
            </div>
            <div class="chart-label ${d.isToday ? 'today' : ''}">${aggMode==='day' && chartData.length<=14 ? d.shortLabel : (aggMode==='month' ? d.label : '')}</div>
            ${chartData.length <= 14 ? `<div class="chart-count">${d.count ? fmtN(d.count) : ''}</div>` : ''}
          </div>
        `).join('')}
      </div>

      <!-- HEATMAP (démarre au 1er jour d'usage, max 52 semaines glissantes) -->
      <div class="h3" style="margin-top:28px">${heatmapCells.length > 7 * 50 ? 'Ton année' : 'Depuis tes débuts'}</div>
      <div class="heatmap-wrap">
        <div class="heatmap ${heatSmall ? 'heatmap-small' : ''}" ${heatSmall ? '' : `style="aspect-ratio: ${heatWeeks} / 7"`}>
          ${heatmapCells.map(c => `
            <div class="heatmap-cell ${intensityOf(c.plays)}" title="${c.date}${c.plays !== null ? ' · '+fmtN(c.plays)+' aff.' : ''}"></div>
          `).join('')}
        </div>
        <div class="heatmap-legend">
          <span>Moins</span>
          <div class="heatmap-cell level-0"></div>
          <div class="heatmap-cell level-1"></div>
          <div class="heatmap-cell level-2"></div>
          <div class="heatmap-cell level-3"></div>
          <div class="heatmap-cell level-4"></div>
          <span>Plus</span>
        </div>
      </div>
      ` : ''}

      ${statsTab === 'top' ? `
      ${topAffs.length === 0 && topPlaylists.length === 0 ? `<p class="sublabel stats-empty-line">${t('stats_top_empty')}</p>` : ''}
      ${topAffs.length > 0 ? `
        <div class="h3" style="margin-top:8px">${t('stats_top_affs')}</div>
        ${topAffs.map((a, i) => `
          <div class="top-row">
            <div class="top-rank">${i+1}</div>
            <div class="top-content">
              <div class="top-title">${escapeHtml(a.title)}</div>
              <div class="top-sub">${timeAgo(a.lastPlayed)}</div>
            </div>
            <div class="top-count">${fmtN(a.plays)}×</div>
          </div>
        `).join('')}
      ` : ''}

      ${topPlaylists.length > 0 ? `
        <div class="h3" style="margin-top:28px">${t('stats_top_playlists')}</div>
        ${topPlaylists.map((p, i) => `
          <div class="top-row">
            <div class="top-rank">${i+1}</div>
            <div class="top-content">
              <div class="top-title">${escapeHtml(p.name)}</div>
            </div>
            <div class="top-count">${fmtN(p.plays)}×</div>
          </div>
        `).join('')}
      ` : ''}

      ` : ''}

      ${statsTab === 'routine' ? routineStatsHTML() : ''}

      ${statsTab === 'challenges' ? `
      <div class="h3" style="margin-top:8px">${t('stats_ch_current')}</div>
      ${currentChallengeHTML}
      <div class="h3" style="margin-top:28px">🏆 ${t('stats_ch_done_title')}</div>
      ${(s.completedChallenges || []).length === 0 ? `<p class="sublabel stats-empty-line">${t('stats_ch_none')}</p>` : ''}
      ${(s.completedChallenges || []).length > 0 ? `
        <div class="challenges-stats-list">
          ${[...s.completedChallenges].reverse().map((cc) => {
            const dt = new Date(cc.completedAt);
            const started = cc.startedAt ? new Date(cc.startedAt) : null;
            const durMs = started ? (cc.completedAt - cc.startedAt) : 0;
            const days = durMs > 0 ? Math.max(1, Math.round(durMs / 86400000)) : null;
            const titles = cc.affirmationTitles || [];
            return `
              <div class="ch-stat-card">
                <div class="ch-stat-head">
                  <div class="ch-stat-trophy">🏆</div>
                  <div class="ch-stat-head-text">
                    <div class="ch-stat-target">${fmtN(cc.target)} affirmations</div>
                    <div class="ch-stat-done">Terminé ✨</div>
                  </div>
                </div>
                <div class="ch-stat-meta">
                  ${started ? `<div class="ch-stat-row"><span>📅 Commencé</span><strong>${started.toLocaleDateString('fr-FR')}</strong></div>` : ''}
                  <div class="ch-stat-row"><span>🏁 Terminé</span><strong>${dt.toLocaleDateString('fr-FR')}</strong></div>
                  ${days ? `<div class="ch-stat-row"><span>⏱️ Durée</span><strong>${days} jour${days > 1 ? 's' : ''}</strong></div>` : ''}
                </div>
                ${titles.length > 0 ? `
                  <div class="ch-stat-affs">
                    <div class="ch-stat-affs-label">🎙️ Affirmations utilisées (${titles.length})</div>
                    ${titles.map(tt => `<div class="ch-stat-aff-item">• ${escapeHtml(tt)}</div>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
      ` : ''}
    `}
  `;

  // Onglets des stats
  document.querySelectorAll('[data-st]').forEach(b => {
    b.addEventListener('click', () => {
      state.ui.statsTab = b.dataset.st;
      saveState();
      renderStats();
      window.scrollTo(0, 0);
    });
  });
  // v1.30.0 : pas encore de routine → ouvre le Profil, sur « Ma routine »
  document.getElementById('routine-go-profile')?.addEventListener('click', () => {
    switchTab('settings');
    setTimeout(() => document.getElementById('routine-section')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 60);
  });

  // Bind des chips de plage
  document.querySelectorAll('[data-sr]').forEach(b => {
    b.addEventListener('click', () => {
      state.ui.statsRange = b.dataset.sr;
      saveState();
      renderStats();
    });
  });
}

function openAddAffModal(defaultGroupId) {
  if (state.groups.length === 0) { toast(t('toast_need_group')); return; }
  openAffModal(null, defaultGroupId);
}

function openEditAffModal(id) {
  const aff = state.affirmations.find(a => a.id === id);
  if (aff) openAffModal(aff);
}

function openAffModal(existing, defaultGroupId) {
  const isEdit = !!existing;
  const initialGroup = defaultGroupId || (existing && existing.groupId) || state.groups[0].id;
  const aff = existing || { id: uid(), title: '', groupId: initialGroup, recording: null, duration: 0 };

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active modal-overlay-full';
  overlay.innerHTML = `
    <div class="modal aff-full">
      <div class="modal-title">${isEdit ? t('edit_aff') : t('new_aff')} <span class="accent">${t('word_affirmation')}</span></div>

      <div class="h3">${t('title')}</div>
      <textarea class="input-text aff-title-textarea" id="aff-title" placeholder="${t('aff_placeholder')}" rows="2">${escapeHtml(aff.title)}</textarea>

      <div class="h3">${t('group')}</div>
      <select class="input-select" id="aff-group">
        ${state.groups.map(g => `<option value="${g.id}" ${g.id===aff.groupId?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}
      </select>

      <div class="h3">${t('voice_recording')}</div>
      <div class="rec-wrapper">
        <div class="rec-timer" id="rec-timer">${formatDur(aff.duration)}</div>
        <button class="rec-btn" id="rec-btn">●</button>
        <p class="sublabel" style="margin-top:12px" id="rec-hint">${aff.recording ? t('rec_exists') : t('rec_tap')}</p>
        <div id="rec-playback-wrap" style="margin-top:8px; display:${aff.recording ? 'flex' : 'none'}; gap:10px; justify-content:center">
          <button class="playback-btn" id="rec-play">${t('listen')}</button>
          <button class="playback-btn" id="rec-delete" style="color:var(--danger)">${t('erase')}</button>
        </div>
      </div>

      <div class="h3">Répétitions à la suite</div>
      <div class="sublabel" style="margin-bottom:10px; font-size:12px">Combien de fois cette aff est lue avant de passer à la suivante</div>
      <div class="repeat-chips">
        ${[1, 3, 5, 10, 20, 50].map(n => `
          <button class="repeat-chip ${(aff.repeatCount||1)===n?'active':''}" data-repeat="${n}">${n}×</button>
        `).join('')}
      </div>

      ${isEdit ? `<button class="btn-secondary danger" id="aff-delete" style="margin-top:22px">${t('delete')}</button>` : ''}
      <div class="modal-full-actions">
        <button class="btn-secondary" id="aff-cancel">${t('cancel')}</button>
        <button class="btn-primary" id="aff-save">${isEdit ? t('save') : t('create')}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Auto-grow du textarea titre pour voir toute la phrase sur plusieurs lignes
  const titleTA = document.getElementById('aff-title');
  const autoGrowTitle = () => {
    titleTA.style.height = 'auto';
    titleTA.style.height = Math.min(titleTA.scrollHeight, 180) + 'px';
  };
  titleTA.addEventListener('input', autoGrowTitle);
  // Entrée crée une nouvelle ligne (comportement textarea natif) mais on
  // bloque la soumission accidentelle du form parent si jamais
  titleTA.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) e.preventDefault(); });
  setTimeout(autoGrowTitle, 10);  // premier sizing après que le DOM soit layouté

  let currentRecording = aff.recording;
  let currentDuration = aff.duration;
  let mediaRecorder = null;
  let recChunks = [];
  let recStartTime = 0;
  let recTimerInterval = null;

  const recBtn = document.getElementById('rec-btn');
  const recTimer = document.getElementById('rec-timer');

  recBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recBtn.classList.remove('recording');
      recBtn.textContent = '●';
      clearInterval(recTimerInterval);
    } else {
      // Hors du try : si getUserMedia a marché mais que la suite plante
      // (new MediaRecorder, start...), on doit quand même fermer le micro,
      // sinon il reste bloqué et la tentative d'après fait "micro occupé".
      let micCleanup = null;
      try {
        const { stream, cleanup } = await getProcessedMicStream();
        micCleanup = cleanup;
        recChunks = [];
        mediaRecorder = new MediaRecorder(stream, getBestRecorderOptions());
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recChunks.push(e.data); };
        mediaRecorder.onerror = (ev) => {
          const err = ev && ev.error;
          logEvent('mic_recorder_error', { name: err && err.name, msg: err && err.message });
        };
        mediaRecorder.onstop = () => {
          cleanup();
          // Si le recorder s'est arrêté tout seul (casque BT déco, erreur...),
          // on remet le bouton à zéro (sans effet si déjà fait au clic)
          recBtn.classList.remove('recording');
          recBtn.textContent = '●';
          clearInterval(recTimerInterval);
          // Utilise le vrai mimeType du MediaRecorder (webm, mp4, ogg selon le navigateur)
          // Sinon Safari iOS enregistre en mp4 mais on marquait "audio/webm" → audio illisible
          // Strip ;codecs=... pour éviter que le data URL ait deux `;`
          // ce qui casse la lecture sur Chrome Android (preview "Erreur de lecture")
          const rawMime = mediaRecorder.mimeType || (recChunks[0] && recChunks[0].type) || 'audio/webm';
          const realMime = rawMime.split(';')[0].trim();
          const blob = new Blob(recChunks, { type: realMime });
          // Enregistrement vide (0 octet) : on garde l'ancien s'il y en avait un
          if (!blob.size || recChunks.length === 0) {
            logEvent('record_empty', { mime: rawMime, ms: Date.now() - recStartTime });
            toast(t('toast_rec_empty'));
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            currentRecording = reader.result;
            currentDuration = (Date.now() - recStartTime) / 1000;
            recTimer.textContent = formatDur(currentDuration);
            toast(t('toast_recorded'));
            refreshRecButtons();
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        recStartTime = Date.now();
        recBtn.classList.add('recording');
        recBtn.textContent = '■';
        recTimerInterval = setInterval(() => {
          recTimer.textContent = formatDur((Date.now() - recStartTime) / 1000);
        }, 100);
      } catch(e) {
        if (micCleanup) { try { micCleanup(); } catch(_) {} }
        mediaRecorder = null;
        const name = e && e.name;
        let msg = t('toast_mic_error');
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') msg = '🎤 Permission micro refusée';
        else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') msg = '🎤 Aucun micro trouvé';
        else if (name === 'OverconstrainedError') msg = '🎤 Micro incompatible (casque BT ?). Débranche et réessaye.';
        else if (name === 'NotReadableError') msg = '🎤 Micro occupé par une autre app. Ferme-les et réessaye.';
        logEvent('mic_record_fail', { name, msg: e && e.message, micOpened: !!micCleanup });
        toast(msg);
      }
    }
  });

    // Preview playback via playPreviewRobust (dataURL → Blob URL + canplaythrough)
  // Vitesse TOUJOURS 1x pour entendre ta vraie voix, peu importe la vitesse du Player/Challenge
  function playPreview() {
    if (!currentRecording) return;
    playPreviewRobust(currentRecording, state.settings.affVolume, 'editor-rec-play');
  }

  function refreshRecButtons() {
    const wrap = document.getElementById('rec-playback-wrap');
    const hint = document.getElementById('rec-hint');
    if (!wrap) return;
    if (currentRecording) {
      wrap.style.display = 'flex';
      if (hint) hint.textContent = t('rec_exists');
    } else {
      wrap.style.display = 'none';
      if (hint) hint.textContent = t('rec_tap');
    }
  }

  // Utilise UNIQUEMENT reattachPlaybackHandlers (onclick =) pour éviter
  // les addEventListener qui s'empilent → sinon la popup Effacer vient 2x
  function reattachPlaybackHandlers() {
    const playBtn = document.getElementById('rec-play');
    const delBtn = document.getElementById('rec-delete');

// v1.25.1 : chiffres lisibles (1 000, 10 000) avec une vraie espace qui ne se coupe pas
function fmtN(n) {
  n = Math.round(Number(n) || 0);
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
}
// v1.25.1 : temps d'écoute en minutes, heures, jours (45 min, 3 h 20, 2 j 5 h)
function fmtListenTime(sec) {
  const min = Math.floor((Number(sec) || 0) / 60);
  if (min < 60) return min + '\u00A0min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return h + '\u00A0h' + (m ? '\u00A0' + String(m).padStart(2, '0') : '');
  const d = Math.floor(h / 24), hh = h % 24;
  const dLabel = (state.settings.language === 'en') ? 'd' : 'j';
  return d + '\u00A0' + dLabel + (hh ? '\u00A0' + hh + '\u00A0h' : '');
}

function formatDur(sec) {
  sec = Math.max(0, Math.round(sec));
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}

function exportData(withAudio) {
  const data = {
    groups: state.groups,
    affirmations: withAudio ? state.affirmations : state.affirmations.map(a => ({...a, recording: null})),
    settings: state.settings,
    stats: state.stats,
    challenge: state.challenge,  // Challenge en cours (count, target, startedAt, affs sélectionnées...)
    notes: state.notes || [],    // Notes du journal
    ui: state.ui || {},          // État UI (mode player, playlists ouvertes...)
    onboardingDone: state.onboardingDone,
    version: 2,
    exportDate: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${t('backup_name')}${new Date().toISOString().slice(0,10)}${withAudio?'-full':''}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toast_exported'));
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!await confirmAsync(t('confirm_import'), 'Importer')) return;
      if (data.groups) state.groups = data.groups;
      if (data.affirmations) state.affirmations = data.affirmations;
      if (data.settings) state.settings = Object.assign(defaultState().settings, data.settings);
      if (data.stats) state.stats = data.stats;
      // Patch additif des stats (ex: recaler totalPlays sans écraser le reste)
      // Format : { statsPatch: { totalPlays: +N, dayToday: +N, byDay: { "YYYY-MM-DD": +N } } }
      if (data.statsPatch) {
        const sp = data.statsPatch;
        if (!state.stats) state.stats = { totalPlays: 0, byDay: {} };
        if (typeof sp.totalPlays === 'number') state.stats.totalPlays = (state.stats.totalPlays || 0) + sp.totalPlays;
        if (typeof sp.totalSeconds === 'number') state.stats.totalSeconds = (state.stats.totalSeconds || 0) + sp.totalSeconds;
        if (typeof sp.dayToday === 'number') {
          const k = todayKey();
          if (!state.stats.byDay[k]) state.stats.byDay[k] = { plays: 0, loops: 0, seconds: 0 };
          state.stats.byDay[k].plays += sp.dayToday;
          // Met à jour bestDay si on dépasse
          if (state.stats.byDay[k].plays > (state.stats.bestDay?.plays || 0)) {
            state.stats.bestDay = { date: k, plays: state.stats.byDay[k].plays };
          }
        }
        if (sp.byDay && typeof sp.byDay === 'object') {
          Object.keys(sp.byDay).forEach(k => {
            if (!state.stats.byDay[k]) state.stats.byDay[k] = { plays: 0, loops: 0, seconds: 0 };
            state.stats.byDay[k].plays += sp.byDay[k];
          });
        }
      }
      // Patch partiel du challenge (ex: restaurer le compteur sans toucher aux stats)
      if (data.challenge) state.challenge = Object.assign(state.challenge, data.challenge);
      if (Array.isArray(data.notes)) state.notes = data.notes;
      if (data.ui) state.ui = Object.assign(state.ui || {}, data.ui);
      if (typeof data.onboardingDone === 'boolean') state.onboardingDone = data.onboardingDone;
      saveState();
      applyTheme();
      applyLangTabs();
      toast(t('toast_imported'));
      render();
    } catch(err) { toast(t('toast_invalid_file')); }
  };
  reader.readAsText(file);
}

let toastTimeout;

  if (toastTimeout) clearTimeout(toastTimeout);

  document.body.appendChild(el);

}

// Modal de confirmation custom (remplace confirm() natif moche)
// Retourne une Promise<boolean>. Resolve une seule fois : évite les double-triggers.
function confirmAsync(message, okLabel, cancelLabel) {
  return new Promise((resolve) => {
    // Si une modal est déjà ouverte, on l'enlève (évite les empilements)
    document.querySelectorAll('.confirm-overlay').forEach(el => el.remove());
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-modal">
        <div class="confirm-msg">${message}</div>
        <div class="confirm-actions">
          <button class="confirm-btn confirm-cancel">${cancelLabel || t('cancel')}</button>
          <button class="confirm-btn confirm-ok">${okLabel || 'OK'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    let resolved = false;
    const done = (val) => {
      if (resolved) return;
      resolved = true;
      overlay.remove();
      resolve(val);
    };
    overlay.querySelector('.confirm-ok').addEventListener('click', () => done(true));
    overlay.querySelector('.confirm-cancel').addEventListener('click', () => done(false));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) done(false); });
  });
}
